<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCT - 도면 관리</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/bctechsemi/bct/refs/heads/main/images/bct_favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* Theme (shared with index.html via the same storage key). Applied before first paint. */
(function(){
  try{ document.documentElement.setAttribute('data-theme', localStorage.getItem('bct_hub_theme') === 'dark' ? 'dark' : 'light'); }
  catch(e){ document.documentElement.setAttribute('data-theme', 'light'); }
})();
function isDarkTheme(){ return document.documentElement.getAttribute('data-theme') === 'dark'; }
/* Chart colours that follow the theme */
function clayChart(k){
  var d = isDarkTheme();
  return ({ line: d ? '#A4D4C5' : '#1A3A3A', grid: d ? '#2B3D3C' : '#EBE6D6', ref: d ? '#7E857C' : '#9A968A', text: d ? '#A3A89F' : '#6A6A6A' })[k];
}
</script>
<style>
  :root{
    /* ---- Meta-derived design tokens ---- */
    --primary:#0064E0; --primary-deep:#0457CB; --primary-soft:#0091FF; --on-primary:#FFFFFF;
    --ink-button:#000000; --on-ink-button:#FFFFFF;
    --fb-blue:#1876F2;
    --success:#31A24C; --attention:#F2A918; --warning:#F7B928;
    --critical:#E41E3F; --critical-strong:#F0284A; --pink:#FF3D8F;
    --canvas:#FFFFFF; --surface-soft:#F1F4F7;
    --ink-deep:#0A1317; --ink:#1C1E21; --charcoal:#444950; --slate:#4B4C4F;
    --steel:#5D6C7B; --stone:#8595A4;
    --hairline:#CED0D4; --hairline-soft:#DEE3E9; --disabled-text:#BCC0C4;
    --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:16px; --r-xxl:24px; --r-xxxl:32px; --r-full:100px;
    --sp-xxs:4px; --sp-xs:8px; --sp-sm:10px; --sp-md:12px; --sp-base:16px; --sp-lg:20px; --sp-xl:24px; --sp-xxl:32px;
    --font: 'Inter','Noto Sans KR',-apple-system,sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--surface-soft); color:var(--ink);
    font-family:var(--font); font-size:14px; line-height:1.43; letter-spacing:-0.14px;
  }
  .num{ font-variant-numeric:tabular-nums; }

  /* ---- topbar ---- */
  .topbar{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:20px 32px; background:var(--canvas); border-bottom:1px solid var(--hairline-soft);
  }
  .brand{ display:flex; align-items:center; gap:16px; }
  .brand img{ height:56px; width:auto; display:block; }
  .brand-text-kr{ font-family:'Black Han Sans','Noto Sans KR',sans-serif; font-weight:400; font-size:34px; color:var(--ink-deep); letter-spacing:.5px; text-align:center; }
  .brand-text-sub{ font-size:12px; color:var(--steel); margin-top:2px; text-align:center; }
  .conn-dot{
    display:inline-block; width:14px; height:14px; border-radius:50%;
    margin-left:12px; vertical-align:middle; box-shadow:0 0 0 2px var(--canvas);
  }
  .topbar-actions{ display:flex; align-items:center; gap:10px; }
  .ops-hub-btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:6px 6px 6px 18px; border-radius:999px; text-decoration:none;
    background:linear-gradient(135deg, #4A7FD1 0%, #2358A8 55%, #153B78 100%);
    color:#fff; font-weight:700; font-size:13.5px; white-space:nowrap;
    box-shadow:0 8px 18px -6px rgba(21,59,120,.55), inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .15s, box-shadow .15s;
  }
  .ops-hub-btn:hover{ transform:translateY(-1px); box-shadow:0 12px 24px -6px rgba(21,59,120,.6), inset 0 1px 0 rgba(255,255,255,.32); }
  .ops-hub-btn:active{ transform:translateY(0); }
  .ops-hub-btn-icon{
    width:26px; height:26px; border-radius:50%; background:#fff; color:#1F4E9C; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .ops-hub-btn-icon svg{ width:14px; height:14px; }
  .user-email{ font-size:12px; color:var(--steel); margin-right:4px; }
  .ruler{ height:3px; background:linear-gradient(90deg, var(--primary), var(--primary-soft) 50%, var(--hairline-soft) 50%); background-size:200% 100%; opacity:.9; }

  .section-nav{ background:var(--canvas); border-bottom:1px solid var(--hairline-soft); padding:14px 32px; display:flex; justify-content:center; }
  .section-tabs{ display:flex; gap:8px; justify-content:center; }
  .section-tab{
    font-family:var(--font); font-weight:700; font-size:14px; letter-spacing:-0.14px;
    padding:9px 20px; border-radius:var(--r-full); border:1px solid var(--hairline);
    background:var(--canvas); color:var(--ink); cursor:pointer;
  }
  .section-tab.active{ background:var(--ink-deep); color:var(--canvas); border-color:var(--ink-deep); }
  .section-tab-link{ text-decoration:none; display:inline-flex; align-items:center; gap:4px; }
  .section-tab-link:hover{ background:var(--surface-soft); }

  .content{ padding:28px 32px 64px; max-width:min(1800px, 96vw); margin:0 auto; }
  .page-head h1{ font-family:var(--font); font-weight:500; font-size:24px; line-height:1.25; color:var(--ink-deep); margin:0 0 4px; letter-spacing:-0.2px; }
  .page-head p{ font-size:14px; color:var(--steel); margin:0 0 22px; }

  /* ---- cards ---- */
  .card-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  .stat-card{ background:var(--canvas); border:1px solid var(--hairline-soft); border-radius:var(--r-xl); padding:20px; }
  .stat-label{ font-size:12px; color:var(--steel); margin-bottom:8px; }
  .stat-value{ font-family:var(--font); font-size:24px; font-weight:600; color:var(--ink-deep); }

  /* ---- pill quick-filter bar (also used for section tabs styling family) ---- */
  .cat-bar{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .cat-btn{
    font-family:var(--font); font-size:13px; font-weight:700; letter-spacing:-0.13px;
    padding:9px 16px; border-radius:var(--r-full); border:1px solid var(--hairline);
    background:var(--canvas); color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:8px;
  }
  .cat-btn .count{ font-size:11px; padding:2px 8px; border-radius:var(--r-full); background:var(--surface-soft); color:var(--steel); }
  .cat-btn.active{ background:var(--ink-deep); color:var(--canvas); border-color:var(--ink-deep); }
  .cat-btn.active .count{ background:rgba(255,255,255,.22); color:#fff; }

  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:12px; flex-wrap:wrap; }
  .search-input{ width:300px; }

  /* ---- form controls ---- */
  .input, .select{
    font-family:var(--font); font-size:14px; color:var(--ink);
    background:var(--canvas); border:1px solid var(--hairline); border-radius:var(--r-lg);
    padding:0 14px; height:44px; width:100%;
  }
  .input:focus, .select:focus{ outline:none; border:2px solid var(--fb-blue); padding:0 13px; }
  .btn{
    font-family:var(--font); font-weight:700; font-size:12.5px; letter-spacing:-0.13px;
    padding:7px 18px; border-radius:999px; border:2px solid transparent; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn-primary{ background:var(--primary); color:var(--on-primary); border-color:var(--primary); }
  .btn-primary:hover{ background:var(--primary-deep); border-color:var(--primary-deep); }
  .btn-ghost{ background:transparent; color:var(--ink-deep); border:2px solid rgba(10,19,23,.14); }
  .btn-ghost:hover{ background:var(--surface-soft); }
  .btn-danger{ background:transparent; color:var(--critical); border:2px solid var(--critical); }
  .btn-danger:hover{ background:#FDE8EC; }
  .btn-sm{ padding:7px 16px; font-size:12px; }

  /* ---- table ---- */
  .table-wrap{ background:var(--canvas); border:1px solid var(--hairline-soft); border-radius:var(--r-xl); overflow:hidden; }
  .table-scroll-top{ overflow-x:auto; overflow-y:hidden; height:14px; border-bottom:1px solid var(--hairline-soft); }
  .table-scroll-top-inner{ height:1px; }
  .table-scroll{ overflow:auto; max-height:66vh; }
  .toggle-btn{
    width:22px; height:22px; border-radius:50%; border:none; padding:0;
    background:rgba(0,100,224,.10); color:var(--primary);
    display:inline-flex; align-items:center; justify-content:center;
    font-size:10px; cursor:pointer; line-height:1;
  }
  .toggle-btn:hover{ background:rgba(0,100,224,.2); }
  .component-panel table.table{ width:100%; }
  .component-panel table.table td{ text-align:center; }
  .component-panel .progress-wrap{ justify-content:center; margin:0 auto; }
  table.table{ width:100%; border-collapse:collapse; font-size:13px; min-width:1400px; }
  table.table th{
    text-align:center; font-weight:700; color:var(--steel); font-size:11px;
    text-transform:uppercase; letter-spacing:.4px; padding:12px 14px; border-bottom:1px solid var(--hairline-soft);
    background:var(--canvas); white-space:nowrap; position:sticky; top:0;
  }
  table.table td{ padding:12px 14px; border-bottom:1px solid var(--hairline-soft); vertical-align:middle; white-space:nowrap; }
  table.table tbody tr:hover{ background:var(--surface-soft); }
  .empty-note{ font-size:13px; color:var(--steel); padding:30px; text-align:center; }

  .badge{
    display:inline-flex; align-items:center; padding:4px 12px; border-radius:var(--r-full);
    font-size:11px; font-weight:700; letter-spacing:.2px; white-space:nowrap;
  }
  .badge-machined{ background:var(--primary); color:#fff; }
  .badge-services{ background:var(--success); color:#fff; }
  .badge-commercials{ background:var(--warning); color:var(--ink-deep); }
  .badge-green{ background:var(--success); color:#fff; }
  .badge-amber{ background:var(--attention); color:var(--ink-deep); }
  .badge-red{ background:var(--critical); color:#fff; }
  .badge-gray{ background:var(--stone); color:#fff; }
  .badge-ink{ background:var(--ink-deep); color:#fff; }

  .progress-wrap{ display:flex; align-items:center; gap:8px; min-width:110px; }
  .progress-track{ width:64px; height:6px; background:var(--surface-soft); border-radius:var(--r-full); overflow:hidden; }
  .progress-fill{ height:100%; background:var(--primary); border-radius:var(--r-full); }
  .progress-text{ font-size:11.5px; color:var(--steel); }

  .completed-input{
    width:64px; padding:5px 7px; border-radius:var(--r-md); border:1px solid var(--hairline);
    font-family:var(--font); font-size:12.5px; text-align:right;
  }
  .completed-input:focus{ outline:2px solid var(--fb-blue); outline-offset:1px; }

  /* ---- modal ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,19,23,.5); display:flex;
    align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; z-index:60;
  }
  .modal-card{
    background:var(--canvas); border-radius:var(--r-xxl); width:100%; max-width:760px; padding:28px 30px 26px;
    box-shadow:0 20px 60px rgba(10,19,23,.3);
  }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .modal-head h2{ font-family:var(--font); font-size:18px; font-weight:600; margin:0; color:var(--ink-deep); }
  .modal-close{ background:none; border:none; font-size:18px; color:var(--steel); cursor:pointer; line-height:1; padding:4px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
  .form-field{ display:flex; flex-direction:column; gap:6px; }
  .form-field.span-2{ grid-column:1 / -1; }
  .form-field label{ font-size:12px; color:var(--slate); font-weight:700; }
  .form-field .req{ color:var(--critical); }
  .form-hint{ font-size:11.5px; color:var(--steel); margin-top:10px; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; padding-top:16px; border-top:1px solid var(--hairline-soft); }
  .field-error{ font-size:12.5px; color:var(--critical-strong); margin-bottom:10px; display:none; }
  .field-error.show{ display:block; }

  /* ---- login ---- */
  .login-wrap{ min-height:70vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .login-card{ width:100%; max-width:380px; background:var(--canvas); border:1px solid var(--hairline-soft); border-radius:var(--r-xxl); padding:36px 32px; text-align:center; box-shadow:0 4px 24px rgba(10,19,23,.05); }
  .login-logo{ height:60px; width:auto; margin:0 auto 20px; display:block; }
  .login-title{ font-family:var(--font); font-size:18px; font-weight:600; color:var(--ink-deep); margin-bottom:20px; }
  .login-card .form-field{ text-align:left; margin-bottom:12px; }

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--ink-deep); color:#fff; padding:13px 22px; border-radius:var(--r-full);
    font-size:13px; font-weight:500; box-shadow:0 10px 30px rgba(10,19,23,.3); z-index:70;
  }

  /* ================================================================
     BCT Clay theme (same design system as index.html / repair_service_hub.html)
     Overrides the older Meta-derived tokens above. Keep this block last.
     ================================================================ */
  @font-face{ font-family:'KIMM'; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2212@1.0/KIMM_Light.woff2') format('woff2'); font-weight:300; font-display:swap; }
  @font-face{ font-family:'KIMM'; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2212@1.0/KIMM_Bold.woff2') format('woff2'); font-weight:700; font-display:swap; }
  :root{
    /* clay cream surfaces */
    --canvas:#FFFDF8; --surface-soft:#FAF5E8; --surface-card:#F5F0E0; --surface-strong:#EBE6D6; --page-bg:#FFFAF0;
    --ink-deep:#0A0A0A; --ink:#1F1F1F; --charcoal:#3A3A3A; --slate:#3A3A3A;
    --steel:#6A6A6A; --stone:#9A968A;
    --hairline:#DDD6C3; --hairline-soft:#EBE6D6; --disabled-text:#BDB7A8;
    /* primary = clay teal, focus = ink */
    --primary:#1A3A3A; --primary-deep:#0A0A0A; --primary-soft:#3F8484; --on-primary:#FFFFFF;
    --fb-blue:#0A0A0A;
    /* clay accents */
    --clay-pink:#FF4D8B; --clay-lavender:#B8A4ED; --clay-peach:#FFB084; --clay-ochre:#E8B94A; --clay-mint:#A4D4C5; --clay-teal:#1A3A3A;
    --success:#2E8A5E; --success-bg:#E3F2EA; --attention:#D9A12E; --warning:#E8B94A;
    --critical:#E0355C; --critical-strong:#E0355C; --critical-bg:#FDE6EC; --pink:#FF4D8B;
    --r-md:10px; --r-lg:12px; --r-xl:20px; --r-xxl:24px; --r-full:9999px;
    --font:'Google Sans','Gowun Batang',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-head:'KIMM','Google Sans','Gowun Batang',sans-serif;
    --font-mono:'JetBrains Mono','Gowun Batang',ui-monospace,monospace;
  }
  body{ background:var(--page-bg); color:var(--charcoal); -webkit-font-smoothing:antialiased; letter-spacing:0; }
  ::selection{ background:var(--clay-lavender); color:#0A0A0A; }

  /* topbar */
  .topbar{ background:var(--page-bg); border-bottom:1px solid var(--hairline-soft); padding:22px 32px 18px; }
  .brand img{ height:48px; }
  .brand-text-kr, .brand-text-en{
    font-family:var(--font-head) !important; font-weight:700; font-size:30px; letter-spacing:-.02em; color:var(--ink-deep);
  }
  .brand-text-sub{ font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; color:var(--steel); margin-top:4px; }
  .conn-dot{ box-shadow:0 0 0 3px var(--page-bg); }
  .ruler{ display:none; }
  .ops-hub-btn{
    background:var(--ink-deep); color:var(--on-ink); box-shadow:none; font-weight:600;
  }
  .ops-hub-btn:hover{ background:var(--ink-hover); box-shadow:none; transform:translateY(-1px); }
  .ops-hub-btn-icon{ background:var(--clay-peach); color:#0A0A0A; }
  .user-email{ font-family:var(--font-mono); font-size:11px; color:var(--steel); }

  /* section tabs: pill group like the hub language toggle */
  .section-nav{ background:var(--page-bg); border-bottom:1px solid var(--hairline-soft); }
  .section-tabs{ display:inline-flex; gap:2px; padding:4px; background:var(--surface-card); border:none; border-radius:var(--r-full); }
  .section-tab{ border:none; background:transparent; color:var(--steel); font-weight:600; }
  .section-tab:hover, .section-tab-link:hover{ color:var(--ink-deep); background:transparent; }
  .section-tab.active{ background:var(--ink-deep); color:var(--on-ink); border-color:var(--ink-deep); box-shadow:none; }

  /* headings: KIMM */
  .page-head h1{ font-family:var(--font-head); font-weight:700; font-size:clamp(26px,2.4vw,32px); letter-spacing:-.02em; color:var(--ink-deep); margin-bottom:8px; }
  .page-head p{ color:var(--steel); }
  .panel h2, .modal-head h2, .login-title, .alert-section-head h3{ font-family:var(--font-head); font-weight:700; letter-spacing:-.01em; color:var(--ink-deep); }
  .panel h2{ font-size:18px; }
  .modal-head h2, .login-title{ font-size:20px; }

  /* stat cards: saturated clay cards */
  .stat-card{ border:none; border-radius:var(--r-xxl); padding:22px 24px; background:var(--clay-mint); color:#0A0A0A; }
  .card-grid > .stat-card:nth-child(5n+1){ background:var(--clay-teal); color:#FFFFFF; }
  .card-grid > .stat-card:nth-child(5n+2){ background:var(--clay-lavender); }
  .card-grid > .stat-card:nth-child(5n+3){ background:var(--clay-peach); }
  .card-grid > .stat-card:nth-child(5n+4){ background:var(--clay-mint); }
  .card-grid > .stat-card:nth-child(5n+5){ background:var(--clay-ochre); }
  .stat-card .stat-label{ color:inherit; opacity:.78; font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; }
  .stat-card .stat-value{ color:inherit; font-family:var(--font-head); font-weight:700; font-size:28px; letter-spacing:-.01em; }
  .stat-card .stat-value.good, .stat-card .stat-value.warn, .stat-card .stat-value.bad{ color:inherit; }
  .stat-card .stat-value.good::before, .stat-card .stat-value.warn::before, .stat-card .stat-value.bad::before{
    content:''; display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; vertical-align:middle;
    box-shadow:0 0 0 2px rgba(255,255,255,.7);
  }
  .stat-card .stat-value.good::before{ background:var(--success); }
  .stat-card .stat-value.warn::before{ background:var(--attention); }
  .stat-card .stat-value.bad::before{ background:var(--critical); }

  /* panels, tables, banners */
  .panel, .table-wrap{ background:var(--canvas); border:1px solid var(--hairline-soft); border-radius:var(--r-xxl); }
  .procedure-banner, .procedure-link-compact{ background:var(--surface-card); border-color:transparent; }
  .procedure-banner-link:hover, .procedure-link-compact:hover{ background:var(--canvas); border-color:var(--ink-deep); }
  .procedure-banner-link .procedure-title, .procedure-link-compact .procedure-title{ color:var(--ink-deep); }
  table.table th{ background:var(--surface-soft); color:var(--steel); font-family:var(--font-mono); font-weight:600; font-size:10.5px; letter-spacing:.06em; }
  table.table tbody tr:hover, .alert-row:hover{ background:var(--surface-soft); }
  .unit-tag{ background:var(--surface-card); }

  /* pills: filter bar + range pills */
  .cat-btn{ border:none; background:var(--surface-card); color:var(--charcoal); font-weight:600; }
  .cat-btn:hover{ background:var(--surface-strong); }
  .cat-btn .count{ background:rgba(255,255,255,.7); color:var(--steel); }
  .cat-btn.active{ background:var(--ink-deep); color:var(--on-ink); }
  .range-pills{ background:var(--surface-card); border:none; }
  .range-pill.active{ background:var(--ink-deep); color:var(--on-ink); box-shadow:none; }

  /* buttons */
  .btn{ font-weight:600; }
  .btn-primary{ background:var(--ink-deep); border-color:var(--ink-deep); color:var(--on-ink); }
  .btn-primary:hover{ background:var(--ink-hover); border-color:var(--ink-hover); }
  .btn-ghost{ background:var(--surface-card); border-color:transparent; color:var(--ink-deep); }
  .btn-ghost:hover{ background:var(--surface-strong); }
  .btn-danger{ background:transparent; color:var(--critical); border-color:rgba(224,53,92,.35); }
  .btn-danger:hover{ background:var(--critical-bg); border-color:var(--critical); }
  .toggle-btn{ background:var(--surface-card); color:var(--ink-deep); }
  .toggle-btn:hover{ background:var(--surface-strong); }
  .stepper-btn{ background:var(--surface-card); border-color:var(--hairline); }
  .stepper-btn:hover:not(:disabled){ border-color:var(--ink-deep); color:var(--ink-deep); }

  /* inputs */
  .input, .select, .completed-input{ background:var(--input-bg); color:var(--ink); border-color:var(--hairline); }
  .input:focus, .select:focus{ border:2px solid var(--ink-deep); }
  .completed-input:focus{ outline-color:var(--ink-deep); }

  /* badges in clay colors */
  .badge-machined{ background:var(--clay-teal); color:#FFFFFF; }
  .badge-services{ background:var(--clay-lavender); color:#0A0A0A; }
  .badge-commercials{ background:var(--clay-ochre); color:#0A0A0A; }
  .badge-green{ background:var(--clay-mint); color:#0A0A0A; }
  .badge-amber{ background:var(--clay-peach); color:#0A0A0A; }
  .badge-red{ background:var(--clay-pink); color:#FFFFFF; }
  .badge-gray{ background:var(--surface-strong); color:var(--charcoal); }
  .badge-ink{ background:var(--ink-deep); color:var(--on-ink); }
  .progress-track{ background:var(--surface-strong); }
  .progress-fill{ background:var(--clay-teal); }

  /* modal, login, toast, footer */
  .modal-overlay{ background:rgba(10,10,10,.45); }
  .modal-card{ border-radius:var(--r-xxl); background:var(--page-bg); box-shadow:0 24px 60px rgba(42,29,8,.28); }
  .login-card{ border:none; background:var(--surface-soft); border-radius:var(--r-xxl); box-shadow:none; }
  .toast{ background:var(--ink-deep); color:var(--on-ink); }
  .security-footer{ border-top:1px solid var(--hairline-soft); color:var(--steel); }

  /* ---- Dark theme (clay teal night, same palette as index.html) ---- */
  :root{ --on-ink:#FFFFFF; --ink-hover:#2A2A2A; --input-bg:#FFFFFF; }
  :root[data-theme="dark"]{
    --page-bg:#0E1717; --canvas:#152221; --surface-soft:#1A2928; --surface-card:#1D2E2D; --surface-strong:#274040;
    --ink-deep:#FFFAF0; --ink:#F0EBDD; --charcoal:#D8D3C6; --slate:#D8D3C6; --steel:#A3A89F; --stone:#7E857C;
    --hairline:#35504E; --hairline-soft:#2B3D3C; --disabled-text:#5E6B69;
    --on-ink:#0A0A0A; --ink-hover:#E6E0D0; --input-bg:#0E1717;
    --clay-teal:#2A5C5C; --primary:#3F8484; --primary-soft:#A4D4C5;
    --success:#5CC28F; --success-bg:#173A2A; --critical:#FF6B8B; --critical-strong:#FF6B8B; --critical-bg:#3A1A22; --attention:#E8B94A;
    color-scheme:dark;
  }
  :root[data-theme="dark"] .brand img, :root[data-theme="dark"] .login-logo{ filter:brightness(0) invert(1); }
  :root[data-theme="dark"] .modal-card{ box-shadow:0 24px 60px rgba(0,0,0,.55); }
  :root[data-theme="dark"] .cat-btn .count{ background:rgba(255,255,255,.08); color:var(--steel); }
  :root[data-theme="dark"] .cat-btn.active .count{ background:rgba(0,0,0,.12); color:var(--on-ink); }
  body{ transition:background .2s, color .2s; }
  .theme-fab{
    position:absolute; top:22px; right:24px; z-index:55; width:38px; height:38px; border-radius:50%; border:none; padding:0;
    background:var(--surface-card); color:var(--ink-deep); display:grid; place-items:center; cursor:pointer;
  }
  .theme-fab:hover{ background:var(--surface-strong); }
  .theme-fab svg{ width:18px; height:18px; }
  .theme-fab .i-sun{ display:none; }
  :root[data-theme="dark"] .theme-fab .i-sun{ display:block; }
  :root[data-theme="dark"] .theme-fab .i-moon{ display:none; }
  @media (max-width:700px){ .theme-fab{ top:12px; right:12px; } }

  /* login: ID + fixed company domain */
  .login-id-row{ display:flex; align-items:stretch; }
  .login-id-row .input{ border-radius:var(--r-lg) 0 0 var(--r-lg); min-width:0; flex:1; }
  .login-domain{
    display:flex; align-items:center; padding:0 14px; white-space:nowrap; font-size:13.5px; color:var(--steel);
    background:var(--surface-card); border:1px solid var(--hairline); border-left:none; border-radius:0 var(--r-lg) var(--r-lg) 0;
  }
</style>
<style>
  /* ---- 도면 관리 전용 ---- */
  .card-grid.five{ grid-template-columns:repeat(5,1fr); }
  @media (max-width:1100px){ .card-grid.five{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:640px){ .card-grid.five{ grid-template-columns:repeat(2,1fr); } .content{ padding:20px 14px 48px; } .topbar{ padding:16px; } }
  .filters{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .filters .left{ display:flex; gap:8px; flex-wrap:wrap; }
  .dno{ font-family:'JetBrains Mono',ui-monospace,monospace; font-weight:600; font-size:13px; }
  .dno small{ display:block; font-family:var(--font); font-weight:600; font-size:11px; color:var(--steel); margin-top:2px; }
  .muted{ color:var(--steel); font-size:12.5px; }
  table.table td.wrap{ white-space:normal; min-width:180px; }
  table.table tbody tr{ cursor:pointer; }
  .pdf-link{ font-weight:700; font-size:12px; text-decoration:none; color:var(--primary); border:0; background:none; cursor:pointer; padding:4px 6px; border-radius:6px; font-family:var(--font); }
  .pdf-link:hover{ background:var(--surface-soft); }
  .sec{ margin-top:22px; }
  .sec-h{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .sec-h h3{ margin:0; font-size:14px; font-weight:700; color:var(--ink-deep); }
  .kv{ display:grid; grid-template-columns:120px 1fr; border:1px solid var(--hairline-soft); border-radius:var(--r-xl); overflow:hidden; }
  .kv div{ padding:9px 12px; border-bottom:1px solid var(--hairline-soft); font-size:13.5px; }
  .kv div:nth-child(odd){ background:var(--surface-soft); color:var(--steel); font-weight:600; font-size:12.5px; }
  .kv div:nth-last-child(-n+2){ border-bottom:0; }
  .list{ display:flex; flex-direction:column; gap:8px; }
  .li{ border:1px solid var(--hairline-soft); border-radius:var(--r-xl); padding:11px 14px; display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; font-size:13.5px; }
  .li .m{ grid-column:1 / -1; font-size:12.5px; color:var(--steel); }
  .li .ops{ display:flex; gap:6px; align-items:center; }
  .inline-form{ border:1px dashed var(--hairline); border-radius:var(--r-xl); padding:14px; margin-top:10px; }
  .chk-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; font-size:13px; }
  .chk-grid label{ display:flex; gap:8px; align-items:flex-start; cursor:pointer; }
  .textarea{ font-family:var(--font); font-size:14px; color:var(--ink); background:var(--canvas); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:10px 14px; width:100%; min-height:64px; resize:vertical; }
  .modal-card.wide{ max-width:980px; }
  .warn-box{ background:rgba(232,185,74,.18); border-radius:var(--r-xl); padding:10px 14px; font-size:13px; margin-top:12px; }
  @media (max-width:640px){ .kv{ grid-template-columns:96px 1fr; } .chk-grid{ grid-template-columns:1fr; } .form-grid{ grid-template-columns:1fr; } }
  .print-only{ display:none; }
  @media print{
    @page{ size:A4 landscape; margin:10mm; }
    body{ background:#fff !important; }
    #app, .theme-fab, .toast{ display:none !important; }
    .print-only{ display:block; color:#000; font-family:'Noto Sans KR',sans-serif; }
    .print-only table{ width:100%; border-collapse:collapse; font-size:8.5pt; }
    .print-only th, .print-only td{ border:1px solid #333; padding:3px 4px; text-align:center; }
    .print-only td.l{ text-align:left; }
    .print-only th{ background:#eee; }
    .print-only .ttl{ font-size:16pt; font-weight:700; letter-spacing:.2em; }
    .print-only .lbl{ background:#eee; font-weight:700; width:70px; }
  }
</style>

<body>
<div id="app"></div>
<div id="printDoc" class="print-only"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   ASENDIA 고객 도면 관리 (도면 관리대장) — Supabase CM_ASENDIA
   테이블: dwg_drawings · dwg_revisions · dwg_reviews · dwg_distributions (뷰 dwg_register)
   권한: BCT 내부(admin·engineer)만 조회·기록, 삭제는 admin. 관리본 PDF는 비공개 버킷 'drawings'.
============================================================ */
const SB = supabase.createClient('https://okiamzritzrrxhouzolm.supabase.co', 'sb_publishable_nmVTVGoaQqIMKvit5YHL5g_S7uahQlr',
  { auth:{ persistSession:true, autoRefreshToken:true, storageKey:'bct-asendia-dwg-auth' } });
const LOGIN_DOMAIN = '@bct1.co.kr';
const BUCKET = 'drawings';
const ORIGIN = { customer:'고객 원본', bct_derived:'BCT 파생' };
const STATUS = { active:'유효', obsolete:'구판 · 사용금지', void:'폐기' };
const RESULT = { approved:'적합', query:'고객 질의', rejected:'부적합' };
const CHECKS = [
  ['no_rev','도면번호 · Rev · 모델이 발주/BOM과 일치'],
  ['material','재질 · 두께 확인 (가공 가능)'],
  ['tolerance','공차 · 치수 누락 없음'],
  ['finish','표면처리 · 도금 사양 확인'],
  ['clear','불명확한 사항 없음 (있으면 고객 질의)'],
];
const st = { authView:'checking', authError:'', session:null, role:null, rows:[], model:'', filter:'', q:'', busy:false, detail:null };
const $ = id => document.getElementById(id);
const esc = v => v == null ? '' : String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Intl.DateTimeFormat('en-CA', { timeZone:'Asia/Seoul' }).format(new Date());
const d10 = v => v ? String(v).slice(0,10) : '';
const isAdmin = () => st.role === 'admin';
let toastT;
function toast(m){ let t = document.querySelector('.toast'); if(!t){ t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 2800); }
const check = r => { if(r.error) throw new Error(r.error.message); return r.data; };

/* ---------- 인증 ---------- */
async function boot(){
  const { data } = await SB.auth.getSession();
  if(data.session) await afterLogin(data.session); else { st.authView = 'login'; render(); }
}
async function afterLogin(session){
  st.session = session;
  const { data:p } = await SB.from('profiles').select('role').eq('id', session.user.id).maybeSingle();
  st.role = p && p.role;
  st.authView = (st.role === 'admin' || st.role === 'engineer') ? 'app' : 'forbidden';
  render();
  if(st.authView === 'app') await load();
}
async function login(){
  let email = ($('auth_email').value || '').trim(); const pw = $('auth_password').value;
  if(email && email.indexOf('@') === -1) email += LOGIN_DOMAIN;
  st.authError = ''; st.busy = true; render();
  const { data, error } = await SB.auth.signInWithPassword({ email, password: pw });
  st.busy = false;
  if(error){ st.authError = /invalid/i.test(error.message) ? '아이디 또는 비밀번호가 올바르지 않습니다' : error.message; render(); return; }
  await afterLogin(data.session);
}
async function logout(){ try{ await SB.auth.signOut({ scope:'local' }); }catch(e){} try{ localStorage.removeItem('bct-asendia-dwg-auth'); }catch(e){} location.reload(); }

/* ---------- 데이터 ---------- */
async function load(){
  st.rows = check(await SB.from('dwg_register').select('*').order('model').order('dwg_no').order('variant'));
  render();
}
function filtered(){
  const q = st.q.trim().toLowerCase();
  return st.rows.filter(r => (!st.model || r.model === st.model) &&
    (!st.filter || (st.filter === 'active' && r.status === 'active') || (st.filter === 'obsolete' && r.status !== 'active') ||
      (st.filter === 'derived' && r.origin === 'bct_derived') || (st.filter === 'unreviewed' && r.status === 'active' && !r.last_reviewed_on) ||
      (st.filter === 'recall' && r.recall_pending > 0)) &&
    (!q || [r.dwg_no, r.variant, r.name, r.model, r.process, r.note].some(v => v && String(v).toLowerCase().includes(q))));
}

/* ---------- 화면 ---------- */
function render(){
  const app = $('app');
  const head = `<div class="topbar"><div class="brand"><img src="https://raw.githubusercontent.com/bctechsemi/bct/refs/heads/main/images/bct_logo_transparent.png" alt="BCT 로고">
    <div><div class="brand-text-kr">도면 관리</div><div class="brand-text-sub">ASENDIA 고객 도면 관리대장 · 검토 · 배포 · 회수 (BCT 내부용)</div></div></div>
    <div class="topbar-actions"><a class="ops-hub-btn" href="index.html" aria-label="OPS Hub로 돌아가기"><span>OPS Hub</span><span class="ops-hub-btn-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span></a>
    ${st.authView === 'app' ? `<span class="user-email">${esc(st.session.user.email)}${isAdmin() ? ' · admin' : ''}</span>
      <button class="btn btn-ghost" onclick="load().then(()=>toast('새로 불러왔습니다'))">↻ 새로고침</button>
      <button class="btn btn-ghost" onclick="exportCsv()">⭳ CSV</button>
      <button class="btn btn-ghost" onclick="printLedger()">🖶 관리대장 인쇄</button>
      <button class="btn btn-primary" onclick="openDrawingForm()">+ 도면 등록</button>
      <button class="btn btn-ghost" onclick="logout()">로그아웃</button>` : st.authView === 'forbidden' ? '<button class="btn btn-ghost" onclick="logout()">로그아웃</button>' : ''}
    </div></div><div class="ruler"></div>`;
  if(st.authView === 'checking'){ app.innerHTML = head + '<div class="login-wrap"><div class="muted">확인 중…</div></div>'; return; }
  if(st.authView === 'login'){
    app.innerHTML = head + `<div class="login-wrap"><div class="login-card">
      <img class="login-logo" src="https://raw.githubusercontent.com/bctechsemi/bct/refs/heads/main/images/bct_logo_transparent.png" alt="BCT 로고">
      ${st.authError ? `<div class="field-error show">${esc(st.authError)}</div>` : ''}
      <div class="form-field"><label>아이디</label><div class="login-id-row"><input class="input" type="text" id="auth_email" placeholder="아이디" autocomplete="username" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter') login()"><span class="login-domain">@bct1.co.kr</span></div></div>
      <div class="form-field"><label>비밀번호</label><input class="input" type="password" id="auth_password" placeholder="********" onkeydown="if(event.key==='Enter') login()"></div>
      <button class="btn btn-primary" style="width:100%;margin-top:6px;justify-content:center" onclick="login()" ${st.busy ? 'disabled' : ''}>${st.busy ? '로그인 중…' : '로그인'}</button>
      <div class="form-hint" style="margin-top:14px">ASENDIA OPS Hub 계정으로 로그인합니다.</div></div></div>`;
    setTimeout(() => $('auth_email') && $('auth_email').focus(), 30); return;
  }
  if(st.authView === 'forbidden'){
    app.innerHTML = head + `<div class="login-wrap"><div class="login-card"><div class="login-title">접근 권한이 없습니다</div>
      <p class="form-hint">고객 도면 관리대장은 BCT 내부 직원 전용입니다.</p></div></div>`; return;
  }
  const all = st.rows, act = all.filter(r => r.status === 'active');
  const cnt = { total: all.length, active: act.length, unrev: act.filter(r => !r.last_reviewed_on).length,
    out: all.reduce((s, r) => s + Number(r.copies_out || 0), 0), recall: all.reduce((s, r) => s + Number(r.recall_pending || 0), 0) };
  const rows = filtered();
  const pill = (k, t, n) => `<button class="cat-btn ${st.filter === k ? 'active' : ''}" onclick="st.filter='${k}';render()">${t}<span class="count">${n}</span></button>`;
  const mpill = (k, t) => `<button class="cat-btn ${st.model === k ? 'active' : ''}" onclick="st.model='${k}';render()">${t}</button>`;
  app.innerHTML = head + `<div class="content">
    <div class="page-head"><h1>ASENDIA 고객 도면 관리대장</h1><p>고객에게 받은 도면(AGL-1004HD · APG-2012HD)의 현재 Rev, 검토, 현장·외주 배포와 구판 회수를 기록합니다.</p></div>
    <div class="card-grid five">
      <div class="stat-card"><div class="stat-label">등록 도면</div><div class="stat-value num">${cnt.total}장</div></div>
      <div class="stat-card"><div class="stat-label">유효 (현재본)</div><div class="stat-value num">${cnt.active}장</div></div>
      <div class="stat-card"><div class="stat-label">검토 기록 없음</div><div class="stat-value num">${cnt.unrev}장</div></div>
      <div class="stat-card"><div class="stat-label">배포 중 사본</div><div class="stat-value num">${cnt.out}부</div></div>
      <div class="stat-card"><div class="stat-label">구판 회수 대기</div><div class="stat-value num">${cnt.recall}부</div></div>
    </div>
    <div class="filters"><div class="left">${mpill('', '전체 모델')}${mpill('AGL-1004HD', 'AGL-1004HD')}${mpill('APG-2012HD', 'APG-2012HD')}</div>
      <input class="input search-input" placeholder="도면번호 · 품명 · 가공 검색" value="${esc(st.q)}" oninput="st.q=this.value;renderTable()"></div>
    <div class="cat-bar">${pill('', '전체', all.length)}${pill('active', '유효', act.length)}${pill('obsolete', '구판·폐기', all.length - act.length)}${pill('derived', 'BCT 파생', all.filter(r => r.origin === 'bct_derived').length)}${pill('unreviewed', '검토 기록 없음', cnt.unrev)}${pill('recall', '회수 대기', all.filter(r => r.recall_pending > 0).length)}
      ${isAdmin() && cnt.unrev ? `<button class="btn btn-ghost btn-sm" onclick="openBulkReview()">검토 미기록 ${cnt.unrev}장 일괄 검토</button>` : ''}
      ${isAdmin() ? `<label class="btn btn-ghost btn-sm" style="cursor:pointer">PDF 일괄 연결<input type="file" accept="application/pdf" multiple hidden onchange="bulkAttachPdfs(this.files)"></label>` : ''}</div>
    <div class="table-wrap"><div class="table-scroll" id="tbl"></div></div>
  </div>`;
  renderTable();
}
function badgeStatus(r){ return r.status === 'active' ? '<span class="badge badge-green">유효</span>' : r.status === 'obsolete' ? '<span class="badge badge-red">구판 · 사용금지</span>' : '<span class="badge badge-gray">폐기</span>'; }
function badgeReview(r){
  if(!r.last_reviewed_on) return '<span class="badge badge-amber">기록 없음</span>';
  return `<span class="badge ${r.last_review_result === 'approved' ? 'badge-green' : r.last_review_result === 'query' ? 'badge-amber' : 'badge-red'}">${RESULT[r.last_review_result]}</span> <span class="muted">${r.last_reviewed_on}</span>`;
}
function renderTable(){
  const rows = filtered(), el = $('tbl'); if(!el) return;
  el.innerHTML = rows.length ? `<table class="table"><thead><tr><th>도면번호</th><th>품명</th><th>모델</th><th>구분</th><th>가공</th><th>Rev</th><th>도곽 일자</th><th>검토</th><th>배포</th><th>상태</th><th>관리본</th></tr></thead><tbody>
    ${rows.map(r => `<tr onclick="openDetail('${r.id}')">
      <td class="dno">${esc(r.dwg_no)}${r.variant ? `<small>${esc(r.variant)}</small>` : ''}</td>
      <td class="wrap">${esc(r.name)}</td><td>${esc(r.model)}</td>
      <td>${r.origin === 'customer' ? '<span class="badge badge-ink">고객 원본</span>' : '<span class="badge badge-services">BCT 파생</span>'}</td>
      <td>${esc(r.process || '—')}</td><td class="num"><b>${esc(r.current_rev || '—')}</b>${r.rev_count > 1 ? ` <span class="muted">(${r.rev_count})</span>` : ''}</td>
      <td class="num">${d10(r.rev_date) || '—'}</td><td>${badgeReview(r)}</td>
      <td>${r.copies_out ? `${r.copies_out}부` : '—'}${r.recall_pending ? ` <span class="badge badge-red">회수 ${r.recall_pending}</span>` : ''}</td>
      <td>${badgeStatus(r)}</td>
      <td>${r.pdf_path ? `<button class="pdf-link" onclick="event.stopPropagation();openPdf('${esc(r.pdf_path)}')">PDF ↗</button>` : '<span class="muted">없음</span>'}</td></tr>`).join('')}
    </tbody></table>` : '<div class="empty-note">조건에 맞는 도면이 없습니다</div>';
}

async function openPdf(path){
  const w = window.open('', '_blank');
  const { data, error } = await SB.storage.from(BUCKET).createSignedUrl(path, 600);
  if(error){ w && w.close(); toast('PDF를 열 수 없습니다: ' + error.message); return; }
  if(w) w.location = data.signedUrl; else location.href = data.signedUrl;
}

/* ---------- 모달 ---------- */
function modal(title, body, foot, wide){
  const old = $('mdl'); if(old) old.remove();   /* st.detail은 유지 (상세 창 안의 동작이 참조) */
  const o = document.createElement('div'); o.className = 'modal-overlay'; o.id = 'mdl';
  o.onclick = e => { if(e.target === o) closeModal(); };
  o.innerHTML = `<div class="modal-card ${wide ? 'wide' : ''}"><div class="modal-head"><h2>${title}</h2><button class="modal-close" onclick="closeModal()" aria-label="닫기">✕</button></div>
    <div class="field-error" id="mErr"></div><div id="mBody">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div>`;
  document.body.appendChild(o);
}

/* ---------- 저장 동작 ---------- */
async function uploadPdf(file, folder){
  if(!file) return null;
  if(file.type !== 'application/pdf') throw new Error('PDF 파일만 올릴 수 있습니다');
  const path = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2,7)}.pdf`;
  check(await SB.storage.from(BUCKET).upload(path, file, { contentType:'application/pdf', upsert:false }));
  return path;
}
async function attachPdf(revId, file, quiet){
  if(!file) return;
  try{
    const rev = st.detail ? st.detail.R.find(x => x.id === revId) : null;
    const d = st.rows.find(x => x.id === (rev ? rev.drawing_id : null));
    const path = await uploadPdf(file, d ? `${d.model}/${d.dwg_no}` : 'misc');
    check(await SB.from('dwg_revisions').update({ pdf_path: path }).eq('id', revId));
    if(!quiet){ toast('관리본 PDF를 연결했습니다'); await load(); if(d) openDetail(d.id); }
    return path;
  }catch(e){ toast('PDF 연결 실패: ' + e.message); }
}
async function saveRevision(did){
  const rev = fv('nr_rev'), desc = fv('nr_desc');
  if(!rev || !desc) return mErr('Rev와 변경 내용을 입력하세요');
  const d = st.rows.find(x => x.id === did);
  try{
    const pdf = await uploadPdf($('nr_pdf').files[0], `${d.model}/${d.dwg_no}`);
    check(await SB.from('dwg_revisions').insert({ drawing_id: did, rev, rev_date: nz(fv('nr_date')), change_desc: desc, ecn_no: nz(fv('nr_ecn')), pdf_path: pdf, is_current: true }));
    toast(`Rev ${rev}를 현재본으로 등록했습니다`); await load(); openDetail(did);
  }catch(e){ mErr(/dwg_revisions_drawing_id_rev_key/.test(e.message) ? '이미 있는 Rev입니다' : e.message); }
}
async function saveReview(ids, p){
  const who = fv(p + '_who'); if(!who) return mErr('검토자를 입력하세요');
  const checklist = Object.fromEntries(CHECKS.map(([k]) => [k, $(p + '_' + k).checked]));
  const rows = ids.map(id => { const r = st.rows.find(x => x.id === id);
    return { drawing_id: id, revision_id: r.current_revision_id, reviewed_on: fv(p + '_date') || today(), reviewer_name: who, checklist, result: $(p + '_res').value, query_note: nz(fv(p + '_note')) }; });
  try{ check(await SB.from('dwg_reviews').insert(rows)); toast(`검토 기록 ${rows.length}건을 저장했습니다`); await load(); if(ids.length === 1) openDetail(ids[0]); else closeModal(); }
  catch(e){ mErr(e.message); }
}
function openBulkReview(){
  const ids = st.rows.filter(r => r.status === 'active' && !r.last_reviewed_on).map(r => r.id);
  modal(`검토 기록 없는 유효 도면 ${ids.length}장 일괄 검토`, `<p class="form-hint" style="margin-top:0">실제로 도면을 확인한 뒤 기록하세요. 확인한 날짜와 검토자로 남습니다. 질의가 있는 도면은 일괄 기록 후 해당 도면에서 따로 기록하세요.</p>${reviewFormHtml('bk')}
    <div class="form-field" style="margin-top:12px"><label>메모 (모든 건에 기록)</label><input class="input" id="bk_note2" value="기존 보관 도면 소급 검토"></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">취소</button><button class="btn btn-primary" onclick="(function(){ const n=$('bk_note'); if(!n.value) n.value=$('bk_note2').value; saveReview(${JSON.stringify(ids).replace(/"/g, "'")}, 'bk'); })()">${ids.length}장 검토 저장</button>`);

async function nextCopyNo(){
  const ym = today().slice(2,7).replace('-', '');
  const { data } = await SB.from('dwg_distributions').select('copy_no').like('copy_no', `DWG-${ym}-%`);
  const n = Math.max(0, ...(data || []).map(x => parseInt(x.copy_no.split('-')[2], 10) || 0)) + 1;
  return `DWG-${ym}-${String(n).padStart(3, '0')}`;
}
async function saveDist(did, rid){
  const to = fv('ds_to'); if(!to) return mErr('받는 곳을 입력하세요');
  try{
    const copy_no = await nextCopyNo();
    check(await SB.from('dwg_distributions').insert({ drawing_id: did, revision_id: rid, copy_no, recipient_type: $('ds_type').value, recipient: to,
      form: $('ds_form').value, purpose: nz(fv('ds_purpose')), issued_on: fv('ds_date') || today() }));
    toast(`배포 등록 ${copy_no}`); await load(); openDetail(did);
  }catch(e){ mErr(e.message); }
}

  const how = prompt('처리 방법을 입력하세요: 회수 / 폐기 / 회수불요', '회수'); if(!how) return;
  if(!['회수','폐기','회수불요'].includes(how.trim())) return toast('회수, 폐기, 회수불요 중 하나를 입력하세요');
  try{ check(await SB.from('dwg_distributions').update({ disposal: how.trim(), recalled_on: today() }).eq('id', id));
    toast('처리했습니다'); const did = st.detail.r.id; await load(); openDetail(did); }catch(e){ toast(e.message); }
}

async function saveDrawing(id){
  const rec = { dwg_no: fv('df_no'), variant: fv('df_var'), name: fv('df_name'), model: $('df_model').value, origin: $('df_origin').value, status: $('df_status').value,
    process: nz(fv('df_proc')), received_on: nz(fv('df_recv')), received_via: nz(fv('df_via')), source_path: nz(fv('df_src')), note: nz(fv('df_note')) };
  if(!rec.dwg_no || !rec.name) return mErr('도면번호와 품명을 입력하세요');
  try{
    if(id){ check(await SB.from('dwg_drawings').update(rec).eq('id', id)); toast('수정했습니다'); await load(); openDetail(id); return; }
    const rev = fv('df_rev'); if(!rev) return mErr('Rev를 입력하세요');

async function deleteDrawing(id){

/* PDF 일괄 연결: 파일명에 도면번호(+구분)가 들어 있으면 현재 Rev에 연결합니다.
   예) GP1612362.pdf · APG-2012HD__GP1612362.pdf · AGL-1004HD__GC18030240_FG.pdf */
const VARIANT_CODE = { '완제품':'FG', '외주 BODY':'OS-BODY', '외주 PIN':'OS-PIN', 'U1':'U1' };
async function bulkAttachPdfs(files){
  files = Array.from(files || []); if(!files.length) return;
  let ok = 0; const miss = [];
  for(const f of files){
    const base = f.name.replace(/\.pdf$/i, '');
    const hit = st.rows.find(r => { const code = r.variant ? (VARIANT_CODE[r.variant] || r.variant) : '';
      return base.endsWith(r.dwg_no + (code ? '_' + code : '')) || base === r.dwg_no + (code ? '_' + code : ''); });
    if(!hit || !hit.current_revision_id){ miss.push(f.name); continue; }
    try{ const path = await uploadPdf(f, `${hit.model}/${hit.dwg_no}`);
      check(await SB.from('dwg_revisions').update({ pdf_path: path }).eq('id', hit.current_revision_id)); ok++; }
    catch(e){ miss.push(f.name + ' (' + e.message + ')'); }
  }
  await load();
  toast(`PDF ${ok}건 연결${miss.length ? ` · ${miss.length}건 미일치` : ''}`);
  if(miss.length) console.warn('연결하지 못한 파일', miss);
  return { ok, miss };
}

/* ---------- 출력 ---------- */
function exportCsv(){
  const head = ['No','도면번호','구분','품명','모델','출처','가공','현재Rev','도곽일자','개정수','최근검토일','검토결과','검토자','배포중','회수대기','상태','원본위치','비고'];
  const rows = filtered().map((r, i) => [i + 1, r.dwg_no, r.variant, r.name, r.model, ORIGIN[r.origin], r.process, r.current_rev, d10(r.rev_date), r.rev_count,
    r.last_reviewed_on, RESULT[r.last_review_result] || '', r.last_reviewer, r.copies_out, r.recall_pending, STATUS[r.status], (r.source_path || '') + '\\' + (r.file_name || ''), r.note]);
  const q = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const blob = new Blob(['﻿' + [head, ...rows].map(r => r.map(q).join(',')).join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `ASENDIA_도면관리대장_${today()}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 500);
}
function printLedger(){
  const rows = st.rows;
  $('printDoc').innerHTML = `<table style="margin-bottom:6px"><tr><td rowspan="2" class="ttl">도면 관리대장</td><td class="lbl">고객</td><td>ASENDIA (아센디아)</td><td class="lbl">대상 모델</td><td>AGL-1004HD · APG-2012HD</td>
      <td rowspan="2" style="padding:0;width:200px"><table><tr><th>작성</th><th>검토</th><th>승인</th></tr><tr><td style="height:40px"></td><td></td><td></td></tr></table></td></tr>
    <tr><td class="lbl">출력일</td><td>${today()}</td><td class="lbl">등록 도면</td><td>${rows.length}장 (유효 ${rows.filter(r => r.status === 'active').length})</td></tr></table>
    <table><thead><tr><th>No</th><th>도면번호</th><th>품명</th><th>모델</th><th>출처</th><th>Rev</th><th>도곽일자</th><th>검토일</th><th>결과</th><th>검토자</th><th>배포</th><th>회수대기</th><th>상태</th><th>비고</th></tr></thead>
    <tbody>${rows.map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.dwg_no)}${r.variant ? ' ' + esc(r.variant) : ''}</td><td class="l">${esc(r.name)}</td><td>${esc(r.model)}</td><td>${ORIGIN[r.origin]}</td><td>${esc(r.current_rev || '')}</td><td>${d10(r.rev_date)}</td>
      <td>${esc(r.last_reviewed_on || '')}</td><td>${RESULT[r.last_review_result] || ''}</td><td>${esc(r.last_reviewer || '')}</td><td>${r.copies_out || ''}</td><td>${r.recall_pending || ''}</td><td>${STATUS[r.status]}</td>
      <td class="l">${esc((r.note || '').replace('2026-11-21 기존 보관 도면 소급 일괄 등록 (고객 접수일 기록 없음)', '소급 등록').replace(/^ · /, ''))}</td></tr>`).join('')}</tbody></table>`;
  window.print();
}

SB.auth.onAuthStateChange(ev => { if(ev === 'SIGNED_OUT' && st.authView === 'app') location.reload(); });
render(); boot();

<script>
/* Light / dark toggle button (lives outside #app so re-renders keep it) */
(function(){
  var b = document.createElement('button');
  b.type = 'button'; b.className = 'theme-fab';
  b.innerHTML = '<svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>' +
                '<svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  function label(){
    var d = isDarkTheme(), ko = (document.documentElement.lang || '').indexOf('ko') === 0;
    var t = d ? (ko ? '라이트 모드로 전환' : 'Switch to light mode') : (ko ? '다크 모드로 전환' : 'Switch to dark mode');
    b.setAttribute('aria-label', t); b.title = t; b.setAttribute('aria-pressed', d ? 'true' : 'false');
  }
  function chartDefaults(){
    if(window.Chart && Chart.defaults){ Chart.defaults.color = clayChart('text'); Chart.defaults.borderColor = clayChart('grid'); }
  }
  b.onclick = function(){
    var next = isDarkTheme() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('bct_hub_theme', next); }catch(e){}
    label(); chartDefaults();
    if(typeof render === 'function'){ try{ render(); }catch(e){} }   /* redraw charts in the new colours */
  };
  document.body.appendChild(b); label();
  chartDefaults(); window.addEventListener('load', chartDefaults);
})();
</script>
