<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCT Quality Control — Adjustment &amp; Test SPC</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/bctechsemi/bct/refs/heads/main/images/bct_favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" defer></script>
<style>
  :root{
    /* ---- Meta-derived design tokens (shared with the other BCT x ASENDIA pages) ---- */
    --primary:#0064E0; --primary-deep:#0457CB; --primary-soft:#0091FF; --on-primary:#FFFFFF;
    --ink-button:#000000; --on-ink-button:#FFFFFF;
    --fb-blue:#1876F2;
    --success:#31A24C; --success-bg:#E9F6EC; --attention:#F2A918; --warning:#F7B928;
    --critical:#E41E3F; --critical-strong:#F0284A; --critical-bg:#FDE8EC; --pink:#FF3D8F;
    --canvas:#FFFFFF; --surface-soft:#F1F4F7;
    --ink-deep:#0A1317; --ink:#1C1E21; --charcoal:#444950; --slate:#4B4C4F;
    --steel:#5D6C7B; --stone:#8595A4;
    --hairline:#CED0D4; --hairline-soft:#DEE3E9; --disabled-text:#BCC0C4;
    --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:16px; --r-xxl:24px; --r-xxxl:32px; --r-full:100px;
    --sp-xxs:4px; --sp-xs:8px; --sp-sm:10px; --sp-md:12px; --sp-base:16px; --sp-lg:20px; --sp-xl:24px; --sp-xxl:32px;
    --font: 'Google Sans','Noto Sans KR',-apple-system,sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--surface-soft); color:var(--ink);
    font-family:var(--font); font-size:14px; line-height:1.43; letter-spacing:-0.1px;
  }
  .num{ font-variant-numeric:tabular-nums; }

  /* ---- topbar ---- */
  .topbar{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:20px 32px; background:var(--canvas); border-bottom:1px solid var(--hairline-soft);
  }
  .brand{ display:flex; align-items:center; gap:16px; }
  .brand img{ height:56px; width:auto; display:block; }
  .brand-text-en{ font-family:var(--font); font-weight:700; font-size:26px; color:var(--ink-deep); letter-spacing:-.3px; text-align:center; }
  .brand-text-sub{ font-size:12px; color:var(--steel); margin-top:2px; text-align:center; }
  .conn-dot{
    display:inline-block; width:14px; height:14px; border-radius:50%;
    margin-left:12px; vertical-align:middle; box-shadow:0 0 0 2px var(--canvas);
  }
  .topbar-actions{ display:flex; align-items:center; gap:10px; }
  .ops-hub-btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:6px 6px 6px 18px; border-radius:999px; text-decoration:none;
    background:linear-gradient(135deg, #4A7FD1 0%, #2358A8 55%, #153B78 100%);
    color:#fff; font-weight:700; font-size:13.5px; white-space:nowrap;
    box-shadow:0 8px 18px -6px rgba(21,59,120,.55), inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .15s, box-shadow .15s;
  }
  .ops-hub-btn:hover{ transform:translateY(-1px); box-shadow:0 12px 24px -6px rgba(21,59,120,.6), inset 0 1px 0 rgba(255,255,255,.32); }
  .ops-hub-btn:active{ transform:translateY(0); }
  .ops-hub-btn-icon{
    width:26px; height:26px; border-radius:50%; background:#fff; color:#1F4E9C; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .ops-hub-btn-icon svg{ width:14px; height:14px; }
  .user-email{ font-size:12px; color:var(--steel); margin-right:4px; }
  .ruler{ height:3px; background:linear-gradient(90deg, var(--primary), var(--primary-soft) 50%, var(--hairline-soft) 50%); background-size:200% 100%; opacity:.9; }

  .section-nav{ background:var(--canvas); border-bottom:1px solid var(--hairline-soft); padding:14px 32px; display:flex; justify-content:center; }
  .section-tabs{
    display:inline-flex; gap:2px; justify-content:center;
    padding:4px; background:var(--surface-soft); border:1px solid var(--hairline-soft); border-radius:var(--r-full);
  }
  .section-tab{
    font-family:var(--font); font-weight:700; font-size:13.5px; letter-spacing:-0.1px;
    padding:8px 22px; border-radius:var(--r-full); border:none;
    background:transparent; color:var(--steel); cursor:pointer; transition:background .15s, color .15s;
  }
  .section-tab.active{ background:var(--canvas); color:var(--ink-deep); box-shadow:0 1px 3px rgba(10,19,23,.14); }

  .content{ padding:28px 32px 64px; max-width:min(1800px, 96vw); margin:0 auto; }
  .page-head h1{ font-family:var(--font); font-weight:600; font-size:24px; line-height:1.25; color:var(--ink-deep); margin:0 0 4px; letter-spacing:-0.2px; }
  .page-head p{ font-size:14px; color:var(--steel); margin:0 0 22px; }

  /* ---- selector row ---- */
  .selector-row{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
  .spc-range-bar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  .range-label{ font-family:var(--font); font-size:12.5px; font-weight:700; color:var(--steel); }
  .range-pills{ display:inline-flex; gap:2px; padding:3px; background:var(--surface-soft); border:1px solid var(--hairline-soft); border-radius:var(--r-full); }
  .range-pill{
    font-family:var(--font); font-weight:700; font-size:12.5px; padding:6px 14px; border-radius:var(--r-full);
    border:none; background:transparent; color:var(--steel); cursor:pointer; transition:background .15s, color .15s;
  }
  .range-pill.active{ background:var(--canvas); color:var(--ink-deep); box-shadow:0 1px 3px rgba(10,19,23,.14); }
  .range-date-sep{ color:var(--steel); }
  .selector-field{ display:flex; flex-direction:column; gap:6px; min-width:220px; }
  .selector-field label{ font-size:11.5px; font-weight:700; color:var(--slate); text-transform:uppercase; letter-spacing:.4px; }

  /* ---- cards ---- */
  .card-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:20px; }
  .stat-card{ background:var(--canvas); border:1px solid var(--hairline-soft); border-radius:var(--r-xl); padding:18px 20px; }
  .stat-label{ font-size:11.5px; color:var(--steel); margin-bottom:8px; text-transform:uppercase; letter-spacing:.4px; }
  .stat-value{ font-family:var(--font); font-size:22px; font-weight:600; color:var(--ink-deep); }
  .stat-value.good{ color:var(--success); }
  .stat-value.warn{ color:var(--attention); }
  .stat-value.bad{ color:var(--critical); }

  .panel{ background:var(--canvas); border:1px solid var(--hairline-soft); border-radius:var(--r-xl); padding:24px; margin-bottom:20px; }
  .panel h2{ font-family:var(--font); font-size:15px; font-weight:700; color:var(--ink-deep); margin:0 0 16px; }
  .panel-head-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .panel-head-row h2{ margin:0; }
  .collapse-chevron{ font-size:12.5px; font-weight:700; color:var(--steel); white-space:nowrap; user-select:none; margin-left:10px; }
  .collapsible-title{ cursor:pointer; display:flex; align-items:center; margin:0; }
  .unit-info-summary{ font-family:var(--font); font-weight:400; font-size:13px; color:var(--steel); margin-left:8px; }
  .recent-entries-toolbar{ display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap; }

  /* ---- form controls ---- */
  .input, .select{
    font-family:var(--font); font-size:14px; color:var(--ink);
    background:var(--canvas); border:1px solid var(--hairline); border-radius:var(--r-lg);
    padding:0 14px; height:44px; width:100%;
  }
  .input:focus, .select:focus{ outline:none; border:2px solid var(--fb-blue); padding:0 13px; }
  .range-date-input{ width:auto; height:36px; padding:0 10px; }
  select.select{ height:44px; }
  .btn{
    font-family:var(--font); font-weight:700; font-size:12.5px; letter-spacing:-0.1px;
    padding:7px 18px; border-radius:999px; border:2px solid transparent; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn-primary{ background:var(--primary); color:var(--on-primary); border-color:var(--primary); }
  .btn-primary:hover{ background:var(--primary-deep); border-color:var(--primary-deep); }
  .btn-primary:disabled{ opacity:.55; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--ink-deep); border:2px solid rgba(10,19,23,.14); }
  .btn-ghost:hover{ background:var(--surface-soft); }
  .btn-sm{ padding:6px 14px; font-size:11.5px; }

  /* ---- entry form grid ---- */
  .meta-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px 16px; margin-bottom:22px; }
  .param-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px; }
  .param-port-group{ margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid var(--hairline-soft); }
  .param-port-group:last-child{ margin-bottom:0; padding-bottom:0; border-bottom:none; }
  .param-port-title{ font-family:var(--font); font-size:12.5px; font-weight:700; color:var(--steel); text-transform:uppercase; letter-spacing:.5px; margin:0 0 12px; }
  .form-field{ display:flex; flex-direction:column; gap:6px; }
  .form-field label{ font-size:12px; color:var(--slate); font-weight:700; display:flex; align-items:center; gap:6px; }
  .unit-tag{ font-size:10.5px; font-weight:600; color:var(--steel); background:var(--surface-soft); padding:1px 7px; border-radius:var(--r-full); }
  .voltage-flag{ color:var(--critical); font-weight:700; }
  .param-input-row{ display:flex; align-items:center; gap:8px; }
  .param-input-row .input{ flex:1; }
  .form-hint{ font-size:11px; color:var(--steel); margin-top:1px; }
  .live-badge{
    display:inline-flex; align-items:center; justify-content:center; min-width:52px; height:28px; padding:0 10px;
    border-radius:var(--r-full); font-size:10.5px; font-weight:700; letter-spacing:.3px; white-space:nowrap;
  }
  .live-badge.pending{ background:var(--surface-soft); color:var(--stone); }
  .live-badge.pass{ background:var(--success-bg); color:var(--success); }
  .live-badge.fail{ background:var(--critical-bg); color:var(--critical); }

  .form-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; padding-top:18px; border-top:1px solid var(--hairline-soft); }

  /* ---- procedure reference banner ---- */
  .procedure-banner{
    display:flex; align-items:center; gap:12px;
    background:var(--surface-soft); border:1px solid var(--hairline-soft); border-radius:var(--r-xl);
    padding:14px 18px; margin-bottom:20px;
  }
  .procedure-banner-link{ text-decoration:none; cursor:pointer; transition:background .12s, border-color .12s; }
  .procedure-banner-link:hover{ background:var(--canvas); border-color:var(--primary); }
  .procedure-icon{ font-size:20px; line-height:1; }
  .procedure-title{ font-weight:700; font-size:13.5px; color:var(--ink-deep); }
  .procedure-banner-link .procedure-title{ color:var(--primary); }
  .procedure-sub{ font-size:12px; color:var(--steel); margin-top:2px; }
  .procedure-banner-empty{ color:var(--steel); font-size:12.5px; gap:10px; }

  /* Compact inline SOP link (sits next to Model in the selector row) */
  .procedure-link-compact{
    display:flex; align-items:center; gap:8px; align-self:flex-end;
    height:44px; padding:0 14px; white-space:nowrap;
    background:var(--surface-soft); border:1px solid var(--hairline-soft); border-radius:var(--r-lg);
    text-decoration:none; transition:background .12s, border-color .12s;
  }
  .procedure-link-compact:hover{ background:var(--canvas); border-color:var(--primary); }
  .procedure-link-compact .procedure-icon{ font-size:16px; }
  .procedure-link-compact .procedure-title{ font-weight:700; font-size:12.5px; color:var(--primary); }
  .procedure-link-compact-empty{ color:var(--steel); font-size:12px; cursor:default; }
  .procedure-link-compact-empty .procedure-title{ color:var(--steel); font-weight:400; }

  /* Up/down stepper next to the SPC Parameter dropdown */
  .param-select-row{ display:flex; gap:6px; align-items:stretch; }
  .param-select-row .select{ flex:1; min-width:0; }
  .param-stepper{ display:flex; flex-direction:column; height:44px; flex:0 0 auto; }
  .stepper-btn{
    flex:1; width:30px; display:flex; align-items:center; justify-content:center;
    background:var(--surface-soft); border:1px solid var(--hairline); color:var(--ink-deep);
    font-size:8px; cursor:pointer; padding:0; line-height:1;
  }
  .stepper-btn:first-child{ border-radius:var(--r-lg) var(--r-lg) 0 0; border-bottom:none; }
  .stepper-btn:last-child{ border-radius:0 0 var(--r-lg) var(--r-lg); }
  .stepper-btn:hover:not(:disabled){ background:var(--canvas); border-color:var(--primary); color:var(--primary); }
  .stepper-btn:disabled{ opacity:.35; cursor:not-allowed; }

  /* ---- table ---- */
  .table-wrap{ background:var(--canvas); border:1px solid var(--hairline-soft); border-radius:var(--r-xl); overflow:hidden; }
  .table-scroll{ overflow:auto; max-height:56vh; }
  table.table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.table th{
    text-align:center; font-weight:700; color:var(--steel); font-size:11px;
    text-transform:uppercase; letter-spacing:.4px; padding:12px 14px; border-bottom:1px solid var(--hairline-soft);
    background:var(--canvas); white-space:nowrap; position:sticky; top:0;
  }
  table.table td{ padding:11px 14px; border-bottom:1px solid var(--hairline-soft); vertical-align:middle; white-space:nowrap; text-align:center; }
  table.table tbody tr:hover{ background:var(--surface-soft); }
  .empty-note{ font-size:13px; color:var(--steel); padding:40px 20px; text-align:center; }

  .badge{
    display:inline-flex; align-items:center; padding:4px 12px; border-radius:var(--r-full);
    font-size:11px; font-weight:700; letter-spacing:.2px; white-space:nowrap;
  }
  .badge-green{ background:var(--success); color:#fff; }
  .badge-red{ background:var(--critical); color:#fff; }
  .badge-amber{ background:var(--attention); color:#fff; }
  .badge-gray{ background:var(--stone); color:#fff; }

  /* ---- Spec Alerts ---- */
  .spec-alerts-panel{ margin-bottom:20px; }
  .download-center-panel{ margin-bottom:20px; }
  .alerts-clean-note{ color:var(--success); font-size:13.5px; font-weight:600; padding:8px 0; }
  .alerts-truncated-note{ color:var(--steel); font-size:12px; margin-bottom:14px; }
  .alert-section{ margin-top:18px; }
  .alert-section:first-of-type{ margin-top:0; }
  .alert-section-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .alert-section-head h3{ margin:0; font-family:var(--font); font-size:14px; font-weight:700; color:var(--ink-deep); }
  .alert-section-hint{ font-weight:400; font-size:12px; color:var(--steel); }
  .alert-row{ cursor:pointer; }
  .alert-row:hover{ background:var(--surface-soft); }
  .alert-value-bad{ color:var(--critical); font-weight:700; }
  .alert-value-warn{ color:var(--attention); font-weight:700; }

  /* ---- chart ---- */
  .chart-wrap{ position:relative; height:420px; }
  .chart-legend-note{ display:flex; flex-wrap:wrap; gap:16px; margin-top:14px; padding-top:14px; border-top:1px solid var(--hairline-soft); }
  .legend-item{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--steel); }
  .legend-swatch{ width:18px; height:0; border-top:2.5px solid; display:inline-block; }
  .legend-swatch.dashed{ border-top-style:dashed; }

  /* ---- login ---- */
  .login-wrap{ min-height:70vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .login-card{ width:100%; max-width:380px; background:var(--canvas); border:1px solid var(--hairline-soft); border-radius:var(--r-xxl); padding:36px 32px; text-align:center; box-shadow:0 4px 24px rgba(10,19,23,.05); }
  .login-logo{ height:60px; width:auto; margin:0 auto 20px; display:block; }
  .login-title{ font-family:var(--font); font-size:18px; font-weight:600; color:var(--ink-deep); margin-bottom:20px; }
  .login-card .form-field{ text-align:left; margin-bottom:12px; }
  .field-error{ font-size:12.5px; color:var(--critical-strong); margin-bottom:10px; display:none; }
  .field-error.show{ display:block; }

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--ink-deep); color:#fff; padding:13px 22px; border-radius:var(--r-full);
    font-size:13px; font-weight:500; box-shadow:0 10px 30px rgba(10,19,23,.3); z-index:70;
  }

  .security-footer{
    max-width:min(1800px, 96vw); margin:0 auto; padding:18px 32px 36px;
    display:flex; align-items:flex-start; gap:8px;
    font-size:11.5px; line-height:1.5; color:var(--steel);
    border-top:1px solid var(--hairline-soft);
  }

  @media (max-width:900px){
    .meta-grid{ grid-template-columns:1fr; }
    .card-grid{ grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>
<div id="app"></div>

function sbHeaders(extra){
  const token = (state.session && state.session.access_token) ? state.session.access_token : CONFIG.SUPABASE_ANON_KEY;
  return Object.assign({
    'apikey': CONFIG.SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + token,
    'Content-Type': 'application/json'
  }, extra || {});
}

/* De-duplicates concurrent refresh attempts: if several requests hit a 401 at
   nearly the same moment, they all await the same in-flight refresh instead
   of each firing their own (Supabase rotates refresh tokens on use, so a
   second concurrent refresh with the same now-consumed token would fail). */
let refreshInFlight = null;
function refreshSessionOnce(){
  if(!refreshInFlight){
    refreshInFlight = refreshSession().finally(()=>{ refreshInFlight = null; });
  }
  return refreshInFlight;
}

/* Drop-in replacement for fetch() on authenticated Supabase requests. Access
   tokens expire (typically after an hour); if that happens mid-session the
   very next save/load would otherwise fail with "JWT expired" until the page
   is reloaded. This transparently refreshes the token and retries the request
   once on a 401, so the person never sees that error at all.
   `options.headers`, if given, is the "extra" headers object exactly as you'd
   pass to sbHeaders() (e.g. {'Prefer':'return=representation'}) - sbFetch
   builds the full auth headers itself, fresh, on both the first attempt and
   the retry. */
async function sbFetch(url, options){
  options = options || {};
  const extraHeaders = options.headers || {};
  const fetchOptions = Object.assign({}, options, { headers: sbHeaders(extraHeaders) });
  let res = await fetch(url, fetchOptions);
  if(res.status === 401 && state.session){
    const refreshed = await refreshSessionOnce();
    if(refreshed){
      fetchOptions.headers = sbHeaders(extraHeaders);
      res = await fetch(url, fetchOptions);
    }
  }
  return res;
}

/* Proactively refreshes the access token shortly before it would expire, so
   sbFetch's retry-on-401 path is a safety net rather than the normal path.
   Runs only once authenticated; harmless if called again (checked via a flag). */
let sessionKeepAliveStarted = false;
function startSessionKeepAlive(){
  if(sessionKeepAliveStarted || !IS_CONFIGURED) return;
  sessionKeepAliveStarted = true;
  setInterval(()=>{
    if(state.authView === 'app' && state.session && state.session.expires_at && state.session.expires_at < Date.now() + 120000){
      refreshSessionOnce();
    }
  }, 4 * 60 * 1000);
}

/* ---------- auth ---------- */
function saveSession(s){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
function loadSavedSession(){ try{ const s = localStorage.getItem(SESSION_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function clearSavedSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

async function refreshSession(){
  if(!state.session || !state.session.refresh_token) return false;
  try{
    const res = await fetch(AUTH_URL + '/token?grant_type=refresh_token', {
      method:'POST',
      headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ refresh_token: state.session.refresh_token })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error_description || data.msg || ('HTTP ' + res.status));
    state.session = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + (data.expires_in*1000),
      user: data.user || state.session.user
    };
    saveSession(state.session);
    return true;
  } catch(e){
    return false;
  }
}

async function initAuth(){
  if(!IS_CONFIGURED){
    state.authView = 'app';
    state.loading = false;
    render();
    bootData();
    return;
  }
  const saved = loadSavedSession();
  if(saved){
    state.session = saved;
    if(!saved.expires_at || saved.expires_at < Date.now() + 30000){
      const ok = await refreshSession();
      if(!ok){ state.session = null; clearSavedSession(); }
    }
  }
  state.authView = state.session ? 'app' : 'login';
  state.loading = false;
  render();
  if(state.authView==='app'){ bootData(); startSessionKeepAlive(); }
}

async function login(){
  const emailEl = document.getElementById('auth_email');
  const passEl = document.getElementById('auth_password');
  const email = emailEl.value.trim();
  const password = passEl.value;
  if(!email || !password){ state.authError = 'Enter your email and password.'; render(); return; }
  state.authLoading = true; state.authError = ''; render();
  try{
    const res = await fetch(AUTH_URL + '/token?grant_type=password', {
      method:'POST',
      headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error_description || data.msg || ('HTTP ' + res.status));
    state.session = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + (data.expires_in*1000),
      user: data.user
    };
    saveSession(state.session);
    state.authView = 'app';
  } catch(e){
    state.authError = 'Sign-in failed: ' + e.message;
  }
  state.authLoading = false;
  render();
  if(state.authView==='app'){ bootData(); startSessionKeepAlive(); }
}

async function logout(){
  try{ await fetch(AUTH_URL + '/logout', { method:'POST', headers: sbHeaders() }); } catch(e){}
  state.session = null;
  state.authView = 'login';
  state.authError = '';

}

/* ---------- helpers ---------- */
function escAttrText(v){ return v===null||v===undefined ? '' : String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function dash(v){ return (v===null || v===undefined || v==='') ? '—' : v; }
function fmtNum(v){
  if(v===null || v===undefined || v==='') return '—';
  const n = Number(v);
  if(Number.isNaN(n)) return '—';
  return (Math.round(n*100)/100).toString();
}
/* Formats a frequency stored in kHz as the more natural unit for its magnitude
   (e.g. 430 -> "430kHz", 13560 -> "13.56MHz"), trimming trailing zeros. */
function formatFrequencyKHz(khz){
  if(khz===null || khz===undefined || khz==='') return null;
  const n = Number(khz);
  if(Number.isNaN(n)) return null;
  if(n >= 1000){
    const mhz = Math.round((n/1000)*100)/100;
    return mhz + 'MHz';
  }
  return n + 'kHz';
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function showToast(msg, duration){ state.toast = msg; render(); setTimeout(()=>{ state.toast=null; render(); }, duration || 2800); }
function enc(v){ return encodeURIComponent(v); }
function resolveDocUrl(relPath){
  if(!relPath) return null;
  // doc_path is relative to wherever THIS html file itself is opened/deployed from
  // (same folder structure as bct_asendia_qc.html, e.g. a sibling "sop_adjustment/" folder).
  // Returning it unchanged lets the browser resolve it against the current document's own
  // location — works the same whether this file is opened via file://, a local web server,
  // or hosted anywhere else, as long as the PDF folder travels with the html file.
  // Absolute URLs (e.g. a doc hosted elsewhere) still pass through unchanged.
  return String(relPath);
}

function specHint(p){
  if(!p) return '';
  const u = p.unit ? (' ' + p.unit) : '';
  if(p.limit_type==='target') return 'Target ' + fmtNum(p.target) + u + ' (exact)';
  if(p.limit_type==='range') return fmtNum(p.lsl) + u + ' – ' + fmtNum(p.usl) + u;
  if(p.limit_type==='upper') return '≤ ' + fmtNum(p.usl) + u;
  if(p.limit_type==='lower') return '≥ ' + fmtNum(p.lsl) + u;
  if(p.limit_type==='none') return 'Reference only (no spec limit)';
  return '—';
}
function evalPass(p, v){
  if(v===null || v===undefined || v==='' || Number.isNaN(Number(v))) return null;
  const n = Number(v);
  if(p.limit_type==='target') return Math.abs(n - Number(p.target)) < 1e-9;
  if(p.limit_type==='upper') return n <= Number(p.usl);
  if(p.limit_type==='lower') return n >= Number(p.lsl);
  if(p.limit_type==='range') return n >= Number(p.lsl) && n <= Number(p.usl);
  if(p.limit_type==='none') return null;
  return true;
}

    }
  } catch(e){

  }
  render();
}

function groupByModel(rows){

  rows.forEach(r=>{ (byModel[r.model] = byModel[r.model] || []).push(r); });
  Object.values(byModel).forEach(arr=>arr.sort((a,b)=>paramRank(a.parameter_code)-paramRank(b.parameter_code)));
  return byModel;
}

async function loadSpecForComponent(type){
  state.specLoading = true; render();

    const rows = DEMO_SPEC.filter(r=>r.component_type===type);
    state.specByModel = groupByModel(rows);
    const models = sortModels(Object.keys(state.specByModel));
    state.model = models.includes(state.model) ? state.model : (models[0] || null);
    state.specLoading = false;
    onModelReady();
    return;
  }
  try{
    const res = await sbFetch(SPEC_URL + '?component_type=eq.' + enc(type) + '&select=*&order=model.asc,parameter_code.asc,port.asc');
    if(!res.ok){ const t = await res.text(); throw new Error('HTTP ' + res.status + ' ' + t.slice(0,180)); }
    const rows = await res.json();
    state.specByModel = groupByModel(rows);
    state.connError = null;
  } catch(e){
    state.connError = e.message;
    state.specByModel = {};
  }
  const models = sortModels(Object.keys(state.specByModel));
  state.model = models.includes(state.model) ? state.model : (models[0] || null);
  state.specLoading = false;
  onModelReady();
}

async function loadModelInfo(type){

function onModelReady(){
  state.entryValues = {};

  state.spcParam = spec.length ? (spec.find(p=>paramKey(p.parameter_code,p.port)===state.spcParam) ? state.spcParam : paramKey(spec[0].parameter_code, spec[0].port)) : null;
  render();

    // selected model, so only reload when the type actually changed -

/* Builds the PostgREST filter for the Recent Entries search box. Serial is
   matched as a substring (this also naturally covers "search by date", since
   serials embed the date as their YYMMDD prefix). If the query looks like a
   full ISO date (YYYY-MM-DD), also OR-match it against measured_date directly -
   useful since the visible Date column shows that format, not YYMMDD. */
function recentEntriesSearchFilter(q){
  const isIsoDate = /^\d{4}-\d{2}-\d{2}$/.test(q);
  if(isIsoDate){
    return 'or=(serial.ilike.*' + enc(q) + '*,measured_date.eq.' + enc(q) + ')';
  }
  return 'serial=ilike.*' + enc(q) + '*';
}

const RECENT_ENTRIES_UNIT_COUNT = 60;

/* Guards against out-of-order responses: loadRecentEntries() is often called
   without being awaited (e.g. as a fire-and-forget refresh after a save), so
   if a second call starts before the first one's request finishes, network
   timing alone could let the OLDER call's response arrive last and overwrite
   the newer data with something stale. Each call stamps its own request with
   a token; only the most-recently-*started* call is allowed to write into
   state, regardless of which one's response actually arrives first. */
let recentEntriesRequestToken = 0;

async function loadRecentEntries(){
  const myToken = ++recentEntriesRequestToken;
  if(!state.model){ state.recentEntriesRaw = []; render(); return; }
  const q = state.recentEntriesQuery.trim();
  if(state.demoMode){
    let rows = DEMO_MEASUREMENTS.filter(r=>r.component_type===state.componentType && r.model===state.model);
    if(q){
      const ql = q.toLowerCase();
      const isIsoDate = /^\d{4}-\d{2}-\d{2}$/.test(q);
      rows = rows.filter(r => (r.serial||'').toLowerCase().includes(ql) || (isIsoDate && r.measured_date===q));
    }
    if(myToken !== recentEntriesRequestToken) return; // a newer call has since started - discard this result
    state.recentEntriesRaw = rows;
    render();
    return;
  }
  try{
    let rows;
    if(q){
      // Searching queries the full table (not capped to the recent window), so
      // older entries that have scrolled out of the default view are still
      // reachable. Secondary sort keys make row order deterministic run-to-run.
      const filter = recentEntriesSearchFilter(q);
      const url = MEASUREMENTS_URL + '?component_type=eq.' + enc(state.componentType) + '&model=eq.' + enc(state.model) +
        '&' + filter + '&select=*&order=serial.desc,parameter_code.asc,port.asc&limit=1000';
      const res = await sbFetch(url);
      rows = res.ok ? await res.json() : [];
    } else {
      rows = await fetchRecentCompleteUnits(state.componentType, state.model, RECENT_ENTRIES_UNIT_COUNT);
    }
    if(myToken !== recentEntriesRequestToken) return; // a newer call has since started - discard this result
    state.recentEntriesRaw = rows;
  } catch(e){
    if(myToken !== recentEntriesRequestToken) return;
    state.recentEntriesRaw = [];
  }
  render();
}

/* Fetches whole units for the default Recent Entries view - never a
   boundary-truncated partial unit. A plain "top N rows" fetch (the previous
   approach) slices a unit's parameter rows in half whenever the row-count
   cutoff lands mid-unit, making a fully-saved unit misleadingly show as
   PARTIAL until enough newer entries eventually push it out of the window
   entirely (and even then, a query with no secondary sort key among same-
   serial rows isn't guaranteed to return them in the same order every time,
   which is why it could intermittently look "fixed" and then wrong again).
   This fetches the N most recent DISTINCT serials first, then fetches every
   row for exactly those serials - so a unit is always shown complete or not
   at all, never sliced.

   Both steps paginate explicitly with offset/limit rather than requesting
   one large `limit=` value. Supabase's PostgREST layer enforces its own
   server-side row cap (commonly 1000, configurable, but always silently
   enforced) that overrides a larger `limit=` in the URL - a request for
   limit=10000 quietly comes back capped, with no error, no header the caller
   was checking, nothing. Whichever rows happen to fall on the wrong side of
   that silent cutoff (there's no ORDER BY guaranteeing "most-recent-first"
   priority within it) just vanish from the result - which is exactly what
   made the most-recently-saved unit intermittently show as understaffed
   here. Pagination keeps requesting the next page (by rows actually
   received, not an assumed page size) until a truly empty page comes back,
   so it's correct regardless of what the project's actual cap is set to. */
async function fetchRecentCompleteUnits(componentType, model, unitCount){
  // Step 1: paginate through `serial` values (most recent first) until
  // `unitCount` distinct serials are found.
  const idBaseUrl = MEASUREMENTS_URL + '?component_type=eq.' + enc(componentType) + '&model=eq.' + enc(model) +
    '&select=serial&order=serial.desc';
  const serials = [];
  const seen = new Set();
  let idOffset = 0;
  while(serials.length < unitCount){
    const res = await sbFetch(idBaseUrl + '&offset=' + idOffset + '&limit=1000');
    if(!res.ok) break;
    const rows = await res.json();
    if(!rows.length) break;
    for(const r of rows){
      if(!seen.has(r.serial)){ seen.add(r.serial); serials.push(r.serial); }
      if(serials.length >= unitCount) break;
    }
    idOffset += rows.length;
  }
  if(!serials.length) return [];

  // Step 2: fetch every row for exactly those serials, paginated so a large
  // result (many units x many parameters) can't be silently cut short.
  // Ordered explicitly so pagination is deterministic across requests.
  const inList = serials.map(enc).join(',');
  const rowsBaseUrl = MEASUREMENTS_URL + '?component_type=eq.' + enc(componentType) + '&model=eq.' + enc(model) +
    '&serial=in.(' + inList + ')&select=*&order=serial.desc,parameter_code.asc,port.asc';
  let allRows = [];
  let rOffset = 0;
  while(true){
    const res = await sbFetch(rowsBaseUrl + '&offset=' + rOffset + '&limit=1000');
    if(!res.ok) break;
    const rows = await res.json();
    if(!rows.length) break;
    allRows = allRows.concat(rows);
    rOffset += rows.length;
  }
  return allRows;
}

function groupUnitsByModel(rawRows){
  const byKey = {};
  rawRows.forEach(r=>{
    const key = r.model + '\u0001' + r.serial;
    if(!byKey[key]) byKey[key] = { model:r.model, serial:r.serial, measured_date:r.measured_date, inspector_name:r.inspector_name, values:{} };
    byKey[key].values[paramKey(r.parameter_code, r.port)] = r.value;
  });
  return Object.values(byKey).sort((a,b)=>{
    if(a.model !== b.model) return a.model < b.model ? -1 : 1;
    return a.serial < b.serial ? -1 : (a.serial > b.serial ? 1 : 0);
  });
}

function buildSimpleSheet(componentType, layout, groups){
  const header2 = ['MODEL','INSPECTOR','SERIAL'].concat(layout.cols.map(c=>c.label));
  const header1 = new Array(header2.length).fill(null);
  header1[0] = '-';
  layout.groups.forEach(([startCol,,label])=>{ header1[startCol-1] = label; });

  const rows = [header1, header2];
  groups.forEach(g=>{
    const row = [g.model, g.inspector_name || '', g.serial];
    layout.cols.forEach(c=>{
      let v = g.values[paramKey(c.code,'')];
      if(v===undefined || v===null) v = '';
      else if(c.formatter) v = c.formatter(v);
      row.push(v);
    });
    rows.push(row);
  });

  const merges = [ { s:{r:0,c:0}, e:{r:0,c:2} } ];
  layout.groups.forEach(([startCol,endCol])=>{
    if(endCol>startCol) merges.push({ s:{r:0,c:startCol-1}, e:{r:0,c:endCol-1} });
  });
  return { rows, merges };
}

function buildPortSheet(componentType, layout, groups){
  const header2 = ['MODEL','INSPECTOR','SERIAL','Port (Isolation)']
    .concat(layout.perPortCols.map(c=>c.label))
    .concat(layout.sharedCols.map(c=>c.label))
    .concat(layout.insLossCols.map(c=>c.label))
    .concat(layout.isolationCols.map(c=>c.label));
  const header1 = new Array(header2.length).fill(null);
  if(componentType === 'LPF'){ header1[0]='-'; header1[1]='-'; header1[2]='-'; header1[3]='-'; }
  layout.groups.forEach(([startCol,,label])=>{ header1[startCol-1] = label; });

  const rows = [header1, header2];
  const merges = [];

  groups.forEach(g=>{
    const nPorts = layout.portCountByModel(g.model);
    const pairLabels = nPorts===3 ? layout.pairLabels3 : (nPorts===2 ? layout.pairLabels2 : layout.pairLabels1);
    const blockStartRow = rows.length;

    for(let i=0;i<nPorts;i++){
      const port = 'Port' + (i+1);
      const lookupPort = layout.lookupPortAsEmpty ? '' : port; // LPF: DB has no real port dimension, everything is stored at port=''
      const row = [i===0 ? g.model : '', i===0 ? (g.inspector_name || '') : '', i===0 ? g.serial : '', pairLabels[i] || port];
      layout.perPortCols.forEach(c=>{
        const v = g.values[paramKey(c.code, lookupPort)];
        row.push(v===undefined || v===null ? '' : v);
      });
      layout.sharedCols.forEach(c=>{
        if(i===0){
          const v = g.values[paramKey(c.code, '')];
          row.push(v===undefined || v===null ? '' : v);
        } else row.push('');
      });
      layout.insLossCols.forEach(c=>{
        const v = g.values[paramKey(c.code, lookupPort)];
        row.push(v===undefined || v===null ? '' : v);
      });
      layout.isolationCols.forEach(c=>{
        const pairPort = nPorts===3 ? ['Port1-Port2','Port2-Port3','Port3-Port1'][i] : 'Port1-Port2';
        const v = g.values[paramKey(c.code, pairPort)];
        row.push(v===undefined || v===null ? '' : v);
      });
      rows.push(row);
    }

    if(nPorts>1){
      const blockEndRow = rows.length - 1;
      [0,1,2].forEach(c=> merges.push({ s:{r:blockStartRow,c}, e:{r:blockEndRow,c} }));
      const sharedStartCol = 4 + layout.perPortCols.length;
      layout.sharedCols.forEach((c,i)=> merges.push({ s:{r:blockStartRow,c:sharedStartCol+i}, e:{r:blockEndRow,c:sharedStartCol+i} }));
    }
  });

  layout.groups.forEach(([startCol,endCol])=>{
    if(endCol>startCol) merges.push({ s:{r:0,c:startCol-1}, e:{r:0,c:endCol-1} });
  });
  return { rows, merges };
}

function buildSawFilterSheet(groups){

/* Fetches every measurement row for a component type (optionally scoped to
   one model), paginating past PostgREST's default row cap. model === '__ALL__'
   means no model filter - every model under that component type. */
async function fetchMeasurementsForDownload(componentType, model){
  const pageSize = 1000;
  let offset = 0;
  let all = [];
  while(true){
    const url = MEASUREMENTS_URL + '?component_type=eq.' + enc(componentType) +
      (model !== '__ALL__' ? ('&model=eq.' + enc(model)) : '') +
      '&select=model,serial,measured_date,inspector_name,parameter_code,value,port&order=model.asc,serial.asc&offset=' + offset + '&limit=' + pageSize;
    const res = await sbFetch(url);
    if(!res.ok){ const t = await res.text(); throw new Error('HTTP ' + res.status + ' ' + t.slice(0,180)); }
    const rows = await res.json();
    all = all.concat(rows);
    if(rows.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}

    render();
    return;
  }
  try{
    const res = await sbFetch(MODELS_URL + '?component_type=eq.' + enc(type) + '&select=model&order=model.asc');
    const rows = res.ok ? await res.json() : [];
    state.downloadCenterModelsByType[type] = rows.map(r=>r.model);
  } catch(e){
    state.downloadCenterModelsByType[type] = [];
  }
  render();
}

/* ---------- Excel styling for Download Center exports ---------- */
const XLSX_FONT = { name:'Arial', size:10 };
const XLSX_HEADER_FONT = { name:'Arial', size:10, bold:true };
const XLSX_HEADER_FILL = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFDCE6F1' } }; // light pastel blue
const XLSX_THIN_BORDER = { top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'} };

/* Saw_Filter has just 1 header row (no grouped super-header); every other
   layout has 2 (group row + column-title row). */
function headerRowCountFor(componentType){ return componentType === 'Saw_Filter' ? 1 : 2; }

/* Writes {rows, merges} out as a styled .xlsx and triggers a browser download.
   Arial 10pt throughout; header rows bold with a light blue fill; gridlines
   off; every cell (header and data) gets a thin border on all sides. */
async function writeStyledWorkbook(sheetData, headerRowCount, filename){
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Data', { views: [{ showGridLines:false }] });

  sheetData.rows.forEach(row => ws.addRow(row));

  const totalCols = Math.max.apply(null, sheetData.rows.map(r=>r.length));
  const totalRows = sheetData.rows.length;

  for(let r=1; r<=totalRows; r++){
    for(let c=1; c<=totalCols; c++){
      const cell = ws.getCell(r, c);
      const isHeader = r <= headerRowCount;
      cell.font = isHeader ? XLSX_HEADER_FONT : XLSX_FONT;
      if(isHeader) cell.fill = XLSX_HEADER_FILL;
      cell.border = XLSX_THIN_BORDER;
      if(isHeader){
        const wrap = typeof cell.value === 'string' && cell.value.indexOf('\n') !== -1;
        cell.alignment = { wrapText:wrap, vertical:'center', horizontal:'center' };
      }
    }
  }

  (sheetData.merges || []).forEach(m=>{
    ws.mergeCells(m.s.r+1, m.s.c+1, m.e.r+1, m.e.c+1);
  });

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

      ? DEMO_MEASUREMENTS.filter(r=>r.component_type===componentType && (model==='__ALL__' || r.model===model))

  if(!state.model || !state.spcParam){ state.spcMeasurementsAll = []; state.spcMeasurements = []; state.spcStats = null; render(); return; }
  const activeSpec = (state.specByModel[state.model] || []).find(p=>paramKey(p.parameter_code,p.port)===state.spcParam);
  if(!activeSpec){ state.spcMeasurementsAll = []; state.spcMeasurements = []; state.spcStats = null; render(); return; }
  const code = activeSpec.parameter_code;
  const port = activeSpec.port || '';
  let rows;
  if(state.demoMode){
    rows = DEMO_MEASUREMENTS.filter(r=>r.component_type===state.componentType && r.model===state.model && r.parameter_code===code && (r.port||'')===port)
      .map(r=>({ serial:r.serial, value:r.value, measured_date:r.measured_date }))
      .sort((a,b)=> a.serial < b.serial ? -1 : a.serial > b.serial ? 1 : 0);
  } else {

/* Returns the [start, end] ISO date bounds (inclusive) for the current range
   preset, or nulls for 'all' (no filtering). String comparison against
   measured_date works directly since ISO dates sort lexicographically. */
function computeSpcRangeBounds(){
  const preset = state.spcRangePreset;
  if(preset === 'all') return { start:null, end:null };
  if(preset === 'custom') return { start: state.spcRangeStart || null, end: state.spcRangeEnd || null };
  const end = new Date();
  const start = new Date();
  if(preset === '1m') start.setMonth(start.getMonth()-1);
  else if(preset === '3m') start.setMonth(start.getMonth()-3);
  else if(preset === '6m') start.setMonth(start.getMonth()-6);
  else if(preset === '1y') start.setFullYear(start.getFullYear()-1);
  return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10) };
}

function applySpcRange(){
  const { start, end } = computeSpcRangeBounds();
  let rows = state.spcMeasurementsAll || [];
  if(start) rows = rows.filter(r => r.measured_date >= start);
  if(end) rows = rows.filter(r => r.measured_date <= end);
  state.spcMeasurements = rows;
  const activeSpec = (state.specByModel[state.model] || []).find(p=>paramKey(p.parameter_code,p.port)===state.spcParam);
  state.spcStats = computeStats(activeSpec, rows.map(r=>Number(r.value)));
  render();
}

function setSpcRangePreset(preset){
  state.spcRangePreset = preset;
  if(preset !== 'custom'){ applySpcRange(); loadSpecAlerts(); }
  else { render(); } // wait for the user to actually pick both custom dates before filtering
}
function setSpcRangeCustom(which, value){
  if(which === 'start') state.spcRangeStart = value; else state.spcRangeEnd = value;
  if(state.spcRangeStart && state.spcRangeEnd){ applySpcRange(); loadSpecAlerts(); }
  else render();
}

function computeStats(spec, values){
  const n = values.length;
  if(n===0) return { n:0 };
  const mean = values.reduce((a,b)=>a+b,0)/n;
  let ucl=null, lcl=null, sigma=null;
  if(n>=2){
    const mr = [];
    for(let i=1;i<n;i++) mr.push(Math.abs(values[i]-values[i-1]));
    const mrbar = mr.reduce((a,b)=>a+b,0)/mr.length;
    sigma = mrbar / 1.128;
    ucl = mean + 2.66*mrbar;
    lcl = mean - 2.66*mrbar;
  }
  let cp=null, cpu=null, cpl=null, cpk=null;
  if(spec && sigma!=null && sigma>0){
    if(spec.usl!=null) cpu = (Number(spec.usl)-mean)/(3*sigma);
    if(spec.lsl!=null) cpl = (mean-Number(spec.lsl))/(3*sigma);
    if(spec.usl!=null && spec.lsl!=null){ cp = (Number(spec.usl)-Number(spec.lsl))/(6*sigma); cpk = Math.min(cpu,cpl); }
    else if(spec.usl!=null){ cpk = cpu; }
    else if(spec.lsl!=null){ cpk = cpl; }
  }
  const outOfControl = (ucl!=null) ? values.filter(v=>v>ucl || v<lcl).length : 0;
  const outOfSpec = spec ? values.filter(v=>evalPass(spec,v)===false).length : 0;
  return { n, mean, sigma, ucl, lcl, cp, cpk, outOfControl, outOfSpec };
}

/* ---------- Spec Alerts (scans the whole current component type, not just
   the selected model/parameter) ---------- */
async function loadSpecAlerts(){
  if(!state.componentType){ state.specAlertsData = null; render(); return; }
  state.specAlertsLoading = true; render();
  const { start, end } = computeSpcRangeBounds();
  const ALERTS_ROW_CAP = 5000;
  let rows;
  if(state.demoMode){
    rows = DEMO_MEASUREMENTS.filter(r=>r.component_type===state.componentType);
  } else {
    try{
      let url = MEASUREMENTS_URL + '?component_type=eq.' + enc(state.componentType) +
        '&select=model,serial,parameter_code,port,value,measured_date,inspector_name&order=model.asc,serial.asc&limit=' + ALERTS_ROW_CAP;
      if(start) url += '&measured_date=gte.' + enc(start);
      if(end) url += '&measured_date=lte.' + enc(end);
      const res = await sbFetch(url);
      rows = res.ok ? await res.json() : [];
    } catch(e){
      rows = [];
    }
  }
  if(start) rows = rows.filter(r => r.measured_date >= start);
  if(end) rows = rows.filter(r => r.measured_date <= end);
  const truncated = rows.length >= ALERTS_ROW_CAP;
  state.specAlertsData = computeSpecAlerts(rows);
  state.specAlertsData.truncated = truncated;
  state.specAlertsLoadedForType = state.componentType;
  state.specAlertsLoading = false;
  render();
}

/* Groups measurements by (model, parameter_code, port) and flags three kinds
   of things worth a look:
   - specOut: individual measurements that fail their spec outright.
   - nearLimit: individual measurements that PASS but sit within 1.5 process-
     sigma of the nearest limit - a "close call" that's still in spec today
     but worth watching.
   - lowCpk: whole parameter groups (30+ samples) whose process capability
     index is below 1.33, meaning the process has little margin even though
     no individual point may have failed yet. */
function computeSpecAlerts(rows){
  const NEAR_LIMIT_SIGMA = 1.5;
  const CPK_THRESHOLD = 1.33;
  const MIN_N_FOR_CPK = 30;

  const groups = {};
  rows.forEach(r=>{
    const key = r.model + '\u0001' + r.parameter_code + '\u0001' + (r.port || '');
    if(!groups[key]) groups[key] = { model:r.model, parameter_code:r.parameter_code, port:r.port||'', rows:[] };
    groups[key].rows.push(r);
  });

  const specOut = [], nearLimit = [], lowCpk = [];

  Object.values(groups).forEach(g=>{
    const modelSpec = state.specByModel[g.model] || [];
    const spec = modelSpec.find(p=>p.parameter_code===g.parameter_code && (p.port||'')===g.port);
    if(!spec || spec.limit_type==='none' || spec.limit_type==='target') return; // "close to target" isn't a meaningful near-limit concept here

    const sortedRows = g.rows.slice().sort((a,b)=> a.serial < b.serial ? -1 : a.serial > b.serial ? 1 : 0);
    const values = sortedRows.map(r=>Number(r.value)).filter(v=>!Number.isNaN(v));
    const stats = computeStats(spec, values);

    sortedRows.forEach(r=>{
      const v = Number(r.value);
      if(Number.isNaN(v)) return;
      const pass = evalPass(spec, v);
      if(pass === false){
        specOut.push({ model:g.model, parameter_code:g.parameter_code, port:g.port, spec, value:v, row:r });
      } else if(pass === true && stats.sigma && stats.sigma > 0){
        let distance = null;
        if(spec.limit_type==='upper') distance = Number(spec.usl) - v;
        else if(spec.limit_type==='lower') distance = v - Number(spec.lsl);
        else if(spec.limit_type==='range') distance = Math.min(v - Number(spec.lsl), Number(spec.usl) - v);
        if(distance!=null && distance >= 0){
          const distanceSigma = distance / stats.sigma;
          if(distanceSigma < NEAR_LIMIT_SIGMA){
            nearLimit.push({ model:g.model, parameter_code:g.parameter_code, port:g.port, spec, value:v, row:r, distanceSigma });
          }
        }
      }
    });

    if(stats.cpk!=null && stats.n >= MIN_N_FOR_CPK && stats.cpk < CPK_THRESHOLD){
      lowCpk.push({ model:g.model, parameter_code:g.parameter_code, port:g.port, spec, stats });
    }
  });

  specOut.sort((a,b)=> a.row.measured_date < b.row.measured_date ? 1 : (a.row.measured_date > b.row.measured_date ? -1 : 0));
  nearLimit.sort((a,b)=> a.distanceSigma - b.distanceSigma);
  lowCpk.sort((a,b)=> a.stats.cpk - b.stats.cpk);

  return { specOut, nearLimit, lowCpk };
}

/* Converts an ISO date 'YYYY-MM-DD' into the YYMMDD prefix used in serials.
   Returns null for an invalid/empty date. */
function isoDateToYYMMDD(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if(!m) return null;
  return m[1].slice(2) + m[2] + m[3];
}

/* Rebuilds a serial's YYMMDD- prefix from the given date, keeping whatever
   sequence number (or other text) the user already typed after the dash.
   'currentSerial' with no recognizable 'YYMMDD-' prefix contributes no
   suffix, so the result is just a fresh 'YYMMDD-' ready to type into. */
function applyDateToSerialPrefix(dateIso, currentSerial){
  const yymmdd = isoDateToYYMMDD(dateIso);
  if(!yymmdd) return currentSerial;
  const m = /^\d{6}-(.*)$/.exec(currentSerial || '');
  const suffix = m ? m[1] : '';
  return yymmdd + '-' + suffix;
}

async function submitEntry(){
  const spec = state.specByModel[state.model] || [];
  if(!state.model || !spec.length){ showToast('Select a model first.'); return; }
  const serial = (state.entrySerial || '').trim();
  if(!serial){ showToast('Serial is required.'); return; }
  const date = state.entryDate || todayISO();
  const inspector = (state.entryInspector || '').trim() || null;
  const rows = [];
  const savedKeys = [];
  const invalid = []; // { key, label, raw } - non-blank but not parseable as a number
  spec.forEach(p=>{
    const key = paramKey(p.parameter_code, p.port);
    const raw = state.entryValues[key];
    if(raw===null || raw===undefined || raw===''){ return; } // intentionally left blank - fine, not every parameter always applies
    const n = Number(raw);
    if(Number.isNaN(n)){
      invalid.push({ key, label: p.parameter_label, raw: String(raw) });
      return;
    }
    savedKeys.push(key);
    rows.push({
      component_type: state.componentType,
      model: state.model,
      serial: serial,
      measured_date: date,
      inspector_name: inspector,
      parameter_code: p.parameter_code,
      value: n,
      unit: p.unit,
      port: p.port || ''
    });
  });
  if(!rows.length && !invalid.length){ showToast('Enter at least one measurement value.'); return; }
  if(!rows.length){
    showToast('\u26a0\ufe0f Nothing saved \u2014 ' + invalid.length + ' value' + (invalid.length===1?'':'s') + ' not recognized as a number: ' + invalid.map(x=>x.label+' ("'+x.raw+'")').join(', '), 7000);
    return;
  }

  if(state.demoMode){
    showToast('Demo mode: entry not saved. Configure Supabase to save real data.');
    return;
  }

  state.entrySubmitting = true; render();
  try{
    const res = await sbFetch(MEASUREMENTS_URL + '?on_conflict=component_type,model,serial,parameter_code,port', {
      method:'POST',
      headers: { 'Prefer':'resolution=merge-duplicates,return=representation' },
      body: JSON.stringify(rows)
    });
    if(!res.ok){ const t = await res.text(); throw new Error('HTTP ' + res.status + ' ' + t.slice(0,180)); }
    if(invalid.length){
      // Partial save: clear only the fields that actually saved, and leave the
      // invalid ones visible in the form so the operator can see and fix them
      // immediately, rather than silently losing that input on a form-clear.
      savedKeys.forEach(k => { delete state.entryValues[k]; });
      showToast('\u26a0\ufe0f Saved ' + serial + ' (' + rows.length + ' parameters) \u2014 but ' + invalid.length + ' value' + (invalid.length===1?'':'s') + ' ' + (invalid.length===1?'was':'were') + ' NOT saved (not a number): ' + invalid.map(x=>x.label+' ("'+x.raw+'")').join(', ') + '. Fix and save again.', 8000);
    } else {
      showToast('Saved ' + serial + ' (' + rows.length + ' parameters).');
      state.entryValues = {};
      state.entrySerial = '';
    }
    loadRecentEntries();
    if(state.spcParam) loadSpcData();
  } catch(e){
    showToast('Save failed: ' + e.message);
  }
  state.entrySubmitting = false;
  render();
}

function clearEntryForm(){
  state.entryValues = {};
  state.entryDate = todayISO();
  state.entrySerial = applyDateToSerialPrefix(state.entryDate, '');
  state.entryInspector = '';
  state.entryInspectorCustom = false;
  render();
}

function groupUnits(rawRows){
  const bySerial = {};
  rawRows.forEach(r=>{
    if(!bySerial[r.serial]) bySerial[r.serial] = { serial:r.serial, measured_date:r.measured_date, inspector_name:r.inspector_name, values:{} };
    bySerial[r.serial].values[paramKey(r.parameter_code, r.port)] = r.value;
  });
  return Object.values(bySerial).sort((a,b)=> a.serial < b.serial ? 1 : a.serial > b.serial ? -1 : 0);
}

async function loadEntryForEdit(serial){
  // Fetches this ONE serial's data fresh and directly from the DB, rather
  // than reading from whatever happens to be cached in state.recentEntriesRaw
  // (the Recent Entries list). That cache is populated by an unawaited
  // background refresh after every save, so if two saves/reloads for the
  // same serial ever overlap, an older response can resolve after a newer
  // one and silently overwrite it with stale, incomplete data - which is
  // exactly the kind of thing "Edit" must never show, since re-saving from
  // an incomplete view could look like data went missing even though the DB
  // is correct. A direct, targeted fetch sidesteps that entirely.
  if(state.demoMode){
    const g = groupUnits(DEMO_MEASUREMENTS.filter(r=>r.component_type===state.componentType && r.model===state.model && r.serial===serial))[0];
    if(!g) return;
    applyEntryForEdit(g);
    return;
  }
  showToast('Loading ' + serial + '\u2026', 1500);
  try{
    const res = await sbFetch(
      MEASUREMENTS_URL + '?component_type=eq.' + enc(state.componentType) + '&model=eq.' + enc(state.model) +
      '&serial=eq.' + enc(serial) + '&select=*'
    );
    if(!res.ok){ const t = await res.text(); throw new Error('HTTP ' + res.status + ' ' + t.slice(0,180)); }
    const rows = await res.json();
    if(!rows.length){ showToast('No data found for ' + serial + '.'); return; }
    const g = groupUnits(rows)[0];
    applyEntryForEdit(g);
  } catch(e){
    showToast('Failed to load ' + serial + ': ' + e.message);
  }
}

function applyEntryForEdit(g){
  state.section = 'entry';
  state.entrySerial = g.serial;
  state.entryDate = g.measured_date || todayISO();

function renderSelectorRow(includeParam, includeSopLink){
  const spec = state.specByModel[state.model] || [];
  const models = sortModels(Object.keys(state.specByModel));
  const typeOptions = state.componentTypes.map(t=>'<option value="' + t + '" ' + (t===state.componentType?'selected':'') + '>' + componentTypeLabel(t) + '</option>').join('');
  const modelOptions = models.length
    ? models.map(m=>'<option value="' + escAttrText(m) + '" ' + (m===state.model?'selected':'') + '>' + escAttrText(m) + '</option>').join('')
    : '<option value="">No models configured</option>';
  let out = '<div class="selector-row">' +
    '<div class="selector-field"><label>Component Type</label><select class="select" onchange="setComponentType(this.value)">' + typeOptions + '</select></div>' +
    '<div class="selector-field"><label>Model</label><select class="select" onchange="setModel(this.value)" ' + (models.length?'':'disabled') + '>' + modelOptions + '</select></div>';
  if(includeSopLink){
    out += renderProcedureLinkCompact();
  }
  if(includeParam){
    const sortedSpec = spec.slice().sort((a,b)=>{
      const rp = portRank(a.port) - portRank(b.port);
      return rp !== 0 ? rp : paramRank(a.parameter_code) - paramRank(b.parameter_code);
    });
    const paramKeys = sortedSpec.map(p=>paramKey(p.parameter_code, p.port));
    const paramOptions = sortedSpec.length
      ? sortedSpec.map(p=>{
          const key = paramKey(p.parameter_code, p.port);
          const label = escAttrText(p.parameter_label) + (p.port ? ' \u2014 ' + escAttrText(p.port) : '');
          return '<option value="' + escAttrText(key) + '" ' + (key===state.spcParam?'selected':'') + '>' + label + '</option>';
        }).join('')
      : '<option value="">No parameters</option>';
    const idx = paramKeys.indexOf(state.spcParam);
    const atStart = idx <= 0;
    const atEnd = idx === -1 || idx >= paramKeys.length - 1;
    out += '' +
    '<div class="selector-field"><label>Parameter</label><div class="param-select-row">' +
      '<select class="select" onchange="setSpcParam(this.value)" ' + (spec.length?'':'disabled') + '>' + paramOptions + '</select>' +
      '<div class="param-stepper">' +
        '<button class="stepper-btn" onclick="stepSpcParam(-1)" ' + (atStart?'disabled':'') + ' title="Previous parameter" aria-label="Previous parameter">\u25b2</button>' +
        '<button class="stepper-btn" onclick="stepSpcParam(1)" ' + (atEnd?'disabled':'') + ' title="Next parameter" aria-label="Next parameter">\u25bc</button>' +
      '</div>' +
    '</div></div>';
  }
  out += '</div>';
  return out;
}

/* Steps the SPC Parameter selection to the previous (-1) or next (+1) entry
   in the same sorted order the dropdown itself uses, so the arrows and the
   dropdown always agree on what "next" means. Clamped at both ends rather
   than wrapping. */
function stepSpcParam(direction){
  const spec = state.specByModel[state.model] || [];
  const sortedSpec = spec.slice().sort((a,b)=>{
    const rp = portRank(a.port) - portRank(b.port);
    return rp !== 0 ? rp : paramRank(a.parameter_code) - paramRank(b.parameter_code);
  });
  const keys = sortedSpec.map(p=>paramKey(p.parameter_code, p.port));
  if(!keys.length) return;
  const idx = keys.indexOf(state.spcParam);
  let newIdx = (idx === -1 ? 0 : idx + direction);
  if(newIdx < 0) newIdx = 0;
  if(newIdx > keys.length - 1) newIdx = keys.length - 1;
  if(newIdx === idx) return;
  state.spcParam = keys[newIdx];
  loadSpcData();
}

/* Groups a model's spec rows by port (Combiner/Splitter measure the same parameter
   separately per physical port). Port-less components (everything except Combiner/
   Splitter today) always resolve to a single unlabeled group, so their form looks
   exactly as it did before this existed - no visual change for those. */
function groupSpecByPort(spec){
  const ports = Array.from(new Set(spec.map(p=>p.port || '')));
  if(ports.length <= 1){
    return [{ port:null, rows: spec }];
  }
  const byPort = {};
  spec.forEach(p=>{
    const port = p.port || '';
    (byPort[port] = byPort[port] || []).push(p);
  });
  return Object.keys(byPort).sort((a,b)=>portRank(a)-portRank(b)).map(port=>({ port, rows: byPort[port] }));
}

/* Highlights the "6V"/"8V" control-voltage markers in Data Entry field
   labels in red, so the two internal-mode test points (set via the Excite
   Control JIG's control voltage) are easy to tell apart at a glance.
   Data Entry only, per request - other label usages (SPC dropdown, Spec
   Alerts rows) are left plain. Word-boundary-guarded so it only matches a
   standalone "6V"/"8V", not e.g. the "6V" inside "36V" if that ever appears. */
function highlightVoltageLabel(label){
  return escAttrText(label).replace(/(?<!\d)([68]V)(?!\d)/g, '<span class="voltage-flag">$1</span>');
}

function renderParamField(p){

  const badgeCls = result===null ? 'pending' : (result ? 'pass' : 'fail');
  const badgeLabel = result===null ? '\u2014' : (result ? 'PASS' : 'FAIL');
  return '<div class="form-field">' +
    '<label>' + highlightVoltageLabel(p.parameter_label) + ' <span class="unit-tag">' + escAttrText(p.unit||'') + '</span></label>' +
    '<div class="param-input-row">' +

      '<span class="live-badge ' + badgeCls + '">' + badgeLabel + '</span>' +

}

function renderParamFieldsByPort(spec){
  const groups = groupSpecByPort(spec);
  return groups.map(g=>{
    const fields = '<div class="param-grid">' + g.rows.map(renderParamField).join('') + '</div>';
    if(g.port===null) return fields;
    return '<div class="param-port-group"><h3 class="param-port-title">' + escAttrText(portLabel(g.port)) + '</h3>' + fields + '</div>';
  }).join('');

function renderRecentEntriesPanel(){

  if(!q) groups = groups.slice(0,30);
  const rows = groups.map(g=>{
    let result = 'unknown', cls='badge-gray', label='\u2014';
    if(spec.length){
      const evalSpec = spec.filter(p=>p.limit_type!=='none');
      const evals = evalSpec.map(p=> evalPass(p, g.values[paramKey(p.parameter_code, p.port)]));
      if(evals.some(e=>e===false)){ cls='badge-red'; label='FAIL'; }
      else if(evalSpec.length && evals.every(e=>e===true)){ cls='badge-green'; label='PASS'; }
      else { cls='badge-gray'; label='PARTIAL'; }

    return '<tr>' +
      '<td class="num">' + dash(g.serial) + '</td>' +

  return '' +
  '<div class="alert-section">' +
    '<div class="alert-section-head"><span class="badge badge-amber">' + items.length + '</span><h3>Low Process Capability <span class="alert-section-hint">(Cpk below 1.33, 30+ samples)</span></h3></div>' +
    '<div class="table-wrap"><div class="table-scroll"><table class="table"><thead><tr><th>Model</th><th>Parameter</th><th>n</th><th>Mean</th><th>\u03c3</th><th>Cpk</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
    moreBtn +
  '</div>';
}

function renderSpecAlertsPanel(){
  if(!state.componentType) return '';
  const collapsed = state.specAlertsCollapsed;
  const chevron = '<span class="collapse-chevron">' + (collapsed ? '\u25b8 Expand' : '\u25be Collapse') + '</span>';

  if(state.specAlertsLoading){
    const header = '<div class="panel-head-row"><h2 class="collapsible-title spec-alerts-title" onclick="toggleSpecAlerts()">Spec Alerts <span class="unit-info-summary">scanning\u2026</span></h2>' + chevron + '</div>';
    return '<div class="panel spec-alerts-panel">' + header + (collapsed ? '' : '<div class="empty-note" style="padding:30px">Scanning ' + escAttrText(componentTypeLabel(state.componentType)) + ' data\u2026</div>') + '</div>';
  }
  const data = state.specAlertsData;
  if(!data) return '';
  const total = data.specOut.length + data.nearLimit.length + data.lowCpk.length;
  const summaryText = total === 0 ? '\u2713 no findings' : (total + ' finding' + (total===1?'':'s'));
  const header = '' +
    '<div class="panel-head-row">' +
      '<h2 class="collapsible-title spec-alerts-title" onclick="toggleSpecAlerts()">Spec Alerts <span class="unit-info-summary">' + summaryText + '</span>' + chevron + '</h2>' +
      '<button class="btn btn-ghost btn-sm" onclick="loadSpecAlerts()">\u21bb Rescan</button>' +
    '</div>';

  if(collapsed){
    return '<div class="panel spec-alerts-panel">' + header + '</div>';
  }

  const truncatedNote = data.truncated ? '<div class="alerts-truncated-note">Scan capped at 5,000 rows \u2014 narrow the date range above for a complete picture.</div>' : '';
  if(total === 0){
    return '' +
    '<div class="panel spec-alerts-panel">' +
      header +
      '<div class="alerts-clean-note">\u2713 No spec-out or at-risk measurements found for ' + escAttrText(componentTypeLabel(state.componentType)) + ' in the selected range.</div>' +
      truncatedNote +
    '</div>';
  }
  return '' +
  '<div class="panel spec-alerts-panel">' +
    header +
    truncatedNote +
    renderSpecOutSection(data.specOut) +
    renderNearLimitSection(data.nearLimit) +
    renderLowCpkSection(data.lowCpk) +
  '</div>';
}

function renderSpcTab(){
  const spec = state.specByModel[state.model] || [];
  if(state.specLoading){
    return renderSelectorRow(true, false) + '<div class="empty-note" style="padding:60px 20px">Loading spec limits\u2026</div>';
  }
  if(!spec.length){
    return renderSelectorRow(true, false) + '<div class="panel"><div class="empty-note">No spec data available yet for ' + componentTypeLabel(state.componentType) + '.</div></div>';
  }
  const s = state.spcStats;
  const activeSpec = spec.find(p=>paramKey(p.parameter_code,p.port)===state.spcParam);

  if(!s || s.n===0){
    return renderSelectorRow(true, false) + renderSpcRangeBar() + renderSpecAlertsPanel() +
      '<div class="panel"><div class="empty-note">No measurement data ' + (state.spcRangePreset!=='all' ? 'in this date range' : 'yet') + ' for this parameter.</div></div>' +
      renderRecentEntriesPanel();
  }

  const cards = '' +
    statCard('Samples (n)', s.n) +
    statCard('Mean', fmtNum(s.mean) + (activeSpec && activeSpec.unit ? (' ' + activeSpec.unit) : '')) +
    statCard('Process \u03c3 (from MR)', s.sigma!=null ? fmtNum(s.sigma) : '\u2014') +
    statCardCls('Cpk', s.cpk!=null ? fmtNum(s.cpk) : '\u2014', cpkClass(s.cpk)) +
    statCardCls('Out of Spec', s.outOfSpec + ' / ' + s.n, s.outOfSpec>0 ? 'bad' : 'good');

  const legend = '' +
    '<div class="chart-legend-note">' +
      '<div class="legend-item"><span class="legend-swatch" style="border-color:#0064E0"></span>Measured value (red point = out of spec)</div>' +
      '<div class="legend-item"><span class="legend-swatch dashed" style="border-color:#8595A4"></span>Center line / UCL / LCL (process control, from moving range)</div>' +
      '<div class="legend-item"><span class="legend-swatch dashed" style="border-color:#E41E3F"></span>USL / LSL (customer spec limit)</div>' +
    '</div>';

  return renderSelectorRow(true, false) + renderSpcRangeBar() + renderSpecAlertsPanel() +
    '<div class="card-grid">' + cards + '</div>' +
    '<div class="panel"><div class="chart-wrap"><canvas id="spcCanvas"></canvas></div>' + legend + '</div>' +
    renderRecentEntriesPanel();
}

function statCard(label, value){ return statCardCls(label, value, ''); }
function statCardCls(label, value, cls){
  return '<div class="stat-card"><div class="stat-label">' + escAttrText(label) + '</div><div class="stat-value ' + cls + '">' + value + '</div></div>';
}

/* ---------- Chart.js drawing (runs after innerHTML is rebuilt) ---------- */
let chartInstance = null;
function drawChart(){
  const canvas = document.getElementById('spcCanvas');
  if(!canvas) return;
  if(typeof Chart === 'undefined'){ setTimeout(drawChart, 150); return; }
  if(chartInstance){ chartInstance.destroy(); chartInstance = null; }

  const spec = (state.specByModel[state.model] || []).find(p=>paramKey(p.parameter_code,p.port)===state.spcParam);
  const pts = state.spcMeasurements;
  const s = state.spcStats;
  if(!spec || !pts.length || !s) return;

  const labels = pts.map(p=>p.serial);
  const values = pts.map(p=>Number(p.value));
  const flat = (v)=> labels.map(()=>v);
  const pointColors = values.map(v=> evalPass(spec,v)===false ? '#E41E3F' : '#0064E0');

  const datasets = [{
    label: spec.parameter_label + (spec.unit ? (' (' + spec.unit + ')') : '') + (spec.port ? (' \u2014 ' + spec.port) : ''),
    data: values,
    borderColor: '#0064E0',
    backgroundColor: '#0064E0',
    pointBackgroundColor: pointColors,
    pointBorderColor: pointColors,
    pointRadius: 3,
    borderWidth: 1.5,
    tension: 0,
    spanGaps: true
  }];

  if(s.mean!=null){ datasets.push({ label:'Center Line', data: flat(s.mean), borderColor:'#8595A4', borderDash:[4,4], pointRadius:0, borderWidth:1.5 }); }
  if(s.ucl!=null){ datasets.push({ label:'UCL', data: flat(s.ucl), borderColor:'#8595A4', borderDash:[2,2], pointRadius:0, borderWidth:1 }); }
  if(s.lcl!=null){ datasets.push({ label:'LCL', data: flat(s.lcl), borderColor:'#8595A4', borderDash:[2,2], pointRadius:0, borderWidth:1 }); }
  if(spec.usl!=null){ datasets.push({ label:'USL (Spec)', data: flat(Number(spec.usl)), borderColor:'#E41E3F', borderDash:[6,3], pointRadius:0, borderWidth:1.5 }); }
  if(spec.lsl!=null){ datasets.push({ label:'LSL (Spec)', data: flat(Number(spec.lsl)), borderColor:'#E41E3F', borderDash:[6,3], pointRadius:0, borderWidth:1.5 }); }
  if(spec.limit_type==='target' && spec.target!=null){ datasets.push({ label:'Target', data: flat(Number(spec.target)), borderColor:'#F2A918', borderDash:[6,3], pointRadius:0, borderWidth:1.5 }); }

  chartInstance = new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{ labels, datasets },
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      interaction:{ mode:'nearest', intersect:false },
      plugins:{
        legend:{ position:'top', labels:{ boxWidth:14, font:{ family:"'Google Sans','Noto Sans KR',sans-serif", size:11 } } },
        tooltip:{ callbacks:{ title:(items)=> 'Serial: ' + items[0].label } }
      },
      scales:{
        x:{ ticks:{ maxRotation:60, minRotation:0, autoSkip:true, font:{ size:10 } }, grid:{ display:false } },
        y:{ title:{ display:true, text: spec.unit || '' }, grid:{ color:'#EEF1F4' } }
      }
    }
  });
}

/* ---------- root render ---------- */
const SECURITY_NOTICE = 'This data is proprietary and confidential. It is maintained under strict, enterprise-grade security \u2014 encrypted in transit, protected by row-level access policies at the database layer, and accessible to authorized BCT personnel only.';

function render(){
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  // Reading/restoring selection only applies to text-like inputs (text, search, url, tel,
  // password); other types (number, date, email...) return null or throw depending on the
  // browser, so this is wrapped defensively and never blocks the rest of render().
  let selStart = null, selEnd = null;
  try{
    if(active && typeof active.selectionStart === 'number') selStart = active.selectionStart;
    if(active && typeof active.selectionEnd === 'number') selEnd = active.selectionEnd;
  }catch(e){ selStart = null; selEnd = null; }

  let html;
  if(state.authView==='checking'){
    html = '<div class="empty-note" style="padding:120px 20px;text-align:center">Checking sign-in status\u2026</div>';
  } else if(state.authView==='login'){
    html = renderHeader() + renderLoginScreen();
  } else {
    const bodyContent = state.section==='entry' ? renderEntryTab() : renderSpcTab();
    const pageHead = state.section==='entry'
      ? '<div class="page-head"><h1>Measurement Data Entry</h1><p>Record adjustment &amp; test results for Services components, one unit at a time.</p></div>'
      : '<div class="page-head"><h1>SPC Chart</h1><p>Statistical process control for adjustment &amp; test measurements, with spec limits overlaid.</p></div>';
    html = renderHeader() +
      '<div class="content">' + pageHead + renderDownloadCenter() + bodyContent + '</div>' +
      '<div class="security-footer">\ud83d\udd12 ' + SECURITY_NOTICE + '</div>' +
      (state.toast ? '<div class="toast">' + escAttrText(state.toast) + '</div>' : '');
  }

  document.getElementById('app').innerHTML = html;

  if(activeId){
    const el = document.getElementById(activeId);
    if(el && typeof el.focus === 'function'){
      el.focus();
      if(selStart!=null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }

  if(state.authView==='app' && state.section==='spc'){
    if(typeof requestAnimationFrame === 'function'){ requestAnimationFrame(drawChart); } else { setTimeout(drawChart, 0); }
  }
}

render();
initAuth();

window.__debug = { state, computeStats, evalPass, sortModels, componentTypeLabel, paramKey, groupSpecByPort, portRank, sortComponentTypes, formatFrequencyKHz, computeSpcRangeBounds, applySpcRange, recentEntriesSearchFilter, stepSpcParam, computeSpecAlerts, loadSpecAlerts, jumpToSpcParam, sbFetch, refreshSessionOnce, refreshSession, highlightVoltageLabel, SIMPLE_LAYOUTS, PORT_LAYOUTS, groupUnitsByModel, buildSimpleSheet, buildPortSheet, buildSawFilterSheet, runDownloadCenterExport, loadDownloadCenterModels, writeStyledWorkbook, headerRowCountFor, fetchRecentCompleteUnits, groupUnits, loadRecentEntries, RECENT_ENTRIES_UNIT_COUNT, submitEntry, loadEntryForEdit };
