<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCT 통합 관리 시스템 — ASENDIA</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/bctechsemi/bct/refs/heads/main/images/bct_favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    /* ---- Meta-derived design tokens ---- */
    --primary:#0064E0; --primary-deep:#0457CB; --primary-soft:#0091FF; --on-primary:#FFFFFF;
    --ink-button:#000000; --on-ink-button:#FFFFFF;
    --fb-blue:#1876F2;
    --success:#31A24C; --attention:#F2A918; --warning:#F7B928;
    --critical:#E41E3F; --critical-strong:#F0284A;
    --canvas:#FFFFFF; --surface-soft:#F1F4F7;
    --ink-deep:#0A1317; --ink:#1C1E21; --charcoal:#444950; --slate:#4B4C4F;
    --steel:#5D6C7B; --stone:#8595A4;
    --hairline:#CED0D4; --hairline-soft:#DEE3E9; --disabled-text:#BCC0C4;
    --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:16px; --r-xxl:24px; --r-xxxl:32px; --r-full:100px;
    --sp-xxs:4px; --sp-xs:8px; --sp-sm:10px; --sp-md:12px; --sp-base:16px; --sp-lg:20px; --sp-xl:24px; --sp-xxl:32px;
    --font: 'Inter','Noto Sans KR',-apple-system,sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--surface-soft); color:var(--ink);
    font-family:var(--font); font-size:14px; line-height:1.43; letter-spacing:-0.14px;
  }
  .num{ font-variant-numeric:tabular-nums; }

  /* ---- topbar ---- */
  .topbar{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:20px 32px; background:var(--canvas); border-bottom:1px solid var(--hairline-soft);
  }
  .brand{ display:flex; align-items:center; gap:16px; }
  .brand img{ height:56px; width:auto; display:block; }
  .brand-text-kr{ font-family:var(--font); font-weight:700; font-size:20px; color:var(--ink-deep); letter-spacing:-0.1px; text-align:center; }
  .brand-text-sub{ font-size:12px; color:var(--steel); margin-top:2px; text-align:center; }
  .bct-badge{
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:var(--r-full); background:var(--primary); color:#fff;
    font-size:10px; font-weight:700; margin-left:10px; vertical-align:middle;
  }
  .conn-dot{
    display:inline-block; width:10px; height:10px; border-radius:var(--r-full);
    margin-left:8px; vertical-align:middle; box-shadow:0 0 0 2px var(--canvas);
  }
  .topbar-actions{ display:flex; align-items:center; gap:10px; }
  .user-email{ font-size:12px; color:var(--steel); margin-right:4px; }
  .ruler{ height:3px; background:linear-gradient(90deg, var(--primary), var(--primary-soft) 50%, var(--hairline-soft) 50%); background-size:200% 100%; opacity:.9; }

  .section-nav{ background:var(--canvas); border-bottom:1px solid var(--hairline-soft); padding:14px 32px; display:flex; justify-content:center; }
  .section-tabs{ display:flex; gap:8px; justify-content:center; }
  .section-tab{
    font-family:var(--font); font-weight:700; font-size:14px; letter-spacing:-0.14px;
    padding:9px 20px; border-radius:var(--r-full); border:1px solid var(--hairline);
    background:var(--canvas); color:var(--ink); cursor:pointer;
  }
  .section-tab.active{ background:var(--ink-deep); color:var(--canvas); border-color:var(--ink-deep); }

  .content{ padding:28px 32px 64px; max-width:1480px; margin:0 auto; }
  .page-head h1{ font-family:var(--font); font-weight:500; font-size:24px; line-height:1.25; color:var(--ink-deep); margin:0 0 4px; letter-spacing:-0.2px; }
  .page-head p{ font-size:14px; color:var(--steel); margin:0 0 22px; }

  /* ---- cards ---- */
  .card-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  .stat-card{ background:var(--canvas); border:1px solid var(--hairline-soft); border-radius:var(--r-xl); padding:20px; }
  .stat-label{ font-size:12px; color:var(--steel); margin-bottom:8px; }
  .stat-value{ font-family:var(--font); font-size:24px; font-weight:600; color:var(--ink-deep); }

  /* ---- pill quick-filter bar (also used for section tabs styling family) ---- */
  .cat-bar{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .cat-btn{
    font-family:var(--font); font-size:13px; font-weight:700; letter-spacing:-0.13px;
    padding:9px 16px; border-radius:var(--r-full); border:1px solid var(--hairline);
    background:var(--canvas); color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:8px;
  }
  .cat-btn .count{ font-size:11px; padding:2px 8px; border-radius:var(--r-full); background:var(--surface-soft); color:var(--steel); }
  .cat-btn.active{ background:var(--ink-deep); color:var(--canvas); border-color:var(--ink-deep); }
  .cat-btn.active .count{ background:rgba(255,255,255,.22); color:#fff; }

  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:12px; flex-wrap:wrap; }
  .search-input{ width:300px; }

  /* ---- form controls ---- */
  .input, .select{
    font-family:var(--font); font-size:14px; color:var(--ink);
    background:var(--canvas); border:1px solid var(--hairline); border-radius:var(--r-lg);
    padding:0 14px; height:44px; width:100%;
  }
  .input:focus, .select:focus{ outline:none; border:2px solid var(--fb-blue); padding:0 13px; }
  .btn{
    font-family:var(--font); font-weight:700; font-size:12.5px; letter-spacing:-0.13px;
    padding:7px 18px; border-radius:999px; border:2px solid transparent; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn-primary{ background:var(--primary); color:var(--on-primary); border-color:var(--primary); }
  .btn-primary:hover{ background:var(--primary-deep); border-color:var(--primary-deep); }
  .btn-ghost{ background:transparent; color:var(--ink-deep); border:2px solid rgba(10,19,23,.14); }
  .btn-ghost:hover{ background:var(--surface-soft); }
  .btn-danger{ background:transparent; color:var(--critical); border:2px solid var(--critical); }
  .btn-danger:hover{ background:#FDE8EC; }
  .btn-sm{ padding:7px 16px; font-size:12px; }

  /* ---- table ---- */
  .table-wrap{ background:var(--canvas); border:1px solid var(--hairline-soft); border-radius:var(--r-xl); overflow:hidden; }
  .table-scroll-top{ overflow-x:auto; overflow-y:hidden; height:14px; border-bottom:1px solid var(--hairline-soft); }
  .table-scroll-top-inner{ height:1px; }
  .table-scroll{ overflow:auto; max-height:66vh; }
  .toggle-btn{
    width:22px; height:22px; border-radius:50%; border:none; padding:0;
    background:rgba(0,100,224,.10); color:var(--primary);
    display:inline-flex; align-items:center; justify-content:center;
    font-size:10px; cursor:pointer; line-height:1;
  }
  .toggle-btn:hover{ background:rgba(0,100,224,.2); }
  .component-panel table.table{ width:100%; }
  .component-panel table.table td{ text-align:center; }
  .component-panel .progress-wrap{ justify-content:center; margin:0 auto; }
  table.table{ width:100%; border-collapse:collapse; font-size:13px; min-width:1400px; }
  table.table th{
    text-align:center; font-weight:700; color:var(--steel); font-size:11px;
    text-transform:uppercase; letter-spacing:.4px; padding:12px 14px; border-bottom:1px solid var(--hairline-soft);
    background:var(--canvas); white-space:nowrap; position:sticky; top:0;
  }
  table.table td{ padding:12px 14px; border-bottom:1px solid var(--hairline-soft); vertical-align:middle; white-space:nowrap; }
  table.table tbody tr:hover{ background:var(--surface-soft); }
  .empty-note{ font-size:13px; color:var(--steel); padding:30px; text-align:center; }

  .badge{
    display:inline-flex; align-items:center; padding:4px 12px; border-radius:var(--r-full);
    font-size:11px; font-weight:700; letter-spacing:.2px; white-space:nowrap;
  }
  .badge-machined{ background:var(--primary); color:#fff; }
  .badge-services{ background:var(--success); color:#fff; }
  .badge-commercials{ background:var(--warning); color:var(--ink-deep); }
  .badge-green{ background:var(--success); color:#fff; }
  .badge-amber{ background:var(--attention); color:var(--ink-deep); }
  .badge-red{ background:var(--critical); color:#fff; }
  .badge-gray{ background:var(--stone); color:#fff; }
  .badge-ink{ background:var(--ink-deep); color:#fff; }

  .progress-wrap{ display:flex; align-items:center; gap:8px; min-width:110px; }
  .progress-track{ width:64px; height:6px; background:var(--surface-soft); border-radius:var(--r-full); overflow:hidden; }
  .progress-fill{ height:100%; background:var(--primary); border-radius:var(--r-full); }
  .progress-text{ font-size:11.5px; color:var(--steel); }

  .completed-input{
    width:64px; padding:5px 7px; border-radius:var(--r-md); border:1px solid var(--hairline);
    font-family:var(--font); font-size:12.5px; text-align:right;
  }
  .completed-input:focus{ outline:2px solid var(--fb-blue); outline-offset:1px; }

  /* ---- modal ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,19,23,.5); display:flex;
    align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; z-index:60;
  }
  .modal-card{
    background:var(--canvas); border-radius:var(--r-xxl); width:100%; max-width:760px; padding:28px 30px 26px;
    box-shadow:0 20px 60px rgba(10,19,23,.3);
  }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .modal-head h2{ font-family:var(--font); font-size:18px; font-weight:600; margin:0; color:var(--ink-deep); }
  .modal-close{ background:none; border:none; font-size:18px; color:var(--steel); cursor:pointer; line-height:1; padding:4px; }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
  .form-field{ display:flex; flex-direction:column; gap:6px; }
  .form-field.span-2{ grid-column:1 / -1; }
  .form-field label{ font-size:12px; color:var(--slate); font-weight:700; }
  .form-field .req{ color:var(--critical); }
  .form-hint{ font-size:11.5px; color:var(--steel); margin-top:10px; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; padding-top:16px; border-top:1px solid var(--hairline-soft); }
  .field-error{ font-size:12.5px; color:var(--critical-strong); margin-bottom:10px; display:none; }
  .field-error.show{ display:block; }

  /* ---- login ---- */
  .login-wrap{ min-height:70vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .login-card{ width:100%; max-width:380px; background:var(--canvas); border:1px solid var(--hairline-soft); border-radius:var(--r-xxl); padding:36px 32px; text-align:center; box-shadow:0 4px 24px rgba(10,19,23,.05); }
  .login-logo{ height:60px; width:auto; margin:0 auto 20px; display:block; }
  .login-title{ font-family:var(--font); font-size:18px; font-weight:600; color:var(--ink-deep); margin-bottom:20px; }
  .login-card .form-field{ text-align:left; margin-bottom:12px; }

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--ink-deep); color:#fff; padding:13px 22px; border-radius:var(--r-full);
    font-size:13px; font-weight:500; box-shadow:0 10px 30px rgba(10,19,23,.3); z-index:70;
  }
</style>
</head>

/* ---------- auth ---------- */
function saveSession(s){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
function loadSavedSession(){ try{ const s = localStorage.getItem(SESSION_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function clearSavedSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

async function refreshSession(){
  if(!state.session || !state.session.refresh_token) return false;
  try{
    const res = await fetch(AUTH_URL + '/token?grant_type=refresh_token', {
      method:'POST',
      headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ refresh_token: state.session.refresh_token })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error_description || data.msg || ('HTTP ' + res.status));
    state.session = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + (data.expires_in*1000),
      user: data.user || state.session.user
    };
    saveSession(state.session);
    return true;
  } catch(e){
    return false;
  }
}

async function loadProfile(){
  try{
    const res = await fetch(PROFILES_URL + '?select=role,email&id=eq.' + state.session.user.id, { headers: sbHeaders() });
    const rows = await res.json();
    state.profile = (res.ok && rows[0]) ? rows[0] : { role:'engineer', email: state.session.user.email };
  } catch(e){
    state.profile = { role:'engineer', email: state.session.user.email };
  }
}

}

async function initAuth(){
  if(!IS_CONFIGURED){
    state.authView = 'app';
    render();
    loadRecords();
    loadItemMaster();
    loadNcmRecords();
    return;
  }
  const saved = loadSavedSession();
  if(saved){
    state.session = saved;
    if(!saved.expires_at || saved.expires_at < Date.now() + 30000){
      const ok = await refreshSession();
      if(!ok){ state.session = null; clearSavedSession(); }
    }
  }
  if(state.session){
    await loadProfile();
    state.authView = (IS_ADMIN_FILE && state.profile.role !== 'admin') ? 'forbidden' : 'app';
  } else {
    state.authView = 'login';
  }
  render();
  if(state.authView==='app'){ loadRecords(); loadItemMaster(); loadNcmRecords(); }
}

async function login(){
  const emailEl = document.getElementById('auth_email');
  const passEl = document.getElementById('auth_password');
  const email = emailEl.value.trim();
  const password = passEl.value;
  if(!email || !password){ state.authError = '이메일과 비밀번호를 입력해 주세요.'; render(); return; }
  state.authLoading = true; state.authError = ''; render();
  try{
    const res = await fetch(AUTH_URL + '/token?grant_type=password', {
      method:'POST',
      headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error_description || data.msg || ('HTTP ' + res.status));
    state.session = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + (data.expires_in*1000),
      user: data.user
    };
    saveSession(state.session);
    await loadProfile();
    state.authView = (IS_ADMIN_FILE && state.profile.role !== 'admin') ? 'forbidden' : 'app';
  } catch(e){
    state.authError = '로그인 실패: ' + e.message;
  }
  state.authLoading = false;
  render();
  if(state.authView==='app'){ loadRecords(); loadItemMaster(); loadNcmRecords(); }
}

async function logout(){
  try{ await fetch(AUTH_URL + '/logout', { method:'POST', headers: sbHeaders() }); } catch(e){}

/* ---------- helpers ---------- */
function won(n){ return n==null ? '—' : '₩' + Math.round(n).toLocaleString('ko-KR'); }
function qty(n){ return n==null ? '—' : n.toLocaleString('ko-KR'); }
function dash(v){ return (v===null || v===undefined || v==='') ? '—' : v; }
function progressOf(r){
  const done = r.completed_set==null ? 0 : r.completed_set;
  const total = r.ordered_set==null ? 0 : r.ordered_set;
  const pct = total>0 ? Math.round(done/total*100) : 0;
  let label = '미착수', cls='badge-gray';
  if(pct>=100 && total>0){ label='완료'; cls='badge-green'; }
  else if(pct>0){ label='진행중'; cls='badge-amber'; }
  return { done, total, pct, label, cls };
}
function totalAmountOf(r){
  if(r.total_amount!=null) return r.total_amount;
  if(r.ordered_set!=null && r.unit_price!=null) return r.ordered_set*r.unit_price;
  return null;
}

function lookupItemMaster(){

  /* 주의: 여기서 render()를 호출하면(예: showToast) 입력 중인 폼 전체가
     빈 값으로 다시 그려집니다. DOM을 직접 조작해서 값만 채웁니다. */
  const flash = (id, val) => {
    const e = document.getElementById(id);
    if(!e || val==null || val==='') return;
    e.value = val;
    e.style.transition = 'background-color .2s';
    e.style.backgroundColor = 'var(--green-bg)';
    setTimeout(()=>{ e.style.backgroundColor = ''; }, 800);
  };
  flash('f_ordered_item', m.ordered_item);
  flash('f_oem_code', m.oem_code);
  flash('f_bct_code', m.bct_code);
  flash('f_unit_price', m.unit_price);
}

function exportToExcel(){
  if(typeof XLSX === 'undefined'){
    showToast('엑셀 기능을 불러오는 중입니다. 잠시 후 다시 시도해 주세요.');
    return;
  }
  const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
  if(state.section==='po'){
    const rows = filteredServiceRecords();
    if(!rows.length){ showToast('내보낼 데이터가 없습니다.'); return; }
    const data = rows.map(r=>{
      const p = progressOf(r);
      return {
        '발주번호': r.po_number || '',
        '발행일': r.po_date || '',
        '요청납기(NBD)': r.asendia_nbd || '',
        'ERP코드': r.erp_code_asendia || '',
        '품목명': r.ordered_item || '',
        '발주수량': r.ordered_set,
        '완료수량': r.completed_set,
        '진행률(%)': p.pct,
        '상태': p.label,
        '납품일': r.delivery_date || '',
        '시리얼번호': r.serial_number || ''
      };
    });
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '서비스진행현황');
    XLSX.writeFile(wb, '아센디아_서비스진행현황_' + today + '.xlsx');
  } else {
    const rows = filteredNcmRecords();
    if(!rows.length){ showToast('내보낼 데이터가 없습니다.'); return; }
    const data = rows.map(r=>({
      '모델': r.model || '',
      '모듈': r.component || '',
      '발생일': r.issued_date || '',
      '수량': r.quantity,
      '불량증상': r.failure_mode || '',
      'ASENDIA통보일': r.noti_date_to_asendia || '',
      'ASENDIA담당자': r.asendia_engineer || '',
      '진행상태': r.progress || '',
      '교환품수령일': r.replacement_received_date || ''
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '부적합현황');
    XLSX.writeFile(wb, '부적합_NCM_' + today + '.xlsx');
  }
}

function filteredNcmRecords(){

  });
}

function renderNcmStatusBar(){
  const recs = state.ncmRecords;
  const counts = { all: recs.length };
  NCM_PROGRESS_STEPS.forEach(s=>{ counts[s] = 0; });
  recs.forEach(r=>{ if(counts[r.progress]!=null) counts[r.progress]++; });
  const items = [{ key:'all', label:'전체' }].concat(NCM_PROGRESS_STEPS.map(s=>({ key:s, label:s })));
  return '<div class="cat-bar">' + items.map(it=>{
    const active = state.ncmStatus===it.key ? 'active' : '';
    return '<button class="cat-btn ' + active + '" onclick="setNcmStatus(\'' + it.key + '\')">' + it.label + '<span class="count">' + (counts[it.key]||0) + '</span></button>';
  }).join('') + '</div>';
}

function renderNcmTable(){
  const filtered = filteredNcmRecords();
  const rows = filtered.map(r=>{
    return '<tr>' +
      '<td>' + dash(r.model) + '</td>' +
      '<td>' + dash(r.component) + '</td>' +
      '<td>' + dash(r.issued_date) + '</td>' +
      '<td class="num">' + qty(r.quantity) + '</td>' +
      '<td style="white-space:normal;min-width:220px">' + dash(r.failure_mode) + '</td>' +
      '<td>' + dash(r.noti_date_to_asendia) + '</td>' +
      '<td>' + dash(r.asendia_engineer) + '</td>' +
      '<td><span class="badge ' + ncmBadgeClass(r.progress) + '">' + dash(r.progress) + '</span></td>' +
      '<td>' + dash(r.replacement_received_date) + '</td>' +
    '</tr>';
  }).join('');
  const body = filtered.length ? rows : '<tr><td colspan="9"><div class="empty-note">조건에 맞는 부적합 항목이 없습니다.</div></td></tr>';
  return '' +
  '<div class="table-wrap"><div class="table-scroll-top"><div class="table-scroll-top-inner"></div></div><div class="table-scroll">' +
  '<table class="table"><thead><tr>' +
    '<th>모델</th><th>모듈</th><th>발생일</th><th>수량</th><th>불량증상</th>' +
    '<th>ASENDIA통보일</th><th>ASENDIA담당자</th><th>진행상태</th><th>교환품수령일</th>' +
  '</tr></thead><tbody>' + body + '</tbody></table>' +
  '</div></div>';
}

/* ---------- set-component (BOM) progress (읽기 전용) ---------- */
async function toggleComponents(poId){
  if(String(state.expandedPoId)===String(poId)){
    state.expandedPoId = null;
    render();
    return;
  }
  state.expandedPoId = poId;
  state.componentRows = [];
  state.componentsLoading = true;
  render();
  await loadComponentsForPo(poId);
}

async function loadComponentsForPo(poId){
  if(state.demoMode){
    state.componentRows = [];
    state.componentsLoading = false;
    render();
    return;
  }
  try{
    const res = await fetch(PO_PROGRESS_URL + '?po_id=eq.' + poId + '&select=*&order=component.asc', { headers: sbHeaders() });
    state.componentRows = res.ok ? await res.json() : [];
  } catch(e){
    state.componentRows = [];
  }
  state.componentsLoading = false;
  render();
}

function renderComponentPanel(){
  if(state.componentsLoading){
    return '<div class="empty-note">구성품 정보를 불러오는 중입니다…</div>';
  }
  if(!state.componentRows.length){
    return '<div class="empty-note">이 항목에는 등록된 구성품(Set) 정보가 없습니다.</div>';
  }
  const rows = state.componentRows.map(cr=>{
    const pct = cr.required_quantity>0 ? Math.round(cr.completed_quantity/cr.required_quantity*100) : 0;
    return '<tr>' +
      '<td>' + dash(cr.component) + '</td>' +
      '<td class="num">' + qty(cr.required_quantity) + '</td>' +
      '<td class="num">' + qty(cr.completed_quantity) + '</td>' +
      '<td><div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div><div class="progress-text num">' + pct + '%</div></div></td>' +
    '</tr>';
  }).join('');
  return '' +
    '<div class="stat-label" style="margin:0 0 8px">구성품별 진행률</div>' +
    '<div class="component-panel"><table class="table"><thead><tr><th>구성품</th><th>필요수량</th><th>완료수량</th><th>진행률</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function filteredServiceRecords(){
  const q = state.query.trim().toLowerCase();
  return state.records.filter(r=>{
    if(r.po_category!=='services') return false;
    const p = progressOf(r);
    const matchesStatus = state.statusFilter==='done' ? p.pct>=100
      : state.statusFilter==='pending' ? p.pct<100
      : true;
    if(!matchesStatus) return false;
    if(!q) return true;
    return [r.po_number, r.ordered_item, r.oem_code, r.erp_code_asendia].some(v=>v && String(v).toLowerCase().includes(q));
  });
}

function renderStatusBar(){
  const base = state.records.filter(r=>r.po_category==='services');
  const counts = { all: base.length, done:0, pending:0 };
  base.forEach(r=>{ const p = progressOf(r); if(p.pct>=100) counts.done++; else counts.pending++; });
  const items = [
    { key:'all', label:'전체' },
    { key:'done', label:'완료' },
    { key:'pending', label:'미완료' }
  ];
  return '<div class="cat-bar">' + items.map(it=>{
    const active = state.statusFilter===it.key ? 'active' : '';
    return '<button class="cat-btn ' + active + '" onclick="setStatusFilter(\'' + it.key + '\')">' + it.label + '<span class="count">' + counts[it.key] + '</span></button>';
  }).join('') + '</div>';
}
function setStatusFilter(k){ state.statusFilter = k; render(); }

function renderTable(){
  const filtered = filteredServiceRecords();
  const rows = filtered.map(r=>{
    const p = progressOf(r);
    const isExpanded = String(state.expandedPoId)===String(r.id);
    const toggleBtn = '<button class="toggle-btn" onclick="toggleComponents(\'' + r.id + '\')" title="구성품 보기">' + (isExpanded?'▾':'▸') + '</button>';
    const mainRow = '<tr>' +
      '<td>' + toggleBtn + '</td>' +
      '<td class="num">' + dash(r.po_number) + '</td>' +
      '<td>' + dash(r.po_date) + '</td>' +
      '<td>' + dash(r.asendia_nbd) + '</td>' +
      '<td>' + dash(r.erp_code_asendia) + '</td>' +
      '<td style="white-space:normal;min-width:220px">' + dash(r.ordered_item) + '</td>' +
      '<td class="num">' + qty(r.ordered_set) + '</td>' +
      '<td class="num">' + qty(r.completed_set) + '</td>' +
      '<td><div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:' + p.pct + '%"></div></div><div class="progress-text num">' + p.pct + '%</div></div></td>' +
      '<td><span class="badge ' + p.cls + '">' + p.label + '</span></td>' +
      '<td>' + dash(r.delivery_date) + '</td>' +
      '<td>' + dash(r.serial_number) + '</td>' +
    '</tr>';
    const expandRow = isExpanded
      ? '<tr><td colspan="12" style="padding:0;background:var(--surface-soft)"><div style="position:sticky;left:0;max-width:640px;padding:14px 16px;box-sizing:border-box">' + renderComponentPanel() + '</div></td></tr>'
      : '';
    return mainRow + expandRow;
  }).join('');
  const body = filtered.length ? rows : '<tr><td colspan="12"><div class="empty-note">조건에 맞는 PO 항목이 없습니다.</div></td></tr>';
  return '' +
  '<div class="table-wrap"><div class="table-scroll-top"><div class="table-scroll-top-inner"></div></div><div class="table-scroll"' + (state.expandedPoId ? ' style="max-height:none"' : '') + '>' +
  '<table class="table"><thead><tr>' +
    '<th></th><th>발주번호</th><th>발행일</th><th>요청납기(NBD)</th><th>ERP코드</th>' +
    '<th>품목명</th><th>발주수량</th><th>완료수량</th><th>진행률</th><th>상태</th>' +
    '<th>납품일</th><th>시리얼번호</th>' +
  '</tr></thead><tbody>' + body + '</tbody></table>' +
  '</div></div>';
}

function syncTableScrollbars(){
  document.querySelectorAll('.table-wrap').forEach(function(wrap){
    const top = wrap.querySelector('.table-scroll-top');
    const inner = wrap.querySelector('.table-scroll-top-inner');
    const main = wrap.querySelector('.table-scroll');
    if(!top || !inner || !main) return;
    inner.style.width = main.scrollWidth + 'px';
    top.addEventListener('scroll', function(){ main.scrollLeft = top.scrollLeft; });
    main.addEventListener('scroll', function(){ top.scrollLeft = main.scrollLeft; });
  });
}

function render(){
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  let html;
  if(state.authView==='checking'){
    html = renderHeader() + '<div class="empty-note" style="padding:120px 20px;text-align:center">로그인 정보를 확인하는 중입니다…</div>';
  } else if(state.authView==='login'){
    html = renderHeader() + renderLoginScreen();
  } else if(state.authView==='forbidden'){
    html = renderHeader() + renderForbiddenScreen();
  } else {
    const isPo = state.section === 'po';
    const bodyContent = state.loading
      ? '<div class="empty-note" style="padding:80px 20px">데이터를 불러오는 중입니다…</div>'
      : isPo
        ? (renderStatusBar() +
           '<div class="toolbar"><input id="po_search_input" class="input search-input" placeholder="발주번호, 품목명, ERP코드 검색" value="' + state.query + '" oninput="setQuery(this.value)"><span class="empty-note" style="padding:0">표 안에서 Shift + 마우스 휠로 좌우 스크롤할 수 있습니다.</span></div>' +
           renderTable())
        : (renderNcmStatusBar() +
           '<div class="toolbar"><input id="ncm_search_input" class="input search-input" placeholder="모델, 모듈, 불량증상, ASENDIA담당자 검색" value="' + state.ncmQuery + '" oninput="setNcmQuery(this.value)"><span class="empty-note" style="padding:0">표 안에서 Shift + 마우스 휠로 좌우 스크롤할 수 있습니다.</span></div>' +
           renderNcmTable());

    const pageHead = isPo
      ? '<div class="page-head"><h1>아센디아 서비스 진행 현황</h1><p>외주용역(서비스) 발주 항목의 진행 상태를 확인할 수 있습니다.</p></div>'
      : '<div class="page-head"><h1>부적합 (NCM) 현황</h1><p>외주용역 작업 중 발생한 사급 부품 불량 현황과 ASENDIA 통보·교환 진행상황을 확인할 수 있습니다.</p></div>';

    html = renderHeader() +
      '<div class="content">' +
        pageHead +
        bodyContent +
      '</div>' +
      (state.toast ? '<div class="toast">' + state.toast + '</div>' : '');
  }

  document.getElementById('app').innerHTML = html;

  if(activeId){
    const el = document.getElementById(activeId);
    if(el && typeof el.focus === 'function'){
      el.focus();
      if(selStart!=null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }

  if(typeof requestAnimationFrame === 'function'){
    requestAnimationFrame(syncTableScrollbars);
  } else {
    setTimeout(syncTableScrollbars, 0);
  }
}

render();
initAuth();

</script>
</body>
</html>
