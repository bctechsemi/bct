<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCT × ASENDIA — SPC Chart (Customer View)</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/bctechsemi/bct/refs/heads/main/images/bct_favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" defer></script>
<style>
  :root{
    /* ---- Meta-derived design tokens (shared with the other BCT x ASENDIA pages) ---- */
    --primary:#0064E0; --primary-deep:#0457CB; --primary-soft:#0091FF; --on-primary:#FFFFFF;
    --ink-button:#000000; --on-ink-button:#FFFFFF;
    --fb-blue:#1876F2;
    --success:#31A24C; --success-bg:#E9F6EC; --attention:#F2A918; --warning:#F7B928;
    --critical:#E41E3F; --critical-strong:#F0284A; --critical-bg:#FDE8EC; --pink:#FF3D8F;
    --canvas:#FFFFFF; --surface-soft:#F1F4F7;
    --ink-deep:#0A1317; --ink:#1C1E21; --charcoal:#444950; --slate:#4B4C4F;
    --steel:#5D6C7B; --stone:#8595A4;
    --hairline:#CED0D4; --hairline-soft:#DEE3E9; --disabled-text:#BCC0C4;
    --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:16px; --r-xxl:24px; --r-xxxl:32px; --r-full:100px;
    --sp-xxs:4px; --sp-xs:8px; --sp-sm:10px; --sp-md:12px; --sp-base:16px; --sp-lg:20px; --sp-xl:24px; --sp-xxl:32px;
    --font: 'Google Sans','Noto Sans KR',-apple-system,sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--surface-soft); color:var(--ink);
    font-family:var(--font); font-size:14px; line-height:1.43; letter-spacing:-0.1px;
  }
  .num{ font-variant-numeric:tabular-nums; }

  /* ---- topbar ---- */
  .topbar{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    padding:20px 32px; background:var(--canvas); border-bottom:1px solid var(--hairline-soft);
  }
  .brand{ display:flex; align-items:center; gap:16px; }
  .brand img{ height:56px; width:auto; display:block; }
  .brand-text-en{ font-family:var(--font); font-weight:700; font-size:26px; color:var(--ink-deep); letter-spacing:-.3px; text-align:center; }
  .brand-text-sub{ font-size:12px; color:var(--steel); margin-top:2px; text-align:center; }
  .conn-dot{
    display:inline-block; width:14px; height:14px; border-radius:50%;
    margin-left:12px; vertical-align:middle; box-shadow:0 0 0 2px var(--canvas);
  }
  .topbar-actions{ display:flex; align-items:center; gap:10px; }
  .user-email{ font-size:12px; color:var(--steel); margin-right:4px; }
  .ruler{ height:3px; background:linear-gradient(90deg, var(--primary), var(--primary-soft) 50%, var(--hairline-soft) 50%); background-size:200% 100%; opacity:.9; }

  .section-nav{ background:var(--canvas); border-bottom:1px solid var(--hairline-soft); padding:14px 32px; display:flex; justify-content:center; }
  .section-tabs{
    display:inline-flex; gap:2px; justify-content:center;
    padding:4px; background:var(--surface-soft); border:1px solid var(--hairline-soft); border-radius:var(--r-full);
  }
  .section-tab{
    font-family:var(--font); font-weight:700; font-size:13.5px; letter-spacing:-0.1px;
    padding:8px 22px; border-radius:var(--r-full); border:none;
    background:transparent; color:var(--steel); cursor:pointer; transition:background .15s, color .15s;
  }
  .section-tab.active{ background:var(--canvas); color:var(--ink-deep); box-shadow:0 1px 3px rgba(10,19,23,.14); }

  .content{ padding:28px 32px 64px; max-width:min(1800px, 96vw); margin:0 auto; }
  .page-head h1{ font-family:var(--font); font-weight:600; font-size:24px; line-height:1.25; color:var(--ink-deep); margin:0 0 4px; letter-spacing:-0.2px; }
  .page-head p{ font-size:14px; color:var(--steel); margin:0 0 22px; }

  /* ---- selector row ---- */
  .selector-row{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
  .spc-range-bar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  .range-label{ font-family:var(--font); font-size:12.5px; font-weight:700; color:var(--steel); }
  .range-pills{ display:inline-flex; gap:2px; padding:3px; background:var(--surface-soft); border:1px solid var(--hairline-soft); border-radius:var(--r-full); }
  .range-pill{
    font-family:var(--font); font-weight:700; font-size:12.5px; padding:6px 14px; border-radius:var(--r-full);
    border:none; background:transparent; color:var(--steel); cursor:pointer; transition:background .15s, color .15s;
  }
  .range-pill.active{ background:var(--canvas); color:var(--ink-deep); box-shadow:0 1px 3px rgba(10,19,23,.14); }
  .range-date-sep{ color:var(--steel); }
  .selector-field{ display:flex; flex-direction:column; gap:6px; min-width:220px; }

  /* Up/down stepper next to the SPC Parameter dropdown */
  .param-select-row{ display:flex; gap:6px; align-items:stretch; }
  .param-select-row .select{ flex:1; min-width:0; }
  .param-stepper{ display:flex; flex-direction:column; height:44px; flex:0 0 auto; }
  .stepper-btn{
    flex:1; width:30px; display:flex; align-items:center; justify-content:center;
    background:var(--surface-soft); border:1px solid var(--hairline); color:var(--ink-deep);
    font-size:8px; cursor:pointer; padding:0; line-height:1;
  }
  .stepper-btn:first-child{ border-radius:var(--r-lg) var(--r-lg) 0 0; border-bottom:none; }
  .stepper-btn:last-child{ border-radius:0 0 var(--r-lg) var(--r-lg); }
  .stepper-btn:hover:not(:disabled){ background:var(--canvas); border-color:var(--primary); color:var(--primary); }
  .stepper-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .selector-field label{ font-size:11.5px; font-weight:700; color:var(--slate); text-transform:uppercase; letter-spacing:.4px; }

  /* ---- cards ---- */
  .card-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:20px; }
  .stat-card{ background:var(--canvas); border:1px solid var(--hairline-soft); border-radius:var(--r-xl); padding:18px 20px; }
  .stat-label{ font-size:11.5px; color:var(--steel); margin-bottom:8px; text-transform:uppercase; letter-spacing:.4px; }
  .stat-value{ font-family:var(--font); font-size:22px; font-weight:600; color:var(--ink-deep); }
  .stat-value.good{ color:var(--success); }
  .stat-value.warn{ color:var(--attention); }
  .stat-value.bad{ color:var(--critical); }

  .panel{ background:var(--canvas); border:1px solid var(--hairline-soft); border-radius:var(--r-xl); padding:24px; margin-bottom:20px; }
  .panel h2{ font-family:var(--font); font-size:15px; font-weight:700; color:var(--ink-deep); margin:0 0 16px; }
  .panel-head-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .panel-head-row h2{ margin:0; }
  .collapse-chevron{ font-size:12.5px; font-weight:700; color:var(--steel); white-space:nowrap; user-select:none; margin-left:10px; }
  .collapsible-title{ cursor:pointer; display:flex; align-items:center; margin:0; }
  .download-center-panel{ margin-bottom:20px; }

  /* ---- form controls ---- */
  .input, .select{
    font-family:var(--font); font-size:14px; color:var(--ink);
    background:var(--canvas); border:1px solid var(--hairline); border-radius:var(--r-lg);
    padding:0 14px; height:44px; width:100%;
  }
  .input:focus, .select:focus{ outline:none; border:2px solid var(--fb-blue); padding:0 13px; }
  .range-date-input{ width:auto; height:36px; padding:0 10px; }
  select.select{ height:44px; }
  .btn{
    font-family:var(--font); font-weight:700; font-size:12.5px; letter-spacing:-0.1px;
    padding:7px 18px; border-radius:999px; border:2px solid transparent; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn-primary{ background:var(--primary); color:var(--on-primary); border-color:var(--primary); }
  .btn-primary:hover{ background:var(--primary-deep); border-color:var(--primary-deep); }
  .btn-primary:disabled{ opacity:.55; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--ink-deep); border:2px solid rgba(10,19,23,.14); }
  .btn-ghost:hover{ background:var(--surface-soft); }
  .btn-sm{ padding:6px 14px; font-size:11.5px; }

  /* ---- entry form grid ---- */
  .meta-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px 16px; margin-bottom:22px; }
  .param-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px; }
  .param-port-group{ margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid var(--hairline-soft); }
  .param-port-group:last-child{ margin-bottom:0; padding-bottom:0; border-bottom:none; }
  .param-port-title{ font-family:var(--font); font-size:12.5px; font-weight:700; color:var(--steel); text-transform:uppercase; letter-spacing:.5px; margin:0 0 12px; }
  .form-field{ display:flex; flex-direction:column; gap:6px; }
  .form-field label{ font-size:12px; color:var(--slate); font-weight:700; display:flex; align-items:center; gap:6px; }
  .unit-tag{ font-size:10.5px; font-weight:600; color:var(--steel); background:var(--surface-soft); padding:1px 7px; border-radius:var(--r-full); }
  .param-input-row{ display:flex; align-items:center; gap:8px; }
  .param-input-row .input{ flex:1; }
  .form-hint{ font-size:11px; color:var(--steel); margin-top:1px; }
  .live-badge{
    display:inline-flex; align-items:center; justify-content:center; min-width:52px; height:28px; padding:0 10px;
    border-radius:var(--r-full); font-size:10.5px; font-weight:700; letter-spacing:.3px; white-space:nowrap;
  }
  .live-badge.pending{ background:var(--surface-soft); color:var(--stone); }
  .live-badge.pass{ background:var(--success-bg); color:var(--success); }
  .live-badge.fail{ background:var(--critical-bg); color:var(--critical); }

  .form-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; padding-top:18px; border-top:1px solid var(--hairline-soft); }

  /* ---- procedure reference banner ---- */
  .procedure-banner{
    display:flex; align-items:center; gap:12px;
    background:var(--surface-soft); border:1px solid var(--hairline-soft); border-radius:var(--r-xl);
    padding:14px 18px; margin-bottom:20px;
  }
  .procedure-banner-link{ text-decoration:none; cursor:pointer; transition:background .12s, border-color .12s; }
  .procedure-banner-link:hover{ background:var(--canvas); border-color:var(--primary); }
  .procedure-icon{ font-size:20px; line-height:1; }
  .procedure-title{ font-weight:700; font-size:13.5px; color:var(--ink-deep); }
  .procedure-banner-link .procedure-title{ color:var(--primary); }
  .procedure-sub{ font-size:12px; color:var(--steel); margin-top:2px; }
  .procedure-banner-empty{ color:var(--steel); font-size:12.5px; gap:10px; }

  /* ---- table ---- */
  .table-wrap{ background:var(--canvas); border:1px solid var(--hairline-soft); border-radius:var(--r-xl); overflow:hidden; }
  .table-scroll{ overflow:auto; max-height:56vh; }
  table.table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.table th{
    text-align:center; font-weight:700; color:var(--steel); font-size:11px;
    text-transform:uppercase; letter-spacing:.4px; padding:12px 14px; border-bottom:1px solid var(--hairline-soft);
    background:var(--canvas); white-space:nowrap; position:sticky; top:0;
  }
  table.table td{ padding:11px 14px; border-bottom:1px solid var(--hairline-soft); vertical-align:middle; white-space:nowrap; text-align:center; }
  table.table tbody tr:hover{ background:var(--surface-soft); }
  .empty-note{ font-size:13px; color:var(--steel); padding:40px 20px; text-align:center; }

  .badge{
    display:inline-flex; align-items:center; padding:4px 12px; border-radius:var(--r-full);
    font-size:11px; font-weight:700; letter-spacing:.2px; white-space:nowrap;
  }
  .badge-green{ background:var(--success); color:#fff; }
  .badge-red{ background:var(--critical); color:#fff; }
  .badge-gray{ background:var(--stone); color:#fff; }

  /* ---- chart ---- */
  .chart-wrap{ position:relative; height:420px; }
  .chart-legend-note{ display:flex; flex-wrap:wrap; gap:16px; margin-top:14px; padding-top:14px; border-top:1px solid var(--hairline-soft); }
  .legend-item{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--steel); }
  .legend-swatch{ width:18px; height:0; border-top:2.5px solid; display:inline-block; }
  .legend-swatch.dashed{ border-top-style:dashed; }

  /* ---- login ---- */
  .login-wrap{ min-height:70vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .login-card{ width:100%; max-width:380px; background:var(--canvas); border:1px solid var(--hairline-soft); border-radius:var(--r-xxl); padding:36px 32px; text-align:center; box-shadow:0 4px 24px rgba(10,19,23,.05); }
  .login-logo{ height:60px; width:auto; margin:0 auto 20px; display:block; }
  .login-title{ font-family:var(--font); font-size:18px; font-weight:600; color:var(--ink-deep); margin-bottom:20px; }
  .login-card .form-field{ text-align:left; margin-bottom:12px; }
  .field-error{ font-size:12.5px; color:var(--critical-strong); margin-bottom:10px; display:none; }
  .field-error.show{ display:block; }

  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--ink-deep); color:#fff; padding:13px 22px; border-radius:var(--r-full);
    font-size:13px; font-weight:500; box-shadow:0 10px 30px rgba(10,19,23,.3); z-index:70;
  }

  .security-footer{
    max-width:min(1800px, 96vw); margin:0 auto; padding:18px 32px 36px;
    display:flex; align-items:flex-start; gap:8px;
    font-size:11.5px; line-height:1.5; color:var(--steel);
    border-top:1px solid var(--hairline-soft);
  }

  @media (max-width:900px){
    .meta-grid{ grid-template-columns:1fr; }
    .card-grid{ grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>

function componentTypeRank(t){ const i = COMPONENT_TYPE_ORDER.indexOf(t); return i===-1 ? 999 : i; }
function sortComponentTypes(types){
  return types.slice().sort((a,b)=>{
    const ra = componentTypeRank(a), rb = componentTypeRank(b);
    if(ra!==rb) return ra-rb;
    return a.localeCompare(b);
  });
}
/* Global display-order hint for parameter_code, shared across every component type.
   Codes not listed here just sort alphabetically after the known ones - safe default
   for any future component's parameters. */
const PARAM_ORDER = [
  // Main_Amp / Driver (Bias + Return Loss + Output + Flatness)
  'bias','rl_low','rl_center','rl_high',
  'oc_pin','oc_idc','oc50_pin','oc50_idc','oc100_pin','oc100_idc',
  'flat_low_pin','flat_low_idc','flat_center_pin','flat_center_idc','flat_high_pin','flat_high_idc',
  'flat_low','flat_center','flat_high',
  // Combiner / Splitter / LPF (per-port S-parameters + insertion loss + isolation)
  's11_real_low','s11_image_low','s11_real_center','s11_image_center','s11_real_high','s11_image_high',
  'in_real_low','in_image_low','in_real_center','in_image_center','in_real_high','in_image_high',
  'out_real_low','out_image_low','out_real_center','out_image_center','out_real_high','out_image_high',
  's22_real_low','s22_image_low','s22_real_center','s22_image_center','s22_real_high','s22_image_high',
  'ins_loss_low','ins_loss_center','ins_loss_high',
  'isolation_low','isolation_center','isolation_high',
  // Exciter
  'bias1','bias2','int_out_6v','int_idc_6v','int_out_8v','int_idc_8v',
  'int_flat_low','int_flat_center','int_flat_high',
  'ext_out_6v','ext_out','ext_z_low','ext_z_center','ext_z_high',
  // RF Sensor
  'iso_low','iso_center','iso_high','coupling_db','coupling_real','coupling_image',
  'fwd_iso_center','fwd_rl_center','fwd_coupling_db','ref_iso_center','ref_rl_center','ref_coupling_db',
  'fwd_v','ref_v','ref_m_v',
  // Saw_Filter
  'ref_voltage',
  // shared pass/fail flag style params
  'freq_out_check',
];
function paramRank(code){ const i = PARAM_ORDER.indexOf(code); return i===-1 ? 999 : i; }

/* Display-order hint for the "port" dimension used by Combiner/Splitter (and any future
   multi-port component). '' means "not port-specific" (e.g. LPF, or Combiner's shared
   output measurement) and always sorts first. */
const PORT_ORDER = ['','Port1','Port2','Port3','Port1-Port2','Port2-Port3','Port3-Port1'];
function portRank(port){ const i = PORT_ORDER.indexOf(port || ''); return i===-1 ? 999 : i; }
/* Compound key so the same parameter_code appearing under different ports (e.g.
   Combiner's Input Return Loss for Port1 vs Port2) doesn't collide - used to match
   the selected SPC parameter/port pair against the right spec row and measurement data.
   For port-less components this reduces to the plain parameter_code, unchanged from before. */
function paramKey(code, port){ return port ? (code + '@' + port) : code; }

/* Preferred model order (highest-volume / most active models first), then alphabetical. */
const MODEL_PRIORITY = ['AGL-1004H','APG-2012H','APG-1513','APG-2013H','MP12M-20'];
function modelRank(m){ const i = MODEL_PRIORITY.indexOf(m); return i===-1 ? 999 : i; }
function sortModels(models){
  return models.slice().sort((a,b)=>{
    const ra = modelRank(a), rb = modelRank(b);
    if(ra!==rb) return ra-rb;
    return a.localeCompare(b);
  });
}

/* ---------- auth ---------- */
function saveSession(s){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
function loadSavedSession(){ try{ const s = localStorage.getItem(SESSION_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function clearSavedSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

async function refreshSession(){
  if(!state.session || !state.session.refresh_token) return false;
  try{
    const res = await fetch(AUTH_URL + '/token?grant_type=refresh_token', {
      method:'POST',
      headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ refresh_token: state.session.refresh_token })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error_description || data.msg || ('HTTP ' + res.status));
    state.session = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + (data.expires_in*1000),
      user: data.user || state.session.user
    };
    saveSession(state.session);
    return true;
  } catch(e){
    return false;
  }
}

async function initAuth(){
  if(!IS_CONFIGURED){
    state.authView = 'app';
    state.loading = false;
    render();
    bootData();
    return;
  }
  const saved = loadSavedSession();
  if(saved){
    state.session = saved;
    if(!saved.expires_at || saved.expires_at < Date.now() + 30000){
      const ok = await refreshSession();
      if(!ok){ state.session = null; clearSavedSession(); }
    }
  }
  state.authView = state.session ? 'app' : 'login';
  state.loading = false;
  render();
  if(state.authView==='app'){ bootData(); }
}

async function login(){
  const emailEl = document.getElementById('auth_email');
  const passEl = document.getElementById('auth_password');
  const email = emailEl.value.trim();
  const password = passEl.value;
  if(!email || !password){ state.authError = 'Enter your email and password.'; render(); return; }
  state.authLoading = true; state.authError = ''; render();
  try{
    const res = await fetch(AUTH_URL + '/token?grant_type=password', {
      method:'POST',
      headers: { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error_description || data.msg || ('HTTP ' + res.status));
    state.session = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + (data.expires_in*1000),
      user: data.user
    };
    saveSession(state.session);
    state.authView = 'app';
  } catch(e){
    state.authError = 'Sign-in failed: ' + e.message;
  }
  state.authLoading = false;
  render();
  if(state.authView==='app'){ bootData(); }
}

async function logout(){
  try{ await fetch(AUTH_URL + '/logout', { method:'POST', headers: sbHeaders() }); } catch(e){}
  state.session = null;
  state.authView = 'login';
  state.authError = '';
  clearSavedSession();
  render();
}

/* ---------- helpers ---------- */
function escAttrText(v){ return v===null||v===undefined ? '' : String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function dash(v){ return (v===null || v===undefined || v==='') ? '—' : v; }
function fmtNum(v){
  if(v===null || v===undefined || v==='') return '—';
  const n = Number(v);
  if(Number.isNaN(n)) return '—';
  return (Math.round(n*100)/100).toString();
}
/* Formats a frequency stored in kHz as the more natural unit for its magnitude
   (e.g. 430 -> "430kHz", 13560 -> "13.56MHz"), trimming trailing zeros. */
function formatFrequencyKHz(khz){
  if(khz===null || khz===undefined || khz==='') return null;
  const n = Number(khz);
  if(Number.isNaN(n)) return null;
  if(n >= 1000){
    const mhz = Math.round((n/1000)*100)/100;
    return mhz + 'MHz';
  }
  return n + 'kHz';
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function showToast(msg){ state.toast = msg; render(); setTimeout(()=>{ state.toast=null; render(); }, 2800); }
function enc(v){ return encodeURIComponent(v); }

function specHint(p){
  if(!p) return '';
  const u = p.unit ? (' ' + p.unit) : '';
  if(p.limit_type==='target') return 'Target ' + fmtNum(p.target) + u + ' (exact)';
  if(p.limit_type==='range') return fmtNum(p.lsl) + u + ' – ' + fmtNum(p.usl) + u;
  if(p.limit_type==='upper') return '≤ ' + fmtNum(p.usl) + u;
  if(p.limit_type==='lower') return '≥ ' + fmtNum(p.lsl) + u;
  if(p.limit_type==='none') return 'Reference only (no spec limit)';
  return '—';
}
function evalPass(p, v){
  if(v===null || v===undefined || v==='' || Number.isNaN(Number(v))) return null;
  const n = Number(v);
  if(p.limit_type==='target') return Math.abs(n - Number(p.target)) < 1e-9;
  if(p.limit_type==='upper') return n <= Number(p.usl);
  if(p.limit_type==='lower') return n >= Number(p.lsl);
  if(p.limit_type==='range') return n >= Number(p.lsl) && n <= Number(p.usl);
  if(p.limit_type==='none') return null;
  return true;
}

function connDot(){
  const connected = !state.loading && !state.demoMode && !state.connError;
  const color = connected ? 'var(--success)' : 'var(--pink)';
  const title = state.loading ? 'Loading…'
    : connected ? 'Connected to Supabase'
    : (state.connError ? 'Connection error: ' + state.connError : 'Demo mode (Supabase not configured)');
  return '<span class="conn-dot" style="background:' + color + '" title="' + title.replace(/"/g,'') + '"></span>';
}

/* ---------- data loading ---------- */
function bootData(){
  loadComponentTypes();
  loadSpecForComponent(state.componentType);
}

async function loadComponentTypes(){
  if(state.demoMode){
    const types = Array.from(new Set(DEMO_MODELS.map(r=>r.component_type)));
    state.componentTypes = sortComponentTypes(types.length ? types : ['Main_Amp']);
    render();
    return;
  }
  try{
    const res = await fetch(MODELS_URL + '?select=component_type', { headers: sbHeaders() });
    if(!res.ok){ const t = await res.text(); throw new Error('HTTP ' + res.status + ' ' + t.slice(0,180)); }
    const rows = await res.json();
    const types = Array.from(new Set(rows.map(r=>r.component_type)));
    if(types.length){
      state.componentTypes = sortComponentTypes(types);
    } else {
      showToast('component_models table returned no rows \u2014 Component Type list may be incomplete.');
    }
  } catch(e){
    showToast('Could not load component type list: ' + e.message);
  }
  render();
}

function groupByModel(rows){
  const byModel = {};
  rows.forEach(r=>{ (byModel[r.model] = byModel[r.model] || []).push(r); });
  Object.values(byModel).forEach(arr=>arr.sort((a,b)=>paramRank(a.parameter_code)-paramRank(b.parameter_code)));
  return byModel;
}

async function loadSpecForComponent(type){
  state.specLoading = true; render();
  if(state.demoMode){
    const rows = DEMO_SPEC.filter(r=>r.component_type===type);
    state.specByModel = groupByModel(rows);
    const models = sortModels(Object.keys(state.specByModel));
    state.model = models.includes(state.model) ? state.model : (models[0] || null);
    state.specLoading = false;
    onModelReady();
    return;
  }
  try{
    const res = await fetch(SPEC_URL + '?component_type=eq.' + enc(type) + '&select=*&order=model.asc,parameter_code.asc,port.asc', { headers: sbHeaders() });
    if(!res.ok){ const t = await res.text(); throw new Error('HTTP ' + res.status + ' ' + t.slice(0,180)); }
    const rows = await res.json();
    state.specByModel = groupByModel(rows);
    state.connError = null;
  } catch(e){
    state.connError = e.message;
    state.specByModel = {};
  }
  const models = sortModels(Object.keys(state.specByModel));
  state.model = models.includes(state.model) ? state.model : (models[0] || null);
  state.specLoading = false;
  onModelReady();
}

function onModelReady(){
  const spec = state.specByModel[state.model] || [];
  state.spcParam = spec.length ? (spec.find(p=>paramKey(p.parameter_code,p.port)===state.spcParam) ? state.spcParam : paramKey(spec[0].parameter_code, spec[0].port)) : null;
  render();
  loadRecentEntries();
  loadSpcData();
}

async function loadRecentEntries(){
  if(!state.model){ state.recentEntriesRaw = []; render(); return; }
  if(state.demoMode){
    state.recentEntriesRaw = DEMO_MEASUREMENTS.filter(r=>r.component_type===state.componentType && r.model===state.model);
    render();
    return;
  }
  try{
    const res = await fetch(MEASUREMENTS_URL + '?component_type=eq.' + enc(state.componentType) + '&model=eq.' + enc(state.model) + '&select=*&order=serial.desc&limit=400', { headers: sbHeaders() });
    state.recentEntriesRaw = res.ok ? await res.json() : [];
  } catch(e){
    state.recentEntriesRaw = [];
  }
  render();
}

function groupUnitsByModel(rawRows){
  const byKey = {};
  rawRows.forEach(r=>{
    const key = r.model + '\u0001' + r.serial;
    if(!byKey[key]) byKey[key] = { model:r.model, serial:r.serial, measured_date:r.measured_date, inspector_name:r.inspector_name, values:{} };
    byKey[key].values[paramKey(r.parameter_code, r.port)] = r.value;
  });
  return Object.values(byKey).sort((a,b)=>{
    if(a.model !== b.model) return a.model < b.model ? -1 : 1;
    return a.serial < b.serial ? -1 : (a.serial > b.serial ? 1 : 0);
  });
}

function buildSimpleSheet(componentType, layout, groups){
  const header2 = ['MODEL','INSPECTOR','SERIAL'].concat(layout.cols.map(c=>c.label));
  const header1 = new Array(header2.length).fill(null);
  header1[0] = '-';
  layout.groups.forEach(([startCol,,label])=>{ header1[startCol-1] = label; });

  const rows = [header1, header2];
  groups.forEach(g=>{
    const row = [g.model, g.inspector_name || '', g.serial];
    layout.cols.forEach(c=>{
      let v = g.values[paramKey(c.code,'')];
      if(v===undefined || v===null) v = '';
      else if(c.formatter) v = c.formatter(v);
      row.push(v);
    });
    rows.push(row);
  });

  const merges = [ { s:{r:0,c:0}, e:{r:0,c:2} } ];
  layout.groups.forEach(([startCol,endCol])=>{
    if(endCol>startCol) merges.push({ s:{r:0,c:startCol-1}, e:{r:0,c:endCol-1} });
  });
  return { rows, merges };
}

function buildPortSheet(componentType, layout, groups){
  const header2 = ['MODEL','INSPECTOR','SERIAL','Port (Isolation)']
    .concat(layout.perPortCols.map(c=>c.label))
    .concat(layout.sharedCols.map(c=>c.label))
    .concat(layout.insLossCols.map(c=>c.label))
    .concat(layout.isolationCols.map(c=>c.label));
  const header1 = new Array(header2.length).fill(null);
  if(componentType === 'LPF'){ header1[0]='-'; header1[1]='-'; header1[2]='-'; header1[3]='-'; }
  layout.groups.forEach(([startCol,,label])=>{ header1[startCol-1] = label; });

  const rows = [header1, header2];
  const merges = [];

  groups.forEach(g=>{
    const nPorts = layout.portCountByModel(g.model);
    const pairLabels = nPorts===3 ? layout.pairLabels3 : (nPorts===2 ? layout.pairLabels2 : layout.pairLabels1);
    const blockStartRow = rows.length;

    for(let i=0;i<nPorts;i++){
      const port = 'Port' + (i+1);
      const lookupPort = layout.lookupPortAsEmpty ? '' : port; // LPF: DB has no real port dimension, everything is stored at port=''
      const row = [i===0 ? g.model : '', i===0 ? (g.inspector_name || '') : '', i===0 ? g.serial : '', pairLabels[i] || port];
      layout.perPortCols.forEach(c=>{
        const v = g.values[paramKey(c.code, lookupPort)];
        row.push(v===undefined || v===null ? '' : v);
      });
      layout.sharedCols.forEach(c=>{
        if(i===0){
          const v = g.values[paramKey(c.code, '')];
          row.push(v===undefined || v===null ? '' : v);
        } else row.push('');
      });
      layout.insLossCols.forEach(c=>{
        const v = g.values[paramKey(c.code, lookupPort)];
        row.push(v===undefined || v===null ? '' : v);
      });
      layout.isolationCols.forEach(c=>{
        const pairPort = nPorts===3 ? ['Port1-Port2','Port2-Port3','Port3-Port1'][i] : 'Port1-Port2';
        const v = g.values[paramKey(c.code, pairPort)];
        row.push(v===undefined || v===null ? '' : v);
      });
      rows.push(row);
    }

    if(nPorts>1){
      const blockEndRow = rows.length - 1;
      [0,1,2].forEach(c=> merges.push({ s:{r:blockStartRow,c}, e:{r:blockEndRow,c} }));
      const sharedStartCol = 4 + layout.perPortCols.length;
      layout.sharedCols.forEach((c,i)=> merges.push({ s:{r:blockStartRow,c:sharedStartCol+i}, e:{r:blockEndRow,c:sharedStartCol+i} }));
    }
  });

  layout.groups.forEach(([startCol,endCol])=>{
    if(endCol>startCol) merges.push({ s:{r:0,c:startCol-1}, e:{r:0,c:endCol-1} });
  });
  return { rows, merges };
}

function buildSawFilterSheet(groups){
  const rows = [ ['MODEL','INSPECTOR','SERIAL','Type','REF Voltage'] ];
  groups.forEach(g=>{
    const type = g.model === 'AGL-1004H' ? 'RDET' : 'SAW';
    const v = g.values[paramKey('ref_voltage','')];
    rows.push([g.model, g.inspector_name || '', g.serial, type, v===undefined||v===null?'':v]);
  });
  return { rows, merges: [] };
}

/* Fetches every measurement row for a component type (optionally scoped to
   one model), paginating past PostgREST's default row cap. model === '__ALL__'
   means no model filter - every model under that component type. */
async function fetchMeasurementsForDownload(componentType, model){
  const pageSize = 1000;
  let offset = 0;
  let all = [];
  while(true){
    const res = await fetch(
      MEASUREMENTS_URL + '?component_type=eq.' + enc(componentType) +
      (model !== '__ALL__' ? ('&model=eq.' + enc(model)) : '') +
      '&select=model,serial,measured_date,inspector_name,parameter_code,value,port&order=model.asc,serial.asc&offset=' + offset + '&limit=' + pageSize,
      { headers: sbHeaders() }
    );
    if(!res.ok){ const t = await res.text(); throw new Error('HTTP ' + res.status + ' ' + t.slice(0,180)); }
    const rows = await res.json();
    all = all.concat(rows);
    if(rows.length < pageSize) break;
    offset += pageSize;
  }
  return all;
}

/* ---------- Excel styling for Download Center exports ---------- */
const XLSX_FONT = { name:'Arial', size:10 };
const XLSX_HEADER_FONT = { name:'Arial', size:10, bold:true };
const XLSX_HEADER_FILL = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFDCE6F1' } }; // light pastel blue
const XLSX_THIN_BORDER = { top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'} };

/* Saw_Filter has just 1 header row (no grouped super-header); every other
   layout has 2 (group row + column-title row). */
function headerRowCountFor(componentType){ return componentType === 'Saw_Filter' ? 1 : 2; }

/* Writes {rows, merges} out as a styled .xlsx and triggers a browser download.
   Arial 10pt throughout; header rows bold with a light blue fill; gridlines
   off; every cell (header and data) gets a thin border on all sides. */
async function writeStyledWorkbook(sheetData, headerRowCount, filename){
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Data', { views: [{ showGridLines:false }] });

  sheetData.rows.forEach(row => ws.addRow(row));

  const totalCols = Math.max.apply(null, sheetData.rows.map(r=>r.length));
  const totalRows = sheetData.rows.length;

  for(let r=1; r<=totalRows; r++){
    for(let c=1; c<=totalCols; c++){
      const cell = ws.getCell(r, c);
      const isHeader = r <= headerRowCount;
      cell.font = isHeader ? XLSX_HEADER_FONT : XLSX_FONT;
      if(isHeader) cell.fill = XLSX_HEADER_FILL;
      cell.border = XLSX_THIN_BORDER;
      if(isHeader){
        const wrap = typeof cell.value === 'string' && cell.value.indexOf('\n') !== -1;
        cell.alignment = { wrapText:wrap, vertical:'center', horizontal:'center' };
      }
    }
  }

  (sheetData.merges || []).forEach(m=>{
    ws.mergeCells(m.s.r+1, m.s.c+1, m.e.r+1, m.e.c+1);
  });

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

async function runDownloadCenterExport(){
  const componentType = state.downloadCenterComponentType;
  const model = state.downloadCenterModel;
  if(!componentType){ showToast('Select a component type first.'); return; }
  state.downloadCenterLoading = true; render();
  try{
    const rawRows = state.demoMode
      ? DEMO_MEASUREMENTS.filter(r=>r.component_type===componentType && (model==='__ALL__' || r.model===model))
      : await fetchMeasurementsForDownload(componentType, model);
    if(!rawRows.length){
      showToast('No data to download for this selection.');
    } else {
      const groups = groupUnitsByModel(rawRows);
      let sheetData;
      if(componentType === 'Saw_Filter'){
        sheetData = buildSawFilterSheet(groups);
      } else if(PORT_LAYOUTS[componentType]){
        sheetData = buildPortSheet(componentType, PORT_LAYOUTS[componentType], groups);
      } else if(SIMPLE_LAYOUTS[componentType]){
        sheetData = buildSimpleSheet(componentType, SIMPLE_LAYOUTS[componentType], groups);
      } else {
        showToast('No export layout defined yet for ' + componentTypeLabel(componentType) + '.');
        state.downloadCenterLoading = false; render();
        return;
      }
      const modelLabel = model === '__ALL__' ? 'AllModels' : model;
      const filename = componentType + '_' + modelLabel + '_' + todayISO() + '.xlsx';
      await writeStyledWorkbook(sheetData, headerRowCountFor(componentType), filename);
      showToast('Downloaded ' + groups.length + ' units \u2014 ' + filename);
    }
  } catch(e){
    showToast('Download failed: ' + e.message);
  }
  state.downloadCenterLoading = false;
  render();
}

async function loadSpcData(){

  if(!activeSpec){ state.spcMeasurementsAll = []; state.spcMeasurements = []; state.spcStats = null; render(); return; }
  const code = activeSpec.parameter_code;
  const port = activeSpec.port || '';
  let rows;
  if(state.demoMode){
    rows = DEMO_MEASUREMENTS.filter(r=>r.component_type===state.componentType && r.model===state.model && r.parameter_code===code && (r.port||'')===port)
      .map(r=>({ serial:r.serial, value:r.value, measured_date:r.measured_date }))

}

/* Returns the [start, end] ISO date bounds (inclusive) for the current range
   preset, or nulls for 'all' (no filtering). String comparison against
   measured_date works directly since ISO dates sort lexicographically. */
function computeSpcRangeBounds(){
  const preset = state.spcRangePreset;
  if(preset === 'all') return { start:null, end:null };
  if(preset === 'custom') return { start: state.spcRangeStart || null, end: state.spcRangeEnd || null };
  const end = new Date();
  const start = new Date();
  if(preset === '1m') start.setMonth(start.getMonth()-1);
  else if(preset === '3m') start.setMonth(start.getMonth()-3);
  else if(preset === '6m') start.setMonth(start.getMonth()-6);
  else if(preset === '1y') start.setFullYear(start.getFullYear()-1);
  return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10) };
}

function applySpcRange(){
  const { start, end } = computeSpcRangeBounds();
  let rows = state.spcMeasurementsAll || [];
  if(start) rows = rows.filter(r => r.measured_date >= start);
  if(end) rows = rows.filter(r => r.measured_date <= end);
  state.spcMeasurements = rows;
  const activeSpec = (state.specByModel[state.model] || []).find(p=>paramKey(p.parameter_code,p.port)===state.spcParam);
  state.spcStats = computeStats(activeSpec, rows.map(r=>Number(r.value)));
  render();
}

function setSpcRangePreset(preset){
  state.spcRangePreset = preset;
  if(preset !== 'custom'){ applySpcRange(); }
  else { render(); }
}
function setSpcRangeCustom(which, value){
  if(which === 'start') state.spcRangeStart = value; else state.spcRangeEnd = value;
  if(state.spcRangeStart && state.spcRangeEnd) applySpcRange();
  else render();
}

function computeStats(spec, values){
  const n = values.length;
  if(n===0) return { n:0 };
  const mean = values.reduce((a,b)=>a+b,0)/n;
  let ucl=null, lcl=null, sigma=null;
  if(n>=2){
    const mr = [];
    for(let i=1;i<n;i++) mr.push(Math.abs(values[i]-values[i-1]));
    const mrbar = mr.reduce((a,b)=>a+b,0)/mr.length;
    sigma = mrbar / 1.128;
    ucl = mean + 2.66*mrbar;
    lcl = mean - 2.66*mrbar;
  }
  let cp=null, cpu=null, cpl=null, cpk=null;
  if(spec && sigma!=null && sigma>0){
    if(spec.usl!=null) cpu = (Number(spec.usl)-mean)/(3*sigma);
    if(spec.lsl!=null) cpl = (mean-Number(spec.lsl))/(3*sigma);
    if(spec.usl!=null && spec.lsl!=null){ cp = (Number(spec.usl)-Number(spec.lsl))/(6*sigma); cpk = Math.min(cpu,cpl); }
    else if(spec.usl!=null){ cpk = cpu; }
    else if(spec.lsl!=null){ cpk = cpl; }
  }
  const outOfControl = (ucl!=null) ? values.filter(v=>v>ucl || v<lcl).length : 0;
  const outOfSpec = spec ? values.filter(v=>evalPass(spec,v)===false).length : 0;
  return { n, mean, sigma, ucl, lcl, cp, cpk, outOfControl, outOfSpec };
}

    });
    const paramKeys = sortedSpec.map(p=>paramKey(p.parameter_code, p.port));

      ? sortedSpec.map(p=>{

        }).join('')
      : '<option value="">No parameters</option>';

        '<button class="stepper-btn" onclick="stepSpcParam(1)" ' + (atEnd?'disabled':'') + ' title="Next parameter" aria-label="Next parameter">\u25bc</button>' +
      '</div>' +

  }

/* Steps the SPC Parameter selection to the previous (-1) or next (+1) entry
   in the same sorted order the dropdown itself uses, so the arrows and the
   dropdown always agree on what "next" means. Clamped at both ends rather
   than wrapping. */
function stepSpcParam(direction){
  const spec = state.specByModel[state.model] || [];
  const sortedSpec = spec.slice().sort((a,b)=>{
    const rp = portRank(a.port) - portRank(b.port);
    return rp !== 0 ? rp : paramRank(a.parameter_code) - paramRank(b.parameter_code);
  });
  const keys = sortedSpec.map(p=>paramKey(p.parameter_code, p.port));
  if(!keys.length) return;
  const idx = keys.indexOf(state.spcParam);
  let newIdx = (idx === -1 ? 0 : idx + direction);
  if(newIdx < 0) newIdx = 0;
  if(newIdx > keys.length - 1) newIdx = keys.length - 1;
  if(newIdx === idx) return;
  state.spcParam = keys[newIdx];
  loadSpcData();
}

}

function renderSpcRangeBar(){
  const preset = state.spcRangePreset;
  const presets = [['1m','1M'],['3m','3M'],['6m','6M'],['1y','1Y'],['all','All'],['custom','Custom']];
  const pills = presets.map(([key,label])=>
    '<button class="range-pill ' + (preset===key?'active':'') + '" onclick="setSpcRangePreset(\'' + key + '\')">' + label + '</button>'
  ).join('');
  const customInputs = preset === 'custom'
    ? '<input type="date" class="input range-date-input" value="' + escAttrText(state.spcRangeStart) + '" onchange="setSpcRangeCustom(\'start\', this.value)">' +
      '<span class="range-date-sep">\u2013</span>' +
      '<input type="date" class="input range-date-input" value="' + escAttrText(state.spcRangeEnd) + '" onchange="setSpcRangeCustom(\'end\', this.value)">'
    : '';
  return '<div class="spc-range-bar"><span class="range-label">Range:</span><div class="range-pills">' + pills + '</div>' + customInputs + '</div>';
}

function renderSpcTab(){
  const spec = state.specByModel[state.model] || [];
  if(state.specLoading){
    return renderSelectorRow(true) + '<div class="empty-note" style="padding:60px 20px">Loading spec limits\u2026</div>';
  }
  if(!spec.length){
    return renderSelectorRow(true) + '<div class="panel"><div class="empty-note">No spec data available yet for ' + componentTypeLabel(state.componentType) + '.</div></div>';
  }
  const s = state.spcStats;
  const activeSpec = spec.find(p=>paramKey(p.parameter_code,p.port)===state.spcParam);

  if(!s || s.n===0){
    return renderSelectorRow(true) + renderSpcRangeBar() +
      '<div class="panel"><div class="empty-note">No measurement data ' + (state.spcRangePreset!=='all' ? 'in this date range' : 'yet') + ' for this parameter.</div></div>' +
      renderRecentEntriesPanel();
  }

  const cards = '' +
    statCard('Samples (n)', s.n) +
    statCard('Mean', fmtNum(s.mean) + (activeSpec && activeSpec.unit ? (' ' + activeSpec.unit) : '')) +
    statCard('Process \u03c3 (from MR)', s.sigma!=null ? fmtNum(s.sigma) : '\u2014') +
    statCardCls('Cpk', s.cpk!=null ? fmtNum(s.cpk) : '\u2014', cpkClass(s.cpk)) +
    statCardCls('Out of Spec', s.outOfSpec + ' / ' + s.n, s.outOfSpec>0 ? 'bad' : 'good');

  const legend = '' +
    '<div class="chart-legend-note">' +
      '<div class="legend-item"><span class="legend-swatch" style="border-color:#0064E0"></span>Measured value (red point = out of spec)</div>' +
      '<div class="legend-item"><span class="legend-swatch dashed" style="border-color:#8595A4"></span>Center line / UCL / LCL (process control, from moving range)</div>' +
      '<div class="legend-item"><span class="legend-swatch dashed" style="border-color:#E41E3F"></span>USL / LSL (customer spec limit)</div>' +
    '</div>';

  return renderSelectorRow(true) + renderSpcRangeBar() +
    '<div class="card-grid">' + cards + '</div>' +
    '<div class="panel"><div class="chart-wrap"><canvas id="spcCanvas"></canvas></div>' + legend + '</div>' +
    renderRecentEntriesPanel();
}

function statCard(label, value){ return statCardCls(label, value, ''); }
function statCardCls(label, value, cls){
  return '<div class="stat-card"><div class="stat-label">' + escAttrText(label) + '</div><div class="stat-value ' + cls + '">' + value + '</div></div>';
}

/* ---------- Chart.js drawing (runs after innerHTML is rebuilt) ---------- */
let chartInstance = null;
function drawChart(){
  const canvas = document.getElementById('spcCanvas');
  if(!canvas) return;
  if(typeof Chart === 'undefined'){ setTimeout(drawChart, 150); return; }
  if(chartInstance){ chartInstance.destroy(); chartInstance = null; }

  const spec = (state.specByModel[state.model] || []).find(p=>paramKey(p.parameter_code,p.port)===state.spcParam);
  const pts = state.spcMeasurements;
  const s = state.spcStats;
  if(!spec || !pts.length || !s) return;

  const labels = pts.map(p=>p.serial);
  const values = pts.map(p=>Number(p.value));
  const flat = (v)=> labels.map(()=>v);
  const pointColors = values.map(v=> evalPass(spec,v)===false ? '#E41E3F' : '#0064E0');

  const datasets = [{
    label: spec.parameter_label + (spec.unit ? (' (' + spec.unit + ')') : '') + (spec.port ? (' \u2014 ' + spec.port) : ''),
    data: values,
    borderColor: '#0064E0',
    backgroundColor: '#0064E0',
    pointBackgroundColor: pointColors,
    pointBorderColor: pointColors,
    pointRadius: 3,
    borderWidth: 1.5,
    tension: 0,
    spanGaps: true
  }];

  if(s.mean!=null){ datasets.push({ label:'Center Line', data: flat(s.mean), borderColor:'#8595A4', borderDash:[4,4], pointRadius:0, borderWidth:1.5 }); }
  if(s.ucl!=null){ datasets.push({ label:'UCL', data: flat(s.ucl), borderColor:'#8595A4', borderDash:[2,2], pointRadius:0, borderWidth:1 }); }
  if(s.lcl!=null){ datasets.push({ label:'LCL', data: flat(s.lcl), borderColor:'#8595A4', borderDash:[2,2], pointRadius:0, borderWidth:1 }); }
  if(spec.usl!=null){ datasets.push({ label:'USL (Spec)', data: flat(Number(spec.usl)), borderColor:'#E41E3F', borderDash:[6,3], pointRadius:0, borderWidth:1.5 }); }
  if(spec.lsl!=null){ datasets.push({ label:'LSL (Spec)', data: flat(Number(spec.lsl)), borderColor:'#E41E3F', borderDash:[6,3], pointRadius:0, borderWidth:1.5 }); }
  if(spec.limit_type==='target' && spec.target!=null){ datasets.push({ label:'Target', data: flat(Number(spec.target)), borderColor:'#F2A918', borderDash:[6,3], pointRadius:0, borderWidth:1.5 }); }

  chartInstance = new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{ labels, datasets },
    options:{
      responsive:true, maintainAspectRatio:false, animation:false,
      interaction:{ mode:'nearest', intersect:false },
      plugins:{
        legend:{ position:'top', labels:{ boxWidth:14, font:{ family:"'Google Sans','Noto Sans KR',sans-serif", size:11 } } },
        tooltip:{ callbacks:{ title:(items)=> 'Serial: ' + items[0].label } }
      },
      scales:{
        x:{ ticks:{ maxRotation:60, minRotation:0, autoSkip:true, font:{ size:10 } }, grid:{ display:false } },
        y:{ title:{ display:true, text: spec.unit || '' }, grid:{ color:'#EEF1F4' } }
      }
    }
  });
}

/* ---------- root render ---------- */
const SECURITY_NOTICE = 'This data is proprietary and confidential. It is maintained under strict, enterprise-grade security \u2014 encrypted in transit, protected by row-level access policies at the database layer, and accessible to authorized BCT personnel only.';

function render(){
  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  // Reading/restoring selection only applies to text-like inputs (text, search, url, tel,
  // password); other types (number, date, email...) return null or throw depending on the
  // browser, so this is wrapped defensively and never blocks the rest of render().
  let selStart = null, selEnd = null;
  try{
    if(active && typeof active.selectionStart === 'number') selStart = active.selectionStart;
    if(active && typeof active.selectionEnd === 'number') selEnd = active.selectionEnd;
  }catch(e){ selStart = null; selEnd = null; }

  let html;
  if(state.authView==='checking'){
    html = '<div class="empty-note" style="padding:120px 20px;text-align:center">Checking sign-in status\u2026</div>';
  } else if(state.authView==='login'){
    html = renderHeader() + renderLoginScreen();
  } else {
    const pageHead = '<div class="page-head"><h1>SPC Chart</h1><p>Statistical process control for adjustment &amp; test measurements, with spec limits overlaid.</p></div>';
    html = renderHeader() +
      '<div class="content">' + pageHead + renderDownloadCenter() + renderSpcTab() + '</div>' +
      '<div class="security-footer">\ud83d\udd12 ' + SECURITY_NOTICE + '</div>' +
      (state.toast ? '<div class="toast">' + escAttrText(state.toast) + '</div>' : '');
  }

  document.getElementById('app').innerHTML = html;

  if(activeId){
    const el = document.getElementById(activeId);
    if(el && typeof el.focus === 'function'){
      el.focus();
      if(selStart!=null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }

  if(state.authView==='app'){
    if(typeof requestAnimationFrame === 'function'){ requestAnimationFrame(drawChart); } else { setTimeout(drawChart, 0); }
  }
}

render();
initAuth();

/* Exposed for support/debugging only (e.g. window.__debug.state in the browser console) */
window.__debug = { state, computeStats, evalPass, sortModels, componentTypeLabel, paramKey, portRank, sortComponentTypes, formatFrequencyKHz, computeSpcRangeBounds, applySpcRange, stepSpcParam, SIMPLE_LAYOUTS, PORT_LAYOUTS, groupUnitsByModel, buildSimpleSheet, buildPortSheet, buildSawFilterSheet, runDownloadCenterExport, loadDownloadCenterModels, writeStyledWorkbook, headerRowCountFor };

</script>
