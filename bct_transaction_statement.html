<style>
  :root{

  *{ box-sizing:border-box; }

  .btn{

  .totals-box{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:12px; }

  .totals-box small{ display:block; font-size:10.5px; color:var(--steel); font-weight:600; }
  .totals-box b{ font-family:var(--font-mono); font-size:14px; color:var(--primary-deep); }
  details.fold{ border:1px solid var(--hairline); border-radius:var(--r-md); padding:0; background:#fff; }
  details.fold > summary{ cursor:pointer; list-style:none; padding:11px 14px; font-weight:700; font-size:13px; display:flex; align-items:center; gap:8px; }
  details.fold > summary::-webkit-details-marker{ display:none; }

  details.fold[open] > summary::after{ transform:rotate(180deg); }

  /* ================= Right: A4 preview ================= */
  .preview-wrap{ height:calc(100vh - 54px); overflow:auto; background:#DCE3ED; display:flex; flex-direction:column; align-items:center; align-items:safe center; justify-content:flex-start; padding:28px 16px 80px; position:relative; }

  .splitter::after{ content:''; width:2px; height:36px; border-radius:2px; background:#9AA9C0; }
  .splitter:hover, .splitter.drag{ background:#BFD0EA; } .splitter.drag::after{ background:var(--primary); }
  body.resizing{ cursor:col-resize; user-select:none; } body.resizing .preview-wrap, body.resizing .panel{ pointer-events:none; }
  .zoombar{ position:sticky; top:0; z-index:5; align-self:center; display:flex; align-items:center; gap:2px; background:#fff; border:1px solid var(--hairline); border-radius:999px; padding:3px; box-shadow:0 2px 8px rgba(21,59,120,.12); margin:-16px 0 14px; flex:none; }
  .zoombar button{ border:0; background:transparent; font:inherit; font-size:12.5px; color:var(--ink); padding:5px 11px; border-radius:999px; cursor:pointer; }
  .zoombar button:hover{ background:#EEF3FB; } .zoombar button.on{ background:var(--primary); color:#fff; }
  .zoombar .pct{ min-width:46px; text-align:center; font-size:12px; color:var(--steel); font-family:'JetBrains Mono',monospace; }

    box-shadow:0 20px 50px -20px rgba(11,18,32,.35), 0 0 0 1px rgba(11,18,32,.04);
    padding:8mm 12mm; font-family:var(--font-ko);
  }
  .copies{ display:flex; flex-direction:column; height:100%; }
  .stmt{ display:flex; flex-direction:column; gap:2mm; font-size:9.5px; line-height:1.35; }
  .stmt > *{ flex:0 0 auto; }
  .mode-two .stmt{ height:136mm; }
  .mode-buyer .stmt, .mode-seller .stmt{ height:100%; font-size:11px; gap:3mm; }

  .cut{ position:relative; height:9mm; flex:0 0 auto; }
  .cut::before{ content:''; position:absolute; left:0; right:0; top:50%; border-top:1px dashed #5C6B89; }
  .cut span{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:#fff; padding:0 8px; font-size:8px; color:var(--ink); font-family:var(--font-ko); }

  .s-head{ display:grid; grid-template-columns:1fr auto 1fr; align-items:end; border-bottom:2.5px solid var(--primary-deep); padding-bottom:1.6mm; }
  .s-head .logo img{ height:11mm; display:block; }
  .mode-buyer .s-head .logo img, .mode-seller .s-head .logo img{ height:14mm; }
  .s-head .ttl{ text-align:center; }
  .s-head h1{ font-family:var(--font-ko); font-weight:700; font-size:19px; letter-spacing:.38em; padding-left:.38em; line-height:1.1; }
  .mode-buyer .s-head h1, .mode-seller .s-head h1{ font-size:26px; }
  .s-head .en{ font-family:var(--font-mono); font-size:7.5px; letter-spacing:.16em; margin-top:1px; }

  .mode-buyer .s-head .meta, .mode-seller .s-head .meta{ font-size:10px; }
  .copy-tag{ display:inline-block; border:1px solid var(--primary-deep); color:var(--primary-deep); font-family:var(--font-ko); font-weight:700; font-size:8.5px; padding:0 6px; border-radius:99px; margin-bottom:1px; letter-spacing:0; }

  .parties{ display:grid; grid-template-columns:1fr 1fr; gap:3mm; }
  table.party{ border-collapse:collapse; width:100%; table-layout:fixed; }
  table.party th, table.party td{ border:1px solid var(--bd); padding:.9mm 1.4mm; vertical-align:middle; word-break:keep-all; overflow-wrap:anywhere; }
  table.party th{ background:var(--primary-pale); font-weight:700; text-align:center; white-space:nowrap; }
  table.party col.kside{ width:6mm; } table.party col.kth{ width:13mm; } table.party col.kth2{ width:14mm; }
  .mode-buyer table.party col.kth, .mode-seller table.party col.kth{ width:15mm; }
  .mode-buyer table.party col.kth2, .mode-seller table.party col.kth2{ width:15mm; }
  .parties{ align-items:stretch; }
  table.party{ height:100%; }
  table.party td.ceo{ position:relative; height:13.5mm; white-space:nowrap; padding-right:1.4mm; }
  .mode-buyer table.party td.ceo, .mode-seller table.party td.ceo{ height:16.5mm; }
  .seal-img{ position:absolute; right:1.5mm; top:50%; transform:translateY(-50%); width:12mm; height:12mm; z-index:3; pointer-events:none; }
  .mode-buyer .seal-img, .mode-seller .seal-img{ width:14.5mm; height:14.5mm; }
  .s-foot{ margin-top:auto; border-top:1px solid var(--bd); padding-top:1mm; text-align:center; font-family:var(--font-mono); font-size:.95em; letter-spacing:.02em; min-height:4mm; }
  .mode-two table.items tbody td{ height:5.7mm; }
  .mode-two .box .bb{ min-height:8mm; }
  #importArea{ margin-top:6px; }
  table.party th.side{ background:var(--primary-deep); color:#fff; line-height:1.25; padding:0; font-size:inherit; }
  table.party td{ font-family:var(--font-en); }
  table.party td.mono{ font-family:var(--font-mono) !important; letter-spacing:-.01em; }
  table.party td .hon{ font-family:var(--font-ko); font-weight:700; margin-left:4px; }
  table.party td .seal{ float:right; font-family:var(--font-ko); color:var(--ink); }
  table.party td.nm{ font-weight:700; }

  .total-bar{ display:grid; grid-template-columns:auto 1fr auto; border:1.5px solid var(--primary-deep); align-items:center; }
  .total-bar .k{ background:var(--primary-deep); color:#fff; font-weight:700; padding:1.4mm 4mm; letter-spacing:.2em; }

  .total-bar .num{ padding:0 3mm; font-family:var(--font-mono); font-weight:700; font-size:1.15em; border-left:1px solid var(--bd); align-self:stretch; display:flex; align-items:center; }

  table.items{ border-collapse:collapse; width:100%; table-layout:fixed; }
  table.items th, table.items td{ border:1px solid var(--bd); padding:.5mm 1.4mm; }

  table.items tbody td{ height:6mm; vertical-align:middle; font-family:var(--font-en); word-break:keep-all; overflow-wrap:anywhere; }
  .mode-buyer table.items tbody td, .mode-seller table.items tbody td{ height:7mm; }
  table.items td.c{ text-align:center; font-family:var(--font-mono); }
  table.items td.r{ text-align:right; font-family:var(--font-mono); }
  table.items tbody tr:nth-child(even) td{ background:var(--primary-pale-2); }
  table.items tfoot td{ background:var(--primary-pale); font-weight:700; padding:1mm 1.4mm; }
  table.items tfoot td.r{ font-family:var(--font-mono); text-align:right; }
  table.items tfoot td.lab{ text-align:center; letter-spacing:.5em; }

  .s-bottom{ display:grid; grid-template-columns:1fr 56mm; gap:3mm; }
  .box{ border:1px solid var(--bd); }

  .box .bb{ padding:1.2mm 2mm; white-space:pre-wrap; word-break:break-all; font-family:var(--font-en); min-height:9mm; }
  .mode-buyer .box .bb, .mode-seller .box .bb{ min-height:22mm; }
  .sign{ display:grid; grid-template-columns:1fr 1fr; }
  .sign > div + div{ border-left:1px solid var(--bd); }
  .sign .sb{ height:11mm; display:flex; align-items:flex-end; justify-content:flex-end; padding:1mm 2mm; font-size:.9em; }
  .mode-buyer .sign .sb, .mode-seller .sign .sb{ height:20mm; }

  .ovf-overlay{ width:100%; max-width:794px; margin:0 0 14px; }

  /* modal */

  .modal{ background:#fff; border-radius:var(--r-lg); width:min(760px,100%); box-shadow:0 30px 70px -20px rgba(11,18,32,.5); }

  .radio-row{ display:flex; gap:18px; flex-wrap:wrap; font-size:13px; margin-top:8px; }

  @media print{
    @page{ size:A4; margin:0; }
    html,body{ height:auto; background:#fff; }

    .sheet-scale{ zoom:1 !important; }
    .a4-sheet{ box-shadow:none; margin:0; width:210mm; height:296.5mm; }

  }
  @media (max-width:980px){
    .layout{ grid-template-columns:1fr; }
    .splitter{ display:none; }
    .panel, .preview-wrap{ height:auto; }
  }
</style>

        <div class="field"><label>거래일자</label><input type="date" class="mono" data-b="date"></div>
      </div>
      <div class="field-row">
        <div class="field full"><label>출력 구성</label>
          <select data-b="copyMode">
            <option value="two">공급받는자용 + 공급자용 (A4 상·하 2부, 품목 최대 8행)</option>
            <option value="buyer">공급받는자용 1부 (A4 전체, 품목 최대 20행)</option>
            <option value="seller">공급자용 1부 (A4 전체, 품목 최대 20행)</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>부가세</label>
          <select data-b="vat">
            <option value="10">과세 10%</option>
            <option value="0">영세율 0%</option>
            <option value="exempt">면세</option>
          </select>
        </div>
        <div class="field"><label>세액 원 미만 처리</label>
          <select data-b="round">
            <option value="floor">절사</option>
            <option value="round">반올림</option>
          </select>
        </div>
      </div>
      <div class="field"><div class="hint">명세표 번호는 날짜 기반으로 자동 제안되며 사내 번호 체계에 맞게 자유롭게 수정할 수 있습니다. 세액은 품목별로 계산한 뒤 합산합니다.</div></div>
    </div>

    <div class="pgroup">
      <div class="pgroup-head"><span class="pgroup-num">02</span><span class="pgroup-title">공급받는자 (거래처)</span><span class="pgroup-note" id="custCount">거래처 0건</span></div>
      <div class="field full" style="margin-bottom:10px">
        <label>상호 — 거래처 목록에서 검색하거나 직접 입력</label>
        <div class="ac-wrap">
          <input type="text" id="f_bname" data-b="buyer.name" autocomplete="off" placeholder="상호 · 거래처코드 · 사업자번호 · 대표자로 검색">
          <div class="ac-list" id="acList"></div>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>사업자등록번호</label><input type="text" class="mono" data-b="buyer.bizno" data-fmt="bizno" placeholder="000-00-00000"></div>
        <div class="field"><label>대표자</label><input type="text" data-b="buyer.ceo"></div>
      </div>
      <div class="field full" style="margin-top:10px"><label>주소</label><input type="text" data-b="buyer.address" placeholder="사업장 주소"></div>

        <button type="button" class="pbtn solid" id="btnSaveCust">이 거래처를 목록에 저장</button>
        <button type="button" class="pbtn" id="btnClearBuyer">입력 지우기</button>

      <div class="row-actions"><button type="button" class="pbtn solid" id="btnAddItem">+ 품목 추가</button></div>
      <div class="cap-line" id="capLine"></div>

            <div class="field"><label>사업자등록번호</label><input type="text" class="mono" data-b="seller.bizno" data-fmt="bizno" placeholder="000-00-00000"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>대표이사</label><input type="text" data-b="seller.ceo"></div>
            <div class="field"><label>입금 계좌 (선택, 비고란에 출력)</label><input type="text" data-b="seller.bank" placeholder="은행 계좌번호 예금주"></div>
          </div>
          <div class="field-row"><div class="field full"><label>주소</label><input type="text" data-b="seller.addr"></div></div>

        </div>
      </details>
    </div>

  function numToKorean(n){
    n=Math.round(Math.abs(n)); if(n===0) return '영';
    var dig=['','일','이','삼','사','오','육','칠','팔','구'], sm=['','십','백','천'], big=['','만','억','조','경'];
    var out='', gi=0;
    while(n>0){
      var g=n%10000; n=Math.floor(n/10000);
      if(g>0){
        var s='', gs=String(g); while(gs.length<4) gs='0'+gs;
        for(var i=0;i<4;i++){ var d=+gs[i]; if(d>0) s+=((d===1&&i<3)?'':dig[d])+sm[3-i]; }
        out=s+big[gi]+out;
      }
      gi++;
    }
    return out;
  }

  function custKey(c){ return digits(c.bizno).length===10?'b'+digits(c.bizno):(c.code?'c'+norm(c.code):'n'+norm(c.name)); }
  function upsertCustomers(list,replace){
    var map={}, out=replace?[]:customers.slice();
    out.forEach(function(c,i){ map[custKey(c)]=i; });
    var added=0, updated=0;
    list.forEach(function(c){
      var k=custKey(c);
      if(k in map){ out[map[k]]=Object.assign({},out[map[k]],c); updated++; }
      else { map[k]=out.length; out.push(c); added++; }
    });
    customers=out;
    var ok=LS.set(KEY_CUST,customers);
    if(!ok) toast('저장 용량을 초과했습니다 — 이번 세션에서만 유지됩니다');
    updateCustCount();
    return {added:added,updated:updated,ok:ok};

  /* ---------------- Supabase (REST, fetch · 인증 없음) ---------------- */
  var sbBusy=false, sbOk=null;   // sbOk: null=미확인, true=서버 연결, false=오프라인(저장본 사용)
  function sbFetch(path,opt){
    opt=opt||{}; var h=Object.assign({apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},opt.headers||{});
    return fetch(SB_URL+'/rest/v1/'+path,Object.assign({},opt,{headers:h})).then(function(r){
      if(!r.ok) return r.text().then(function(t){ var m=t; try{ var j=JSON.parse(t); m=j.message||j.hint||t; }catch(e){} throw new Error(m||('HTTP '+r.status)); });
      return r;
    });
  }
  function rowToCust(r){ return { code:r.code, bizno:r.code, name:r.name||'', ceo:r.ceo||'', phone:r.phone||'', address:r.address||'' }; }
  function sbLoad(){
    var all=[], PAGE=1000;
    function page(off){
      return sbFetch(SB_TABLE+'?select=code,name,ceo,phone,address&order=name.asc&limit='+PAGE+'&offset='+off).then(function(r){ return r.json(); }).then(function(rows){
        all=all.concat(rows); return rows.length===PAGE?page(off+PAGE):all;
      });
    }
    sbBusy=true; updateCustCount();
    return page(0).then(function(rows){
      customers=rows.map(rowToCust); LS.set(KEY_CUST,customers); sbBusy=false; sbOk=true; updateCustCount(); return customers.length;
    },function(e){ sbBusy=false; sbOk=false; updateCustCount(); throw e; });
  }

  /* ---------------- CSV save / load ---------------- */
  var MODE_LABEL={two:'2부(공급받는자용+공급자용)',buyer:'1부(공급받는자용)',seller:'1부(공급자용)'};
  var VAT_LABEL={'10':'과세10%','0':'영세율0%','exempt':'면세'};
  var ROUND_LABEL={floor:'절사',round:'반올림'};
  function csvCell(v){ v=String(v==null?'':v); return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
  function safeName(s){ return String(s||'').replace(/[\\\/:*?"<>|]+/g,'_').replace(/\s+/g,' ').trim(); }
  function buildCsv(){
    var r=[['구분','항목/품명','값','규격','수량','단가','비고']];
    r.push(['문서','명세표번호',S.docNo]); r.push(['문서','거래일자',S.date]);
    r.push(['문서','출력구성',MODE_LABEL[S.copyMode]]); r.push(['문서','부가세',VAT_LABEL[S.vat]]); r.push(['문서','세액처리',ROUND_LABEL[S.round]]);
    r.push(['문서','비고',S.note]);
    r.push(['거래처','거래처코드',S.buyer.code]); r.push(['거래처','상호',S.buyer.name]); r.push(['거래처','사업자등록번호',S.buyer.bizno]); r.push(['거래처','대표자',S.buyer.ceo]); r.push(['거래처','주소',S.buyer.address]);
    S.items.forEach(function(it){ if(it.name||it.spec||it.qty!==''||it.price!==''||it.note) r.push(['품목',it.name,'',it.spec,it.qty,it.price,it.note]); });
    return '﻿'+r.map(function(row){ return row.map(csvCell).join(','); }).join('\r\n')+'\r\n';
  }
  function parseCsv(text){
    var rows=[], row=[], cur='', q=false, i, c;
    text=text.replace(/^﻿/,'');
    for(i=0;i<text.length;i++){
      c=text[i];
      if(q){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=c; }
      else if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c!=='\r') cur+=c;
    }
    if(cur!==''||row.length){ row.push(cur); rows.push(row); }
    return rows;
  }
  function normDate(v){
    v=String(v||'').trim(); var m;
    if((m=v.match(/^(\d{4})\D+(\d{1,2})\D+(\d{1,2})/))) return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
    if((m=v.match(/^(\d{4})(\d{2})(\d{2})$/))) return m[1]+'-'+m[2]+'-'+m[3];
    if((m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return m[3]+'-'+pad(m[1])+'-'+pad(m[2]);
    return '';
  }
  function cs(v){ return v==null?'':String(v); }
  function applyCsv(rows){
    var doc={}, buyer=blankParty(), items=[], hit=0, bmap={'거래처코드':'code','상호':'name','사업자등록번호':'bizno','대표자':'ceo','주소':'address'};
    rows.forEach(function(r){
      var kind=cs(r[0]).replace(/^﻿/,'').trim(), k=cs(r[1]).trim();
      if(kind==='문서'){ hit++; doc[k]=cs(r[2]); }
      else if(kind==='거래처'){ hit++; if(bmap[k]) buyer[bmap[k]]=cs(r[2]).trim(); }
      else if(kind==='품목'){ hit++; items.push({name:cs(r[1]),spec:cs(r[3]),qty:cs(r[4]).trim(),price:cs(r[5]).trim(),note:cs(r[6])}); }
    });
    if(!hit) return null;
    if(doc['명세표번호'] && doc['명세표번호'].trim()) S.docNo=doc['명세표번호'].trim();
    var d=normDate(doc['거래일자']); if(d) S.date=d;
    var m=norm(doc['출력구성']);
    if(m.indexOf('2부')>=0||m==='two') S.copyMode='two';
    else if(m==='seller'||m.indexOf('공급자용')>=0) S.copyMode='seller';
    else if(m==='buyer'||m.indexOf('공급받는자용')>=0) S.copyMode='buyer';
    var v=norm(doc['부가세']);
    if(v){ S.vat = v.indexOf('면세')>=0?'exempt':((v.indexOf('영세')>=0||v==='0'||v==='0%')?'0':'10'); }
    var rd=norm(doc['세액처리']); if(rd) S.round = (rd.indexOf('반올림')>=0||rd==='round')?'round':'floor';
    S.note=cs(doc['비고']);
    buyer.bizno=fmtBizno(buyer.bizno); S.buyer=buyer;
    S.items=items.length?items:[blankItem()];
    return {items:items.length};
  }
  var cp949Map=null;
  function encodeCp949(str){
    if(!cp949Map){
      var td=new TextDecoder('euc-kr'), m={};
      for(var b=0x81;b<=0xFE;b++) for(var t=0x41;t<=0xFE;t++){ var ch=td.decode(new Uint8Array([b,t])); if(ch.length===1 && ch!=='\uFFFD' && !(ch in m)) m[ch]=[b,t]; }
      cp949Map=m;
    }
    var out=[];
    for(var i=0;i<str.length;i++){
      var c=str.charAt(i), code=str.charCodeAt(i);
      if(code<0x80) out.push(code);
      else if(cp949Map[c]) out.push(cp949Map[c][0],cp949Map[c][1]);
      else return null;
    }
    return new Uint8Array(out);
  }
  $('btnCsvSave').addEventListener('click',function(){
    var name=(safeName(S.buyer.name)||'거래처미지정')+'_'+(safeName(S.docNo)||'번호없음')+'.csv';
    var csvText=buildCsv(), bytes=encodeCp949(csvText.replace(/^\uFEFF/,''));
    // Excel(한글 Windows)은 BOM이 있어도 UTF-8 CSV를 깨뜨리는 경우가 있어 CP949로 저장한다. 표현 불가 문자가 있으면 UTF-8(BOM)로 대체.
    var blob=bytes?new Blob([bytes],{type:'text/csv;charset=euc-kr'}):new Blob([csvText],{type:'text/csv;charset=utf-8'});
    if(!bytes) toast('CP949로 표현할 수 없는 문자가 있어 UTF-8로 저장했습니다 (Excel에서는 데이터 › 텍스트/CSV 가져오기로 열어 주세요)');
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
    if(bytes) toast('CSV로 저장했습니다: '+name);
  });
  $('btnCsvLoad').addEventListener('click',function(){ $('csvIn').click(); });
  $('csvIn').addEventListener('change',function(){
    var f=this.files[0]; this.value=''; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      var text;
      try{ text=new TextDecoder('utf-8',{fatal:true}).decode(rd.result); }
      catch(e){ try{ text=new TextDecoder('euc-kr').decode(rd.result); }catch(e2){ alert('파일 인코딩을 읽을 수 없습니다.'); return; } }
      var rows=parseCsv(text);
      var valid=rows.some(function(r){ return ['문서','거래처','품목'].indexOf(cs(r[0]).replace(/^﻿/,'').trim())>=0; });
      if(!valid){ alert('이 도구에서 저장한 CSV 형식이 아닙니다. (첫 열에 “문서 / 거래처 / 품목” 구분이 있어야 합니다)'); return; }
      var dirty=S.items.some(function(it){ return it.name||it.qty||it.price; }) || S.buyer.name;
      if(dirty && !confirm('현재 작성 중인 내용이 “'+f.name+'”의 내용으로 바뀝니다. 계속할까요?')) return;
      var res=applyCsv(rows);
      syncBindings(); renderItemsPanel(); refresh(); LS.set(KEY_DRAFT,S);
      toast('CSV를 불러왔습니다 — 품목 '+res.items+'행');
    };
    rd.readAsArrayBuffer(f);
  });

  /* ---------------- new doc / print / pdf ---------------- */
  $('btnNew').addEventListener('click',function(){
    var dirty=S.items.some(function(it){ return it.name||it.qty||it.price; }) || S.buyer.name;
    if(dirty && !confirm('작성 중인 내용을 지우고 새 명세표를 시작할까요? (공급자 정보·거래처 목록은 유지됩니다)')) return;
    var seller=S.seller, mode=S.copyMode, vat=S.vat, rd=S.round;
    S=blankDoc(); S.seller=seller; S.copyMode=mode; S.vat=vat; S.round=rd;
    syncBindings(); renderItemsPanel(); refresh(); LS.set(KEY_DRAFT,S);
  });
  $('btnPrint').addEventListener('click',function(){ if(!$('btnPrint').disabled) window.print(); });
  $('btnPdf').addEventListener('click',function(){
    if($('btnPdf').disabled) return;
    if(!window.html2pdf){ alert('PDF 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하거나 “인쇄” 버튼에서 PDF로 저장해 주세요.'); return; }
    var sc=$('sheetScale'), prev=sc.style.zoom; pdfBusy=true; sc.style.zoom=1;
    var name=('거래명세표_'+(S.buyer.name||'거래처')+'_'+(S.date||today())).replace(/[\\\/:*?"<>|\s]+/g,'_')+'.pdf';
    var restore=function(){ pdfBusy=false; sc.style.zoom=prev; fit(); };
    html2pdf().set({
      margin:0, filename:name, image:{type:'jpeg',quality:0.98},
      html2canvas:{scale:2.5,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
    }).from($('a4sheet')).save().then(restore,restore);
  });

  /* ---------------- preview zoom (fit width) + splitter ---------------- */
  var KEY_ZOOM='bct_ts_zoom', KEY_LW='bct_ts_lw', FULL_PX=210*96/25.4;
  var zoomMode=LS.get(KEY_ZOOM,'auto');   // 'auto' (shrink to fit, max 100%) | 'fit' (fill width) | number
  var curZoom=1;
  var pdfBusy=false;
  function fit(){
    if(pdfBusy) return;
    var wrap=$('previewWrap'), avail=wrap.clientWidth-32, f=avail/FULL_PX, z;
    if(zoomMode==='fit') z=f; else if(zoomMode==='auto') z=Math.min(1,f); else z=+zoomMode||1;
    z=Math.min(3,Math.max(0.3,z)); curZoom=z;
    $('sheetScale').style.zoom=z;
    $('zPct').textContent=Math.round(z*100)+'%';
    $('zFit').classList.toggle('on',zoomMode==='fit');
    $('z100').classList.toggle('on',zoomMode!=='fit'&&Math.abs(z-1)<0.005);
  }
  function setZoom(m){ zoomMode=m; LS.set(KEY_ZOOM,m); fit(); }
  $('zFit').addEventListener('click',function(){ setZoom(zoomMode==='fit'?'auto':'fit'); });
  $('z100').addEventListener('click',function(){ setZoom(1); });
  $('zOut').addEventListener('click',function(){ setZoom(Math.max(0.3,Math.round((curZoom-0.1)*100)/100)); });
  $('zIn').addEventListener('click',function(){ setZoom(Math.min(3,Math.round((curZoom+0.1)*100)/100)); });
  window.addEventListener('resize',function(){ applyLW(); fit(); });
  if(window.ResizeObserver) new ResizeObserver(function(){ fit(); }).observe($('previewWrap'));

  var LW_MIN=340, LW_PREV_MIN=320;
  function lwBounds(){ var w=document.documentElement.clientWidth; return [LW_MIN, Math.max(LW_MIN,w-LW_PREV_MIN-8)]; }
  function applyLW(px){
    var lay=document.querySelector('.layout');
    if(px==null) px=LS.get(KEY_LW,null);
    if(px==null){ lay.style.removeProperty('--lw'); return; }
    var b=lwBounds(); px=Math.min(b[1],Math.max(b[0],px));
    lay.style.setProperty('--lw',px+'px');
  }
  (function(){
    var sp=$('splitter'), lay=document.querySelector('.layout'), drag=false;
    sp.addEventListener('pointerdown',function(e){ drag=true; sp.setPointerCapture(e.pointerId); sp.classList.add('drag'); document.body.classList.add('resizing'); e.preventDefault(); });
    sp.addEventListener('pointermove',function(e){ if(!drag) return; applyLW(e.clientX-lay.getBoundingClientRect().left); fit(); });
    function end(e){ if(!drag) return; drag=false; sp.classList.remove('drag'); document.body.classList.remove('resizing');
      var w=$('panel').getBoundingClientRect().width; LS.set(KEY_LW,Math.round(w)); fit(); }
    sp.addEventListener('pointerup',end); sp.addEventListener('pointercancel',end);
    sp.addEventListener('dblclick',function(){ LS.set(KEY_LW,null); applyLW(); fit(); });
    sp.setAttribute('tabindex','0');
    sp.addEventListener('keydown',function(e){
      if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return;
      var w=$('panel').getBoundingClientRect().width+(e.key==='ArrowLeft'?-24:24); applyLW(w); LS.set(KEY_LW,Math.round($('panel').getBoundingClientRect().width)); fit(); e.preventDefault();
    });
  })();

  /* ---------------- boot ---------------- */
  applyLW(); syncBindings(); renderItemsPanel(); updateCustCount(); renderPreview(); fit();
  sbLoad().catch(function(){ toast('서버에 연결하지 못해 저장된 거래처 목록을 사용합니다'); });
  if(!S.seller.bizno) $('sellerFold').open=true;
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ renderPreview(); });
  window.__bctTs={ get state(){ return S; }, get customers(){ return customers; }, rerender:function(){ syncBindings(); renderItemsPanel(); renderPreview(); } };
})();
</script>
</body>
</html>
