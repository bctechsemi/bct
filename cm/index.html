<style>
  /* Layout: access gate (centered panel) → working view = slim top bar with model / view switches over a full-height frame */
  /* single dark look on every viewer theme */
  :root{
    --bg:#0B1424; --panel:#13203A; --ink:#E6EDF8; --muted:#9AAAC6; --line:#24365A;
    --brand:#6E93D1; --brand-deep:#1F4E9C; --accent:#E0A54A; --on-brand:#FFFFFF; --error:#E2766E; --stage:#060D18;
    --font:'Google Sans', 'Gowun Batang', -apple-system, BlinkMacSystemFont, sans-serif;
    --logo-light: none; --logo-dark: block;
    color-scheme: dark;
  }
  [hidden]{ display:none !important; }
  html, body{ height:100%; margin:0; }
  body{ background:var(--bg); color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased; }
  .logo-l{ display:var(--logo-light); }
  .logo-d{ display:var(--logo-dark); }
  button, input{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- access gate ---------- */
  .gate{ min-height:100%; display:grid; place-items:center; padding-block:32px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  .gate-card{ width:min(420px, 100%); background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:32px 30px 28px; display:flex; flex-direction:column; gap:18px; }
  .gate-card img{ height:46px; width:auto; align-self:flex-start; }
  .eyebrow{ font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0; }
  .gate-card h1{ margin:0; font-size:26px; line-height:1.25; font-weight:700; text-wrap:balance; }
  .gate-card p{ margin:0; font-size:14.5px; line-height:1.6; color:var(--muted); }
  .field{ display:flex; flex-direction:column; gap:8px; }
  .field label{ font-size:13px; font-weight:700; color:var(--ink); }
  .row{ display:flex; gap:10px; }
  .row input{ flex:1; min-width:0; font-size:17px; letter-spacing:.08em; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); }
  .row input:focus{ outline:none; border-color:var(--brand); }
  .row button{ padding:0 20px; border:none; border-radius:10px; background:var(--brand-deep); color:var(--on-brand); font-size:15px; font-weight:700; cursor:pointer; }
  .row button:hover{ background:var(--brand); }
  .msg{ min-height:20px; font-size:13.5px; color:var(--error); }
  .foot{ font-size:12px; color:var(--muted); letter-spacing:.04em; border-top:1px solid var(--line); padding-top:14px; }

  /* ---------- working view ---------- */
  .app{ height:100%; display:flex; flex-direction:column; }
  .bar{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; padding-block:10px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); background:var(--panel); border-bottom:1px solid var(--line); }
  .bar img{ height:30px; width:auto; }
  .bar .name{ display:flex; flex-direction:column; min-width:0; margin-right:auto; }
  .bar .name b{ font-size:15px; font-weight:700; }
  .bar .name span{ font-size:11.5px; letter-spacing:.06em; color:var(--muted); }
  .seg{ display:inline-flex; padding:3px; border-radius:999px; background:var(--bg); border:1px solid var(--line); gap:3px; }
  .seg button{ border:none; cursor:pointer; padding:7px 15px; border-radius:999px; background:transparent; font-size:13.5px; font-weight:700; color:var(--muted); white-space:nowrap; }
  .seg button[aria-pressed="true"]{ background:var(--brand-deep); color:var(--on-brand); }
  .lock{ border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:999px; padding:7px 13px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .lock:hover{ color:var(--ink); border-color:var(--brand); }
  .stage{ flex:1; min-height:0; background:var(--stage); }
  .stage iframe{ display:block; width:100%; height:100%; border:0; }
  @media (max-width:720px){ .bar .name span{ display:none; } .seg button{ padding:7px 11px; } }
  @media (max-width:560px){ .bar .name{ display:none; } .bar img{ height:26px; } .seg button{ padding:6px 10px; font-size:12.5px; } }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>

<script>
(function(){
  var CODE_SHA256 = '3cc14e5c15b91cc22b1fece291c79b3404d9d5aff2a20a487272dcab3af204b3';
  var FILES = {
    heater:     { pricing: 'cm_pricing_L3_PRIME_M2_heater.html', ct: 'L3_PRIME_M2_Heater_CT_Diagram.html' },
    controller: { pricing: 'cm_pricing_L3_PRIME_controller.html', ct: 'L3_PRIME_Controller_CT_Diagram.html' }
  };
  var state = { model: 'heater', view: 'pricing' };
  var gate = document.getElementById('gate'), app = document.getElementById('app'), frame = document.getElementById('frame');
  var store = {
    get: function(k){ try { return sessionStorage.getItem(k); } catch (e) { return null; } },
    set: function(k, v){ try { sessionStorage.setItem(k, v); } catch (e) {} },
    del: function(k){ try { sessionStorage.removeItem(k); } catch (e) {} }
  };

  function sha256(text){
    if (!(window.crypto && crypto.subtle)) return Promise.resolve('');
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0' + b.toString(16)).slice(-2); }).join('');
    });
  }
  function pressed(attr, val){
    document.querySelectorAll('[data-' + attr + ']').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-' + attr) === val)); });
  }
  function load(){
    pressed('model', state.model); pressed('view', state.view);
    frame.src = FILES[state.model][state.view];
    store.set('cmp.model', state.model); store.set('cmp.view', state.view);
  }
  function open(){
    gate.hidden = true; app.hidden = false;
    var h = (location.hash || '').replace('#', '');
    if (FILES[h]) { state.model = h; state.view = 'pricing'; }
    else {
      var m = store.get('cmp.model'), v = store.get('cmp.view');
      if (FILES[m]) state.model = m;
      if (v === 'pricing' || v === 'ct') state.view = v;
    }
    load();
  }
  document.getElementById('gateForm').addEventListener('submit', function(e){
    e.preventDefault();
    var input = document.getElementById('code'), msg = document.getElementById('msg');
    sha256(input.value.trim()).then(function(h){
      if (h === CODE_SHA256) { msg.textContent = ''; store.set('cmp.ok', '1'); open(); }
      else { msg.textContent = 'Access Code가 맞지 않습니다. 다시 입력해 주세요.'; input.select(); }
    });
  });
  document.querySelectorAll('[data-model]').forEach(function(b){
    b.addEventListener('click', function(){ state.model = b.getAttribute('data-model'); state.view = 'pricing'; load(); });
  });
  document.querySelectorAll('[data-view]').forEach(function(b){
    b.addEventListener('click', function(){ state.view = b.getAttribute('data-view'); load(); });
  });
  document.getElementById('lockBtn').addEventListener('click', function(){
    store.del('cmp.ok'); frame.removeAttribute('src'); app.hidden = true; gate.hidden = false;
    var input = document.getElementById('code'); input.value = ''; input.focus();
  });
  // keep the switches in step when the viewer follows the in-deck CT Diagram link or the CT page's back link
  frame.addEventListener('load', function(){
    try {
      var p = frame.contentWindow.location.pathname.split('/').pop();
      Object.keys(FILES).forEach(function(m){ ['pricing', 'ct'].forEach(function(v){ if (FILES[m][v] === p) { state.model = m; state.view = v; } }); });
      pressed('model', state.model); pressed('view', state.view);
    } catch (e) {}
  });
  if (store.get('cmp.ok') === '1') open();
  else document.getElementById('code').focus();
})();
</script>
