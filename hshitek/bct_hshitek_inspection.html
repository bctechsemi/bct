<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>검사성적서 작성 · BCT × HS HiTek</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/bctechsemi/bct/refs/heads/main/images/bct_favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
(function(){
  var d = document.documentElement;
  try{
    d.setAttribute('data-theme', localStorage.getItem('bct_hub_theme') === 'dark' ? 'dark' : 'light');
    d.lang = localStorage.getItem('bct_hshitek_lang') === 'en' ? 'en' : 'ko';
  }catch(e){}
})();
</script>
<style>
  @font-face{ font-family:'KIMM'; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2212@1.0/KIMM_Light.woff2') format('woff2'); font-weight:300; font-display:swap; }
  @font-face{ font-family:'KIMM'; src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2212@1.0/KIMM_Bold.woff2') format('woff2'); font-weight:700; font-display:swap; }

  /* ===== Tokens : same as OPS Hub index.html ===== */
  :root{
    --primary:#024ad8; --primary-pressed:#0e3191; --primary-soft:#c9e0fc; --on-primary:#ffffff;
    --ink:#1a1a1a; --charcoal:#3d3d3d; --graphite:#636363;
    --canvas:#ffffff; --paper:#ffffff; --cloud:#f7f7f7; --fog:#e8e8e8; --steel:#c2c2c2;
    --hairline:#e8e8e8; --hairline-strong:#c2c2c2;
    --slab:#1a1a1a; --slab-2:#292929; --on-slab:#ffffff; --on-slab-muted:#c2c2c2; --slab-accent:#296ef9;
    --ok:#1f7a4d; --ok-soft:#dcefe4; --ng:#c1443c; --ng-soft:#f8e1df;
    --lift:0 2px 8px rgba(26,26,26,.08);
    --float:0 8px 24px rgba(26,26,26,.12);
    --font-head:'KIMM', 'Google Sans', 'Gowun Batang', sans-serif;
    --font-en:'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-ko:'Google Sans', 'Gowun Batang', serif;
    --font-mono:'JetBrains Mono', 'Gowun Batang', ui-monospace, monospace;
    --font-text:var(--font-en);
    --r-xs:2px; --r-sm:3px; --r-md:4px; --r-lg:8px; --r-xl:16px; --r-pill:9999px;
  }
  :root[lang="ko"]{ --font-text:var(--font-ko); }
  :root[data-theme="dark"]{
    --primary:#296ef9; --primary-pressed:#5b8ffb; --primary-soft:#1b2f57; --on-primary:#ffffff;
    --ink:#f2f2f2; --charcoal:#cfcfcf; --graphite:#a3a3a3;
    --canvas:#111111; --paper:#1b1b1b; --cloud:#161616; --fog:#262626; --steel:#4a4a4a;
    --hairline:#2a2a2a; --hairline-strong:#444444;
    --slab:#000000; --slab-2:#1b1b1b;
    --ok:#5cc28d; --ok-soft:#173326; --ng:#f08178; --ng-soft:#3a1d1b;
    --lift:0 2px 8px rgba(0,0,0,.5);
    --float:0 8px 24px rgba(0,0,0,.6);
    color-scheme:dark;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--canvas); color:var(--ink); font-family:var(--font-text); font-size:16px; line-height:1.4; -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column; }
  :root[lang="ko"] p, :root[lang="ko"] h1, :root[lang="ko"] h2, :root[lang="ko"] h3{ word-break:keep-all; }
  button, input, select, textarea{ font:inherit; color:inherit; }
  a{ color:inherit; }
  ::selection{ background:var(--primary-soft); color:var(--ink); }
  :focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }
  .mono{ font-family:var(--font-mono) !important; }
  .wrap{ max-width:1600px; margin:0 auto; width:100%; padding:0 clamp(16px,3vw,40px); }

  /* utility + nav (Hub) */
  .utility{ background:var(--slab); color:var(--on-slab); font-size:14px; }
  .utility .wrap{ height:36px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .utility .u-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .utility .u-left span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .u-dot{ width:6px; height:6px; border-radius:50%; background:var(--slab-accent); flex:0 0 auto; }
  .u-right{ font-family:var(--font-mono); font-size:12px; color:var(--on-slab-muted); white-space:nowrap; display:flex; gap:14px; align-items:center; }
  .u-right a{ color:var(--on-slab-muted); text-decoration:none; }
  .u-right a:hover{ color:var(--on-slab); }
  .nav{ background:var(--canvas); border-bottom:1px solid var(--hairline); position:sticky; top:0; z-index:20; }
  .nav .wrap{ height:64px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .nav-brand{ display:flex; align-items:center; gap:14px; text-decoration:none; flex:0 0 auto; }
  .nav-brand img{ height:34px; width:auto; display:block; }
  :root[data-theme="dark"] .nav-brand img{ filter:brightness(0) invert(1); }
  .nav-brand .x{ font-size:14px; color:var(--graphite); }
  .nav-brand .cust{ font-family:var(--font-en); font-size:16px; font-weight:600; }
  .nav-links{ display:flex; align-items:center; gap:4px; }
  .nav-link{ position:relative; padding:8px 16px; font-size:16px; height:64px; display:flex; align-items:center; background:none; border:none; cursor:pointer; color:var(--ink); }
  .nav-link::after{ content:''; position:absolute; left:16px; right:16px; bottom:0; height:2px; background:transparent; }
  .nav-link:hover::after, .nav-link.active::after{ background:var(--primary); }
  .nav-right{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  .icon-btn{ width:40px; height:40px; border-radius:var(--r-md); border:1px solid var(--hairline-strong); background:var(--canvas); color:var(--ink); display:grid; place-items:center; cursor:pointer; padding:0; }
  .icon-btn:hover{ border-color:var(--ink); }
  .icon-btn svg{ width:18px; height:18px; }
  .icon-btn .i-sun{ display:none; }
  :root[data-theme="dark"] .icon-btn .i-sun{ display:block; }
  :root[data-theme="dark"] .icon-btn .i-moon{ display:none; }
  .lang-toggle{ display:flex; border:1px solid var(--hairline-strong); border-radius:var(--r-md); overflow:hidden; height:40px; }
  .lang-btn{ font-family:var(--font-en) !important; font-size:12.6px; font-weight:700; letter-spacing:.126px; padding:0 14px; border:none; background:var(--canvas); color:var(--graphite); cursor:pointer; }
  .lang-btn + .lang-btn{ border-left:1px solid var(--hairline-strong); }
  .lang-btn.active{ background:var(--ink); color:var(--canvas); }
  @media (max-width:1023px){ .nav-links{ display:none; } }

  /* buttons (Hub) */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 18px; border-radius:var(--r-md); font-family:var(--font-en) !important; font-size:13px; font-weight:600; letter-spacing:.7px; text-transform:uppercase; text-decoration:none; cursor:pointer; border:1px solid transparent; white-space:nowrap; transition:background .15s, color .15s, border-color .15s; background:none; }
  :root[lang="ko"] .btn{ font-family:var(--font-ko) !important; letter-spacing:.2px; }
  .btn-primary{ background:var(--primary); color:var(--on-primary); }
  .btn-primary:hover{ background:var(--primary-pressed); }
  .btn-outline{ color:var(--ink); border-color:var(--ink); }
  .btn-outline:hover{ background:var(--ink); color:var(--canvas); }
  .btn-ghost{ color:var(--ink); border-color:var(--hairline-strong); }
  .btn-ghost:hover{ border-color:var(--ink); }
  .btn-danger{ color:var(--ng); border-color:var(--ng); }
  .btn-danger:hover{ background:var(--ng); color:#fff; }
  .btn:disabled, .btn[aria-disabled="true"]{ background:var(--fog); color:var(--graphite); border-color:var(--fog); cursor:not-allowed; }
  .btn-sm{ height:32px; padding:0 12px; font-size:12px; }

  /* status / judge pills */
  .status{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-en); font-size:12px; font-weight:700; letter-spacing:.1px; border-radius:var(--r-sm); padding:4px 8px; line-height:1; text-transform:uppercase; white-space:nowrap; }
  :root[lang="ko"] .status{ font-family:var(--font-ko); }
  .status::before{ content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .st-draft{ background:var(--fog); color:var(--charcoal); }
  .st-submitted{ background:var(--primary-soft); color:var(--primary); }
  :root[data-theme="dark"] .st-submitted{ color:#cfe0ff; }
  .st-approved, .j-pass{ background:var(--ok-soft); color:var(--ok); }
  .j-fail{ background:var(--ng-soft); color:var(--ng); }
  .j-na{ background:var(--fog); color:var(--charcoal); }
  .j-open{ background:transparent; color:var(--graphite); border:1px dashed var(--hairline-strong); }
  .j-open::before{ display:none; }

  /* page head */
  main{ flex:1; }
  .page-head{ padding:40px 0 24px; display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .page-head h1{ font-family:var(--font-head); font-weight:700; font-size:clamp(30px,3.4vw,42px); line-height:1.05; letter-spacing:-0.015em; margin:0; }
  .page-head p{ margin:10px 0 0; color:var(--charcoal); max-width:60ch; }
  .eyebrow{ font-family:var(--font-mono); font-size:12px; font-weight:600; letter-spacing:.12em; color:var(--graphite); margin-bottom:10px; text-transform:uppercase; }

  /* list */
  .band{ background:var(--cloud); padding:32px 0 64px; min-height:60vh; }
  .toolbar{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .tabs{ display:flex; gap:8px; flex-wrap:wrap; }
  .tab{ border:1px solid var(--hairline-strong); background:var(--paper); color:var(--ink); border-radius:var(--r-pill); padding:7px 18px; font-size:15px; font-weight:500; cursor:pointer; }
  .tab:hover{ border-color:var(--ink); }
  .tab.active{ background:var(--ink); color:var(--canvas); border-color:var(--ink); }
  .tab .n{ font-family:var(--font-mono); font-size:12px; margin-left:6px; opacity:.75; }
  .search{ height:40px; border:1px solid var(--hairline-strong); background:var(--paper); border-radius:var(--r-md); padding:0 14px; min-width:260px; }
  .card{ background:var(--paper); border-radius:var(--r-xl); box-shadow:var(--lift); }
  .tbl-wrap{ overflow-x:auto; }
  table.list{ width:100%; border-collapse:collapse; font-size:15px; }
  table.list th{ text-align:left; font-weight:500; font-size:13px; color:var(--graphite); padding:14px 16px; border-bottom:1px solid var(--hairline-strong); white-space:nowrap; }
  table.list td{ padding:14px 16px; border-bottom:1px solid var(--hairline); white-space:nowrap; }
  table.list tbody tr{ cursor:pointer; }
  table.list tbody tr:hover td{ background:var(--cloud); }
  table.list tbody tr:last-child td{ border-bottom:none; }
  .empty{ padding:56px 24px; text-align:center; color:var(--charcoal); }
  .empty b{ display:block; font-size:20px; font-weight:500; color:var(--ink); margin-bottom:8px; }

  /* login */
  .login{ display:grid; place-items:center; padding:72px 16px; background:var(--cloud); min-height:calc(100vh - 100px); }
  .login .card{ width:100%; max-width:420px; padding:40px 36px; }
  .login h1{ font-family:var(--font-head); font-size:30px; margin:0 0 8px; }
  .login p{ color:var(--charcoal); margin:0 0 24px; font-size:15px; }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:14px; min-width:0; }
  .field label{ font-size:13px; color:var(--graphite); }
  .field input, .field select, .field textarea{ height:42px; border:1px solid var(--hairline-strong); border-radius:var(--r-md); padding:0 12px; background:var(--paper); width:100%; }
  .field textarea{ height:auto; min-height:72px; padding:10px 12px; resize:vertical; }
  .field input:focus, .field textarea:focus{ border-color:var(--primary); outline:none; }
  .field input[readonly], .field textarea[readonly]{ background:var(--cloud); color:var(--charcoal); }
  .err{ color:var(--ng); font-size:14px; min-height:20px; margin:4px 0 8px; }

  /* editor */
  .ed{ display:grid; grid-template-columns:minmax(440px, 560px) 1fr; min-height:calc(100vh - 100px); }
  @media (max-width:1100px){ .ed{ grid-template-columns:1fr; } }
  .ed-form{ border-right:1px solid var(--hairline); background:var(--canvas); padding:24px clamp(16px,2vw,28px) 80px; }
  .ed-preview{ background:var(--cloud); padding:24px; overflow:auto; display:flex; flex-direction:column; align-items:center; }
  .ed-bar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  .ed-bar .back{ display:inline-flex; align-items:center; gap:6px; background:none; border:none; cursor:pointer; color:var(--charcoal); font-size:15px; padding:0; }
  .ed-bar .back:hover{ color:var(--ink); }
  .ed-title{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  .ed-title h2{ font-family:var(--font-head); font-size:28px; margin:0; letter-spacing:-.01em; }
  .ed-meta{ font-family:var(--font-mono); font-size:12px; color:var(--graphite); margin-bottom:20px; }
  .sec{ border-top:1px solid var(--hairline); padding:22px 0 8px; }
  .sec-h{ display:flex; align-items:baseline; gap:12px; margin-bottom:16px; }
  .sec-h .n{ font-family:var(--font-mono); font-size:12px; font-weight:600; letter-spacing:.12em; color:var(--primary); }
  .sec-h .t{ font-size:19px; font-weight:500; }
  .sec-h .s{ margin-left:auto; font-size:13px; color:var(--graphite); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .notice{ background:var(--cloud); border:1px solid var(--hairline); border-radius:var(--r-lg); padding:12px 14px; font-size:14px; color:var(--charcoal); margin-bottom:14px; display:flex; gap:10px; align-items:flex-start; }
  .notice .pill{ flex:0 0 auto; }

  .drop{ border:1.5px dashed var(--hairline-strong); border-radius:var(--r-xl); padding:18px; display:flex; align-items:center; gap:16px; margin-bottom:18px; background:var(--cloud); transition:border-color .15s, background .15s; }
  .drop.over{ border-color:var(--primary); background:var(--primary-soft); }
  .drop svg{ width:34px; height:34px; flex:0 0 auto; stroke:var(--ink); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .drop svg .ac{ stroke:var(--primary); }
  .drop .dt{ font-weight:500; }
  .drop .dd{ font-size:13px; color:var(--graphite); margin-top:2px; }
  .drop .btns{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .progress{ font-family:var(--font-mono); font-size:12px; color:var(--primary); margin:-8px 0 14px; min-height:16px; }

  .it{ border:1px solid var(--hairline); border-radius:var(--r-xl); padding:16px; margin-bottom:12px; background:var(--paper); }
  .it.fail{ border-color:var(--ng); }
  .it-head{ display:flex; gap:12px; align-items:flex-start; }
  .it-no{ font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--graphite); padding-top:3px; min-width:20px; }
  .it-name{ font-weight:500; line-height:1.3; }
  .it-crit{ font-size:13px; color:var(--charcoal); margin-top:4px; }
  .it-head .status{ margin-left:auto; }
  .photos{ display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 12px 32px; }
  .tile{ position:relative; width:96px; height:72px; border-radius:var(--r-lg); border:1px dashed var(--hairline-strong); background:var(--cloud); display:grid; place-items:center; overflow:hidden; cursor:pointer; font-family:var(--font-mono); font-size:11px; color:var(--graphite); text-align:center; line-height:1.3; }
  .tile.has{ border-style:solid; border-color:var(--hairline); cursor:zoom-in; }
  .tile img{ width:100%; height:100%; object-fit:cover; display:block; }
  .tile .tn{ position:absolute; left:4px; top:4px; background:rgba(26,26,26,.82); color:#fff; border-radius:var(--r-xs); padding:1px 5px; font-size:10px; }
  .tile .rm{ position:absolute; right:3px; top:3px; width:20px; height:20px; border-radius:50%; border:none; background:rgba(26,26,26,.82); color:#fff; cursor:pointer; font-size:13px; line-height:20px; padding:0; display:none; }
  .tile.has:hover .rm{ display:block; }
  .tile input{ display:none; }
  .tile.locked{ cursor:default; }
  .it-foot{ display:flex; gap:10px; align-items:center; margin-left:32px; flex-wrap:wrap; }
  .seg{ display:inline-flex; border:1px solid var(--hairline-strong); border-radius:var(--r-md); overflow:hidden; }
  .seg button{ border:none; background:var(--paper); padding:0 16px; height:34px; font-family:var(--font-en); font-weight:700; font-size:12.6px; letter-spacing:.2px; cursor:pointer; color:var(--charcoal); }
  .seg button + button{ border-left:1px solid var(--hairline-strong); }
  .seg button.on-ok{ background:var(--ok); color:#fff; }
  .seg button.on-ng{ background:var(--ng); color:#fff; }
  .seg button.on-na{ background:var(--ink); color:var(--canvas); }
  .seg button:disabled{ cursor:not-allowed; }
  .it-foot input{ flex:1; min-width:140px; height:34px; border:1px solid var(--hairline); border-radius:var(--r-md); padding:0 10px; background:var(--paper); font-size:14px; }

  .sign-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:560px){ .sign-grid, .grid2{ grid-template-columns:1fr; } }
  .sign-box{ border:1px solid var(--hairline); border-radius:var(--r-xl); padding:14px; background:var(--paper); }
  .sign-box h4{ margin:0 0 10px; font-size:15px; font-weight:500; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .pad{ width:100%; height:120px; border:1px solid var(--hairline-strong); border-radius:var(--r-lg); background:#fff; touch-action:none; cursor:crosshair; display:block; }
  .sign-img{ width:100%; height:120px; border:1px solid var(--hairline); border-radius:var(--r-lg); background:#fff; object-fit:contain; display:block; }
  .sign-box .sm{ font-size:12px; color:var(--graphite); margin-top:8px; font-family:var(--font-mono); }
  .sign-box .act{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .sign-wait{ height:120px; border:1px dashed var(--hairline-strong); border-radius:var(--r-lg); display:grid; place-items:center; color:var(--graphite); font-size:14px; text-align:center; padding:8px; }
  .actions-bottom{ display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; }

  /* spec + share */
  table.spec{ width:100%; border-collapse:collapse; font-size:14px; }
  table.spec th{ text-align:left; font-size:13px; font-weight:500; color:var(--graphite); padding:12px; border-bottom:1px solid var(--hairline-strong); }
  table.spec td{ padding:10px 12px; border-bottom:1px solid var(--hairline); vertical-align:top; }
  table.spec input, table.spec textarea{ width:100%; border:1px solid var(--hairline); border-radius:var(--r-md); background:var(--paper); padding:6px 8px; font-size:14px; }
  table.spec textarea{ min-height:54px; resize:vertical; }
  .code-out{ font-family:var(--font-mono); font-size:28px; font-weight:600; letter-spacing:.08em; background:var(--cloud); border-radius:var(--r-lg); padding:18px 20px; margin:12px 0; word-break:break-all; }

  /* lightbox + toast */
  .lb{ position:fixed; inset:0; background:rgba(0,0,0,.86); z-index:80; display:none; align-items:center; justify-content:center; padding:32px; cursor:zoom-out; }
  .lb.open{ display:flex; }
  .lb img{ max-width:100%; max-height:100%; object-fit:contain; border-radius:var(--r-md); }
  .lb .cap{ position:absolute; left:0; right:0; bottom:14px; text-align:center; color:#fff; font-size:14px; }
  .toast{ position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--canvas); padding:12px 18px; border-radius:var(--r-lg); font-size:15px; box-shadow:var(--float); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:90; max-width:min(560px, 92vw); }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.bad{ background:var(--ng); color:#fff; }
  .busy{ position:fixed; inset:0; z-index:70; cursor:progress; display:none; }
  .busy.on{ display:block; }

  /*SHEET_CSS_START*/
  /* ===== A4 sheet (always light paper; print text is ink, never light gray) ===== */
  .sheet{ width:210mm; height:297mm; background:#fff; color:#1a1a1a; position:relative; padding:13mm 14mm 10mm; margin:0 0 24px; box-shadow:0 8px 24px rgba(26,26,26,.14); display:flex; flex-direction:column; overflow:hidden; font-family:'Google Sans','Gowun Batang',sans-serif; font-size:10px; line-height:1.35; }
  .sheet *{ color:inherit; }
  .sh-top{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding-bottom:9px; border-bottom:2px solid #1a1a1a; }
  .sh-logo{ height:24px; width:auto; display:block; margin-bottom:8px; }
  .sh-title{ font-family:'KIMM','Google Sans',sans-serif; font-weight:700; font-size:23px; letter-spacing:-.01em; line-height:1.1; }

   Supabase (fetch only — no SDK)
   ===================================================================== */
function loadSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ return null; } }
function saveSession(s){ try{ if(s) localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else localStorage.removeItem(SESSION_KEY); }catch(e){} }
async function authToken(body, grant){
  var r = await fetch(AUTH + '/token?grant_type=' + grant, { method:'POST', headers:{ apikey:CONFIG.SUPABASE_ANON_KEY, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
  var d = await r.json().catch(function(){ return {}; });
  if(!r.ok) throw new Error(d.error_description || d.msg || d.message || 'Sign-in failed');
  return { access_token:d.access_token, refresh_token:d.refresh_token, expires_at:Math.floor(Date.now()/1000) + (d.expires_in || 3600), user:d.user };
}
async function ensureFresh(){
  if(!S.session) throw new Error(t('e_session'));
  if(S.session.expires_at - 90 > Date.now()/1000) return;
  try{ S.session = await authToken({ refresh_token:S.session.refresh_token }, 'refresh_token'); saveSession(S.session); }
  catch(e){ S.session = null; saveSession(null); S.view = 'login'; render(); throw new Error(t('e_session')); }
}
function hdr(extra){
  var h = { apikey:CONFIG.SUPABASE_ANON_KEY, Authorization:'Bearer ' + (S.session ? S.session.access_token : CONFIG.SUPABASE_ANON_KEY) };
  for(var k in (extra || {})) h[k] = extra[k];
  return h;
}
function niceErr(m){
  m = String(m || '');
  if(/Photo evidence/i.test(m)) return t('e_photo');
  if(/must be judged/i.test(m)) return t('e_judge');
  if(/Inspector signature/i.test(m)) return t('e_isign');
  if(/Approver signature/i.test(m)) return t('e_asign');
  if(/Only an admin can approve/i.test(m)) return t('e_admin');
  if(/locked|cannot be edited/i.test(m)) return t('e_locked');
  return m;
}
async function rest(path, opt){
  opt = opt || {};
  await ensureFresh();
  var h = hdr({ 'Content-Type':'application/json' });
  if(opt.prefer) h.Prefer = opt.prefer;
  var r = await fetch(REST + path, { method:opt.method || 'GET', headers:h, body:opt.body !== undefined ? JSON.stringify(opt.body) : undefined });
  var txt = await r.text(); var d = null;
  try{ d = txt ? JSON.parse(txt) : null; }catch(e){ d = txt; }
  if(!r.ok) throw new Error(niceErr((d && (d.message || d.error_description || d.msg)) || ('HTTP ' + r.status)));
  return d;
}

/* ===== storage ===== */
async function signPaths(paths){
  paths = paths.filter(function(p){ return p && !S.urls[p]; });
  if(!paths.length) return;
  await ensureFresh();
  for(var i = 0; i < paths.length; i += 100){
    var r = await fetch(STORE + '/object/sign/' + BUCKET, { method:'POST', headers:hdr({ 'Content-Type':'application/json' }), body:JSON.stringify({ expiresIn:3600, paths:paths.slice(i, i + 100) }) });
    if(!r.ok) continue;
    var d = await r.json();
    d.forEach(function(x){ if(x.signedURL && x.path) S.urls[x.path] = STORE + x.signedURL; });
  }
}
async function resizeImage(file){
  var bmp = await createImageBitmap(file, { imageOrientation:'from-image' });
  var M = 1600, s = Math.min(1, M / Math.max(bmp.width, bmp.height));
  var c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  if(bmp.close) bmp.close();
  return await new Promise(function(res){ c.toBlob(res, 'image/jpeg', 0.82); });
}
async function uploadBlob(path, blob){
  await ensureFresh();
  var r = await fetch(STORE + '/object/' + BUCKET + '/' + path, { method:'POST', headers:hdr({ 'Content-Type':'image/jpeg', 'x-upsert':'true' }), body:blob });
  if(!r.ok){ var d = await r.json().catch(function(){ return {}; }); throw new Error(d.message || d.error || ('Upload failed ' + r.status)); }
}
async function removePaths(paths){
  if(!paths.length) return;
  try{
    await ensureFresh();
    await fetch(STORE + '/object/' + BUCKET, { method:'DELETE', headers:hdr({ 'Content-Type':'application/json' }), body:JSON.stringify({ prefixes:paths }) });
  }catch(e){}
}

/* =====================================================================
   Judgement (mirrors the DB trigger; the DB result is what gets stored)
   ===================================================================== */
function judgeItem(it){
  var v = String(it.value == null ? '' : it.value).trim();
  if(it.kind === 'numeric'){
    if(!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(v)) return null;
    var n = parseFloat(v);
    if((it.lsl == null || n >= +it.lsl) && (it.usl == null || n <= +it.usl)) return 'PASS';
    return 'FAIL';
  }
  var u = v.toUpperCase();
  return u === 'OK' ? 'PASS' : u === 'NG' ? 'FAIL' : u === 'NA' ? 'NA' : null;
}
function overallOf(items){
  var fail = false, open = false;
  (items || []).forEach(function(it){ var j = judgeItem(it); if(j === 'FAIL') fail = true; if(j == null) open = true; });
  if(fail) return 'FAIL';
  if(open || !(items || []).length) return null;
  return 'PASS';
}
function photoGap(it){ return judgeItem(it) !== 'NA' && (it.photos || []).length < (it.photo_nos || []).length; }
function judgeClass(j){ return j === 'PASS' ? 'pass' : j === 'FAIL' ? 'fail' : j === 'NA' ? 'na' : 'open'; }
function judgeText(j){ return j === 'PASS' ? 'PASS' : j === 'FAIL' ? 'FAIL' : j === 'NA' ? 'N/A' : '—'; }
function judgePill(j){
  var cls = j === 'PASS' ? 'j-pass' : j === 'FAIL' ? 'j-fail' : j === 'NA' ? 'j-na' : 'j-open';
  var txt = j === 'PASS' ? t('pass') : j === 'FAIL' ? t('fail') : j === 'NA' ? t('na') : t('open');
  return '<span class="status ' + cls + '">' + esc(txt) + '</span>';
}
function statusPill(s){ return '<span class="status st-' + s + '">' + esc(t(s)) + '</span>'; }

/* ===== dates ===== */
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function today(){ var d = new Date(Date.now() + 9 * 3600e3); return d.toISOString().slice(0, 10); }
function fmtDate(s){ return s ? String(s).slice(0, 10) : '—'; }
function fmtDT(s){
  if(!s) return '—';
  var d = new Date(new Date(s).getTime() + 9 * 3600e3);
  return d.toISOString().slice(0, 10) + ' ' + pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes());
}

  busy(true);

  S.dirty = false;
  if(location.hash !== hash) history.replaceState(null, '', hash);
  var m = hash.match(/^#r\/(.+)$/);
  if(hash === '#new') return openNew();
  if(m) return openReport(m[1]);
  if(hash === '#spec'){ S.view = 'spec'; render(); return loadSpec(true); }
  if(hash === '#share'){ S.view = 'share'; S.newCode = null; render(); return loadAccess(); }
  S.view = 'list'; render(); loadList();
}

/* ===== signature pad ===== */
function initPad(id){
  var c = document.getElementById(id); if(!c) return;
  var dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  var ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1a1a1a'; ctx.fillStyle = '#1a1a1a';
  c.dataset.empty = '1';
  var down = false, last = null;
  function pt(e){ var r = c.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }
  c.addEventListener('pointerdown', function(e){ down = true; c.setPointerCapture(e.pointerId); last = pt(e); ctx.beginPath(); ctx.arc(last.x, last.y, 1.1, 0, 7); ctx.fill(); c.dataset.empty = '0'; });
  c.addEventListener('pointermove', function(e){ if(!down) return; var p = pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ c.addEventListener(ev, function(){ down = false; }); });
}
function clearPad(id){ var c = document.getElementById(id); if(!c) return; c.getContext('2d').clearRect(0, 0, c.width, c.height); c.dataset.empty = '1'; }
function padData(id){ var c = document.getElementById(id); return c && c.dataset.empty === '0' ? c.toDataURL('image/png') : null; }

/* ===== photos ===== */
function bindDrop(){
  var d = document.getElementById('drop'); if(!d) return;
  d.addEventListener('dragover', function(e){ e.preventDefault(); d.classList.add('over'); });
  d.addEventListener('dragleave', function(){ d.classList.remove('over'); });
  d.addEventListener('drop', async function(e){
    e.preventDefault(); d.classList.remove('over');
    var got = await filesFromDrop(e.dataTransfer);
    await ingest(got.files, got.folder);
  });
}
function fileOf(en){ return new Promise(function(res, rej){ en.file(res, rej); }); }
async function walkDir(dir, out){
  var rd = dir.createReader(), batch;
  do{
    batch = await new Promise(function(res, rej){ rd.readEntries(res, rej); });
    for(var i = 0; i < batch.length; i++){ if(batch[i].isFile) out.push(await fileOf(batch[i])); }
  }while(batch.length);
}
async function filesFromDrop(dt){
  var entries = [];
  for(var i = 0; i < dt.items.length; i++){ var en = dt.items[i].webkitGetAsEntry && dt.items[i].webkitGetAsEntry(); if(en) entries.push(en); }
  if(!entries.length) return { files:Array.prototype.slice.call(dt.files), folder:null };
  var out = [], folder = null;
  for(var k = 0; k < entries.length; k++){
    if(entries[k].isDirectory){ folder = folder || entries[k].name; await walkDir(entries[k], out); }
    else out.push(await fileOf(entries[k]));
  }
  return { files:out, folder:folder };
}
function onPick(input){
  var files = Array.prototype.slice.call(input.files || []);
  var folder = files.length && files[0].webkitRelativePath ? files[0].webkitRelativePath.split('/')[0] : null;
  input.value = '';
  ingest(files, folder);
}
async function ingest(files, folder){
  if(!editable()) return;
  if(folder){
    if(!S.cur.serial_no){ S.cur.serial_no = folder.trim(); var f = document.getElementById('fSn'); if(f) f.value = S.cur.serial_no; markDirty(); }
    else if(S.cur.serial_no !== folder.trim()){ toast(t('snMismatch') + folder + ' ≠ ' + S.cur.serial_no, true); }
  }
  var jobs = [], skipped = [];
  files.forEach(function(f){
    if(!/^image\//.test(f.type) && !/\.(jpe?g|png|webp|heic)$/i.test(f.name)) return;
    var m = f.name.match(/^(\d+)_/);
    if(!m){ skipped.push(f.name); return; }
    var no = parseInt(m[1], 10);
    var idx = -1;
    S.cur.items.forEach(function(it, i){ if((it.photo_nos || []).indexOf(no) >= 0) idx = i; });
    if(idx < 0){ skipped.push(f.name); return; }
    jobs.push({ file:f, no:no, idx:idx });
  });
  jobs.sort(function(a, b){ return a.no - b.no; });
  await runUploads(jobs);
  if(skipped.length) toast(t('ignored') + skipped.join(', '), true);
}
function onSlot(input, idx, no){
  var f = input.files && input.files[0]; input.value = '';
  if(f) runUploads([{ file:f, no:no, idx:idx }]);
}
async function runUploads(jobs){
  if(!jobs.length) return;
  busy(true);
  var done = 0, old = [];
  try{
    for(var k = 0; k < jobs.length; k++){
      var j = jobs[k];
      S.uploadMsg = t('uploading') + ' ' + (k + 1) + '/' + jobs.length + ' · ' + j.file.name;
      var pg = document.getElementById('prog'); if(pg) pg.textContent = S.uploadMsg;
      var blob = await resizeImage(j.file);
      var path = S.cur.id + '/' + j.no + '_' + Date.now() + '.jpg';
      await uploadBlob(path, blob);
      var it = S.cur.items[j.idx];
      it.photos = (it.photos || []).filter(function(p){ if(p.no === j.no){ old.push(p.path); return false; } return true; });
      it.photos.push({ no:j.no, path:path, name:j.file.name });
      it.photos.sort(function(a, b){ return a.no - b.no; });
      S.urls[path] = URL.createObjectURL(blob);
      done++;
    }
  }catch(e){ toast(e.message, true); }
  finally{ busy(false); }
  S.uploadMsg = done ? done + t('uploaded') : '';
  markDirty(); renderEdit();
  if(done && S.cur.serial_no) await saveDraft(true);
  if(old.length) removePaths(old);
}
function removePhoto(idx, no){
  var it = S.cur.items[idx], gone = [];
  it.photos = (it.photos || []).filter(function(p){ if(p.no === no){ gone.push(p.path); return false; } return true; });
  markDirty(); renderEdit();
  saveDraft(true).then(function(ok){ if(ok) removePaths(gone); });
}

/* ===== save / workflow ===== */
function draftBody(){
  var r = S.cur;
  return { id:r.id, model:r.model || MODEL, serial_no:r.serial_no, lot_no:r.lot_no || null, po_no:r.po_no || null,
           inspect_date:r.inspect_date || today(), ship_date:r.ship_date || null, spec_rev:r.spec_rev, items:r.items, remark:r.remark || null };
}
async function checkDupSn(){
  var rows = await rest('/hshitek_reports?select=report_no&serial_no=eq.' + encodeURIComponent(S.cur.serial_no) + '&id=neq.' + S.cur.id);
  if(rows.length) return confirm(t('dupSn') + rows.map(function(x){ return x.report_no; }).join(', ') + '\n' + t('dupSn2'));
  return true;
}
function applyRow(row){
  var keep = S.cur;
  S.cur = row;
  if(!S.cur.inspector_name && keep.inspector_name) S.cur.inspector_name = keep.inspector_name;
  S.isNew = false; S.dirty = false; S.listLoaded = false;
  if(location.hash !== '#r/' + row.id) history.replaceState(null, '', '#r/' + row.id);
}
async function saveDraft(silent){
  if(!S.cur.serial_no){ toast(t('needSn'), true); var f = document.getElementById('fSn'); if(f) f.focus(); return false; }
  busy(true);
  try{
    if(S.isNew && !silent && !(await checkDupSn())) return false;
    var rows;
    if(S.isNew) rows = await rest('/hshitek_reports', { method:'POST', body:draftBody(), prefer:'return=representation' });
    else{ var b = draftBody(); delete b.id; rows = await rest('/hshitek_reports?id=eq.' + S.cur.id, { method:'PATCH', body:b, prefer:'return=representation' }); }
    applyRow(rows[0]);
    if(!silent) toast(t('savedT'));
    renderEdit();
    return true;
  }catch(e){ toast(e.message, true); return false; }
  finally{ busy(false); }
}
async function submitReport(){
  var nm = (document.getElementById('insName') || {}).value || '';
  var sg = padData('padI');
  if(!nm.trim()) return toast(t('needName'), true);
  if(!sg) return toast(t('needSign'), true);
  if(!S.cur.serial_no) return toast(t('needSn'), true);
  if(overallOf(S.cur.items) == null) return toast(t('e_judge'), true);
  if(S.cur.items.some(photoGap)) return toast(t('e_photo'), true);
  if(!confirm(t('confirmSubmit'))) return;
  busy(true);
  try{
    if(S.isNew && !(await checkDupSn())) return;
    var b = draftBody(); b.status = 'submitted'; b.inspector_name = nm.trim(); b.inspector_sign = sg;
    var rows;
    if(S.isNew) rows = await rest('/hshitek_reports', { method:'POST', body:b, prefer:'return=representation' });
    else{ delete b.id; rows = await rest('/hshitek_reports?id=eq.' + S.cur.id, { method:'PATCH', body:b, prefer:'return=representation' }); }
    applyRow(rows[0]); toast(t('submittedT')); renderEdit();
  }catch(e){ toast(e.message, true); }
  finally{ busy(false); }
}
async function approveReport(){
  var nm = (document.getElementById('apName') || {}).value || '';
  var sg = padData('padA');
  if(!nm.trim()) return toast(t('needName'), true);
  if(!sg) return toast(t('needSign'), true);
  if(S.cur.inspector_id && S.session && S.cur.inspector_id === S.session.user.id && !confirm(t('sameSigner'))) return;
  if(!confirm(t('confirmApprove'))) return;
  await patchStatus({ status:'approved', approver_name:nm.trim(), approver_sign:sg }, 'approvedT');
}
async function toDraft(){ if(confirm(t('confirmDraft'))) await patchStatus({ status:'draft' }, 'draftT'); }
async function revoke(){ if(confirm(t('confirmRevoke'))) await patchStatus({ status:'submitted' }, 'revokedT'); }
async function patchStatus(body, msg){
  busy(true);
  try{
    var rows = await rest('/hshitek_reports?id=eq.' + S.cur.id, { method:'PATCH', body:body, prefer:'return=representation' });
    applyRow(rows[0]); toast(t(msg)); renderEdit();
  }catch(e){ toast(e.message, true); }
  finally{ busy(false); }
}
async function deleteReport(){
  if(!confirm(t('confirmDel'))) return;
  busy(true);
  try{
    var paths = allPaths(S.cur);
    await rest('/hshitek_reports?id=eq.' + S.cur.id, { method:'DELETE' });
    await removePaths(paths);
    S.dirty = false; S.listLoaded = false; toast(t('deletedT')); go('#list');
  }catch(e){ toast(e.message, true); }
  finally{ busy(false); }
}

/* ===== print / PDF ===== */
async function printReport(){
  var imgs = Array.prototype.slice.call(document.querySelectorAll('#sheets img'));
  await Promise.all(imgs.map(function(im){ return im.complete ? 0 : new Promise(function(res){ im.onload = im.onerror = res; }); }));
  var old = document.title;
  document.title = (S.cur.report_no || 'HSI-new') + '_' + (S.cur.serial_no || '');
  window.print();
  setTimeout(function(){ document.title = old; }, 800);
}

window.addEventListener('hashchange', function(){ if(S.profile && S.view !== 'login' && S.view !== 'forbidden') go(location.hash || '#list'); });
init();
</script>
