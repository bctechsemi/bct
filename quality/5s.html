<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3정5S 관리 — BCT Quality</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/bctechsemi/bct/refs/heads/main/images/bct_favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/qc.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:18px}
.area{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.area .ah{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.area .an{font-size:18px;font-weight:700;letter-spacing:-.02em}
.area .am{font-size:12.5px;color:var(--ink2);margin-top:2px}
.score{display:flex;align-items:baseline;gap:10px}
.score b{font-size:40px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.score b small{font-size:16px;color:var(--ink2);margin-left:2px}
.grade{font-family:var(--mono);font-weight:700;font-size:13px;padding:4px 9px;border-radius:8px}
.g-A{background:var(--grn-bg);color:#1E7A53} .g-B{background:var(--pale);color:var(--deep)} .g-C{background:var(--amb-bg);color:#8E5C14} .g-D{background:var(--red-bg);color:var(--red-ink)} .g-x{background:var(--gry-bg);color:var(--ink2)}
.area .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.area .btn.pri{width:100%;padding:12px}

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.panel-h h2{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.act{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 14px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line2);cursor:pointer;text-align:left;width:100%;background:#fff;border-left:0;border-right:0;border-top:0}
.act:last-child{border-bottom:0}
.act:hover{background:var(--pale2)}
.act .is{font-size:14px;font-weight:600;line-height:1.35}
.act .sub{font-size:12.5px;color:var(--ink2);margin-top:2px}
.act .ph2{display:flex;gap:4px}
.mini{width:46px;height:34px;border-radius:7px;background:var(--gry-bg) center/cover no-repeat;border:1px solid var(--line2)}
@media (max-width:640px){.act{grid-template-columns:1fr auto}.act .ph2{display:none}.act>span:first-child{grid-column:1/-1;justify-self:start}}

.sect{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:18px}
.sect-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sect-h h2{margin:0;font-size:16px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10.5px;fill:var(--ink3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* 점검표 drawer */
.drawer.wide{width:min(820px,100%)}
.df{border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff}
.df .tot{font-size:14px;color:var(--ink2)}
.df .tot b{font-size:22px;color:var(--ink);margin-right:4px}
.cat-h{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--primary);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.cat-h:first-child{margin-top:0}
.cat-h:after{content:"";flex:1;height:1px;background:var(--line)}
.it{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.it.low{border-color:#F2C6C2;background:#FFFBFA}
.it .q{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.it .q .c{font-size:14px;line-height:1.45;flex:1;min-width:220px}
.it .q .c em{font-style:normal;font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink2);background:var(--gry-bg);padding:3px 8px;border-radius:5px;margin-right:6px}
.sc{display:flex;gap:4px;flex:none}
.sc button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff;font-family:var(--mono);font-weight:700;font-size:14px;cursor:pointer;color:var(--ink2)}
.sc button.na{width:auto;padding:0 9px;font-size:11.5px}
.sc button:hover{border-color:var(--primary)}
.sc button.on[data-v="1"],.sc button.on[data-v="2"]{background:var(--red);border-color:var(--red);color:#fff}
.sc button.on[data-v="3"]{background:var(--amber);border-color:var(--amber);color:#fff}
.sc button.on[data-v="4"],.sc button.on[data-v="5"]{background:var(--good);border-color:var(--good);color:#fff}
.sc button.on[data-v=""]{background:var(--ink2);border-color:var(--ink2);color:#fff}
.it .ex{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px;align-items:start}
.it .ex input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13.5px}
.it .phbtn{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:13px;cursor:pointer;background:#fff;white-space:nowrap}
.it .phbtn.has{border-color:var(--good);color:#1E7A53}
.it .phbtn input{display:none}
.it .phbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.it .flag{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--red-ink);font-weight:600}
.rubric{font-size:12px;color:var(--ink2);background:var(--pale2);border-radius:10px;padding:9px 12px;margin-bottom:14px;line-height:1.6}
.rubric table{border-collapse:collapse;margin-top:6px;width:100%}
.rubric td{padding:3px 6px;vertical-align:top;border-top:1px solid var(--line2)}
.rubric td:first-child{font-family:var(--mono);font-weight:700;width:28px;text-align:center}
.gal-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin:4px 0 8px}
.gal-h span{font-weight:400;color:var(--ink2);font-size:12px}
.gal{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scroll-snap-type:x mandatory}
.gal button{flex:none;width:150px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0;cursor:zoom-in;overflow:hidden;text-align:left;scroll-snap-align:start}
.gal img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.gal button span{display:block;font-size:11.5px;padding:5px 7px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref{display:flex;gap:10px;align-items:flex-start;margin-top:8px;background:var(--grn-bg);border-radius:10px;padding:8px 10px}
.ref .rt{flex:1;min-width:0;font-size:12.5px;line-height:1.5;color:#1E5E42}
.ref .rt b{font-weight:700;margin-right:4px}
.ref .rp{display:flex;gap:5px;flex:none}
.ref .rp button{width:58px;height:44px;border-radius:7px;border:1px solid #BFE3CF;background:#fff center/cover no-repeat;cursor:zoom-in;padding:0}
.rsel{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.rsel label{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;cursor:pointer;font-size:11.5px;color:var(--ink2)}
.rsel label:has(input:checked){border-color:var(--primary);box-shadow:0 0 0 2px rgba(31,78,156,.2)}
.rsel img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.rsel input{position:absolute;top:6px;left:6px}
.rsel span{display:block;padding:4px 6px}
.drow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.drow .s{font-family:var(--mono);font-weight:700;min-width:34px;text-align:center;border-radius:7px;padding:4px 8px}
.s1,.s2{background:var(--red-bg);color:var(--red-ink)} .s3{background:var(--amb-bg);color:#8E5C14} .s4,.s5{background:var(--grn-bg);color:#1E7A53} .sna{background:var(--gry-bg);color:var(--ink2)}
.ipair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ibox{position:relative;aspect-ratio:4/3;border-radius:12px;border:1px dashed var(--mist2);background:var(--pale2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink2);cursor:pointer;overflow:hidden}
.ibox.has{border-style:solid;border-color:var(--line)}
.ibox .lb{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;background:rgba(10,31,66,.72);color:#fff;padding:4px 8px;border-radius:6px}
.ibox input{display:none}
.ilist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow:auto}
.irow{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px}
.irow.off{opacity:.5}
.irow .c{flex:1;min-width:0}
.irow em{font-style:normal;font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--ink2);background:var(--gry-bg);padding:3px 8px;border-radius:5px;margin-right:6px}
@media print{ @page{size:A4 portrait;margin:12mm} }
.pdoc .sign td{height:46px;width:70px}
</style>
</head>
<body>
<main class="wrap">
  <div class="no-print">
    <div class="ph">
      <div>
        <div class="eyebrow"><i></i>Quality Control · 3정5S</div>
        <h1>3정5S 관리</h1>
        <p>구역별로 바람직한 모습(기준 사진)과 비교해 점수를 기록하고, 지적사항은 개선 전·후 사진으로 마무리합니다.<br><b>점검 시각: 매 근무일 16:20</b> (퇴근 10분 전 · 월~금, 공휴일 제외)</p>
      </div>
      <div class="actions">
        <button class="btn hidden" id="bItems" type="button">체크리스트 설정</button>
        <button class="btn" id="bNewAct" type="button"></button>
      </div>
    </div>

    <div class="areas" id="areas"><div class="empty">불러오는 중…</div></div>

    <div class="panel">
      <div class="panel-h"><h2><span class="badge red" id="actCnt">0</span>진행 중인 개선 요청</h2>
        <label class="chk"><input type="checkbox" id="showDone"> 완료 포함 (최근 90일)</label></div>
      <div id="actList"></div>
    </div>

    <section class="sect">
      <div class="sect-h"><h2>월별 점수 추이 (최근 12개월)</h2><div class="legend" id="legend"></div></div>
      <div class="chart" id="trend"></div>
    </section>

    <section class="sect">
      <div class="sect-h"><h2>점검 이력</h2></div>
      <div class="tbl-wrap" style="border:0">
        <table class="tbl" style="min-width:640px"><thead><tr><th>점검일</th><th>구역</th><th>점수</th><th>등급</th><th>점검자</th><th>지적</th><th>총평</th></tr></thead><tbody id="hist"></tbody></table>
      </div>
      <div class="cards" id="histCards"></div>
    </section>
  </div>
  <div class="print-only pdoc" id="printDoc"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer wide" id="drawer" aria-hidden="true">
  <div class="dh"><div class="t"><div class="no" id="dNo"></div><h2 id="dName"></h2></div><button class="x" type="button" id="dClose" aria-label="닫기"></button></div>
  <div class="db" id="dBody"></div>
  <div class="df hidden" id="dFoot"></div>
</aside>

<script src="./assets/qc.js"></script>
<script>
const { sb, esc, icon, toast, fld, nz } = QC;
const CATS3 = ['정품','정량','정위치'], CATS5 = ['정리','정돈','청소','청결','습관화'], CATS = [...CATS3, ...CATS5];
const STATUS = { open:'미조치', doing:'진행 중', done:'완료' };
/* 바람직한 정리정돈 기준 사진 (2026-11-25 촬영) — 구역 코드별 */
const REF = {
  'assets/5s/prod_01_floor1.jpg':      ['PROD', '작업장 전경 ①'],
  'assets/5s/prod_05_floor2.jpg':      ['PROD', '작업장 전경 ②'],
  'assets/5s/prod_02_cart.jpg':        ['PROD', '대차·카트 정위치'],
  'assets/5s/prod_03_test.jpg':        ['PROD', 'TEST 구역'],
  'assets/5s/prod_04_bench.jpg':       ['PROD', '작업대·부자재 선반'],
  'assets/5s/prod_06_tool_top.jpg':    ['PROD', 'Tool 정리 (상단)'],
  'assets/5s/prod_07_tool_front.jpg':  ['PROD', 'Tool 정리 (정면)'],
  'assets/5s/store_01_overview1.jpg':  ['STORE', '창고 전경 ①'],
  'assets/5s/store_04_overview2.jpg':  ['STORE', '창고 전경 ②'],
  'assets/5s/store_02_shelf.jpg':      ['STORE', '자재 선반'],
  'assets/5s/store_03_fg_shelf.jpg':   ['STORE', '완제품·반제품 선반'],
};
const refCap = p => (REF[p] || [, p.split('/').pop()])[1];
const refsFor = areaId => { const a = st.areas.find(x => x.id === areaId); return Object.keys(REF).filter(p => a && REF[p][0] === a.code); };
const CHECK_TIME = '16:20';   // 매 근무일 퇴근 10분 전 점검
const SCALE = [[5,'기준 사진과 같은 상태'],[4,'경미한 차이 1곳 (바로 고칠 수 있음)'],[3,'차이 2~3곳'],[2,'기준 상태가 일부만 유지됨'],[1,'기준과 다름 · 관리되지 않음']];
const SERIES = ['#1F4E9C','#C98A2B','#2FB57E','#7A5BC7','#D2453B'];
const st = { areas:[], items:[], audits:[], acts:[], people:{}, showDone:false, draft:null, drawerMode:null };
const who = id => (id && st.people[id]) || '';
const grade = p => p == null ? ['–','x'] : p >= 90 ? ['A 우수','A'] : p >= 80 ? ['B 양호','B'] : p >= 70 ? ['C 보통','C'] : ['D 미흡','D'];
const gradeTag = p => { const [t, k] = grade(p); return `<span class="grade g-${k}">${t}</span>`; };
const dday = d => { if(!d) return ''; const n = Math.round((new Date(d + 'T00:00:00+09:00') - new Date(QC.todayKST() + 'T00:00:00+09:00')) / 864e5);
  return n < 0 ? `<span class="badge red">D+${-n}</span>` : n <= 3 ? `<span class="badge amb">D-${n}</span>` : `<span class="badge gry">D-${n}</span>`; };
const addDays = (ds, n) => { const d = new Date(ds + 'T12:00:00+09:00'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); };
const areaName = id => (st.areas.find(a => a.id === id) || {}).name || '';

/* ---------- 데이터 ---------- */
async function load(){
  const since = new Date(); since.setMonth(since.getMonth() - 12);
  const done90 = new Date(Date.now() - 90*864e5).toISOString();
  let aq = sb.from('qc_5s_actions').select('*').order('due_date', {ascending:true, nullsFirst:false}).order('created_at');
  aq = st.showDone ? aq.or(`status.neq.done,done_at.gte.${done90}`) : aq.neq('status','done');
  const today = QC.todayKST();
  const [a, i, au, ac, p, h] = await Promise.all([
    sb.from('qc_5s_areas').select('*').order('sort'),
    sb.from('qc_5s_items').select('*').order('sort'),
    sb.from('qc_5s_audits').select('*').gte('audit_date', since.toISOString().slice(0,10)).order('audit_date', {ascending:false}).order('created_at', {ascending:false}),
    aq,
    sb.from('profiles').select('id,name,email'),
    sb.from('qc_holidays').select('d').eq('d', today),
  ]);
  if(a.error) return toast(a.error.message, true);
  const dow = new Date(today + 'T12:00:00+09:00').getUTCDay();
  st.workday = dow > 0 && dow < 6 && !((h && h.data) || []).length;
  st.areas = a.data; st.items = i.data || []; st.audits = au.data || []; st.acts = ac.data || [];
  st.people = Object.fromEntries((p.data||[]).map(x => [x.id, x.name || x.email]));
  render();
}
const activeAreas = () => st.areas.filter(a => a.active);
const itemsFor = areaId => st.items.filter(i => i.active && (!i.area_id || i.area_id === areaId))
  .sort((x, y) => CATS.indexOf(x.category) - CATS.indexOf(y.category) || x.sort - y.sort);

/* ---------- 렌더 ---------- */
function render(){
  const openBy = id => st.acts.filter(x => x.area_id === id && x.status !== 'done').length;
  const today = QC.todayKST(), afterDue = QC.hmKST(new Date()) >= CHECK_TIME;
  document.getElementById('areas').innerHTML = activeAreas().map(a => {
    const last = st.audits.find(x => x.area_id === a.id);
    const doneToday = st.audits.some(x => x.area_id === a.id && x.audit_date === today);
    const todayTag = !st.workday ? '' : doneToday ? '<span class="badge grn ko">오늘 점검 완료</span>'
      : afterDue ? '<span class="badge red ko">오늘 점검 미실시</span>' : `<span class="badge blu ko">오늘 ${CHECK_TIME} 점검 예정</span>`;
    return `<div class="area">
      <div class="ah"><div><div class="an">${esc(a.name)}</div><div class="am">${a.manager ? '담당 ' + esc(a.manager) : '담당자 미지정'}</div></div>${last ? gradeTag(last.score_pct) : '<span class="grade g-x">점검 전</span>'}</div>
      <div class="score"><b>${last && last.score_pct != null ? Math.round(last.score_pct) : '–'}<small>점</small></b>${todayTag}</div>
      <div class="meta"><span>${last ? `${last.audit_date} · ${esc(who(last.auditor))}` : '아직 점검 기록이 없습니다'}</span>
        <span>${openBy(a.id) ? `<span class="badge red">개선 ${openBy(a.id)}건</span>` : '<span class="badge grn ko">미결 없음</span>'}</span></div>
      <button class="btn pri" type="button" data-audit="${a.id}">${icon.plus}점검 시작</button></div>`;
  }).join('') || '<div class="empty">등록된 구역이 없습니다</div>';

  // 개선 요청
  const open = st.acts.filter(x => x.status !== 'done').length;
  document.getElementById('actCnt').textContent = open;
  document.getElementById('actList').innerHTML = st.acts.length ? st.acts.map(x => `
    <button type="button" class="act" data-act="${x.id}">
      <span class="badge ${x.status==='done'?'grn':x.status==='doing'?'amb':'red'} ko">${STATUS[x.status]}</span>
      <div><div class="is">${esc(x.issue)}</div><div class="sub">${esc(areaName(x.area_id))}${x.category ? ' · ' + esc(x.category) : ''} · ${x.assignee ? '담당 ' + esc(x.assignee) : '담당 미지정'}${x.due_date ? ' · 기한 ' + x.due_date : ''}</div></div>
      <span class="ph2"><span class="mini" data-img="${esc(x.before_photo||'')}"></span><span class="mini" data-img="${esc(x.after_photo||'')}"></span></span>
      <span>${x.status === 'done' ? '' : dday(x.due_date)}</span>
    </button>`).join('') : '<div class="empty" style="padding:26px">진행 중인 개선 요청이 없습니다</div>';
  document.querySelectorAll('#actList [data-img]').forEach(async el => { const u = el.dataset.img && await QC.fileUrl(el.dataset.img); if(u) el.style.backgroundImage = `url("${u}")`; });

  // 이력
  document.getElementById('hist').innerHTML = st.audits.length ? st.audits.map(x => `<tr data-view="${x.id}">
    <td class="dt">${x.audit_date}</td><td>${esc(areaName(x.area_id))}</td><td class="mn">${x.score_pct ?? '–'}% <span class="sub" style="display:inline">(${x.total_score}/${x.max_score})</span></td>
    <td>${gradeTag(x.score_pct)}</td><td>${esc(who(x.auditor))}</td><td data-cnt="${x.id}">–</td><td style="max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.comment||'')}</td></tr>`).join('')
    : '<tr><td colspan="7" class="empty">아직 점검 이력이 없습니다</td></tr>';
  document.getElementById('histCards').innerHTML = st.audits.map(x => `<button type="button" class="icard" data-view="${x.id}"><div class="body">
    <div class="top"><div class="nm">${esc(areaName(x.area_id))} · ${x.score_pct ?? '–'}%</div>${gradeTag(x.score_pct)}</div>
    <div class="meta">${x.audit_date} · ${esc(who(x.auditor))}</div></div></button>`).join('');
  fillFindingCounts();
  renderTrend();
}
async function fillFindingCounts(){
  if(!st.audits.length) return;
  const { data } = await sb.from('qc_5s_actions').select('audit_id').in('audit_id', st.audits.map(a => a.id));
  const m = {}; (data||[]).forEach(r => m[r.audit_id] = (m[r.audit_id]||0) + 1);
  document.querySelectorAll('[data-cnt]').forEach(td => td.textContent = m[td.dataset.cnt] ? m[td.dataset.cnt] + '건' : '–');
}

function renderTrend(){
  const months = []; const d = new Date(QC.todayKST() + 'T12:00:00+09:00'); d.setUTCDate(1);
  for(let k = 11; k >= 0; k--){ const x = new Date(d); x.setUTCMonth(x.getUTCMonth() - k); months.push(x.toISOString().slice(0,7)); }
  const areas = activeAreas();
  const W = 760, H = 220, L = 34, R = 12, T = 12, B = 26, pw = W-L-R, ph = H-T-B;
  const x = i => L + (i + .5) * pw / 12, y = v => T + ph - (v / 100) * ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="월별 3정5S 점수">`;
  [0,25,50,75,100].forEach(v => s += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#EDF1F7"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${v}</text>`);
  s += `<line x1="${L}" x2="${W-R}" y1="${y(80)}" y2="${y(80)}" stroke="#2FB57E" stroke-dasharray="4 4" opacity=".6"/>`;
  months.forEach((m, i) => s += `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${m.slice(2).replace('-','.')}</text>`);
  let any = false;
  areas.forEach((a, k) => {
    const pts = months.map((m, i) => { const xs = st.audits.filter(r => r.area_id === a.id && r.audit_date.startsWith(m) && r.score_pct != null);
      return xs.length ? { i, v: xs.reduce((t, r) => t + Number(r.score_pct), 0) / xs.length } : null; }).filter(Boolean);
    if(pts.length) any = true;
    const c = SERIES[k % SERIES.length];
    if(pts.length > 1) s += `<polyline fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" points="${pts.map(p => `${x(p.i)},${y(p.v)}`).join(' ')}"/>`;
    pts.forEach(p => s += `<circle cx="${x(p.i)}" cy="${y(p.v)}" r="3.6" fill="${c}"><title>${esc(a.name)} ${months[p.i]} ${p.v.toFixed(1)}점</title></circle>`);
  });
  if(!any) s += `<text x="${W/2}" y="${H/2}" text-anchor="middle">점검 기록이 쌓이면 추이가 표시됩니다</text>`;
  document.getElementById('trend').innerHTML = s + '</svg>';
  document.getElementById('legend').innerHTML = areas.map((a, k) => `<span><i style="background:${SERIES[k % SERIES.length]}"></i>${esc(a.name)}</span>`).join('') + '<span><i style="background:#2FB57E;opacity:.6"></i>목표 80점</span>';
}

/* ---------- 점검표 작성 ---------- */
function startAudit(areaId){
  const a = st.areas.find(x => x.id === areaId), items = itemsFor(areaId);
  if(!items.length) return toast('이 구역의 점검 항목이 없습니다. 체크리스트 설정에서 추가하세요', true);
  st.draft = { areaId, date: QC.todayKST(), comment:'', dirty:false, rows: items.map(i => ({ item:i, score:null, na:false, comment:'', file:null, preview:null, flag:false })) };
  st.drawerMode = 'audit';
  showDrawer('3정5S 점검표', a.name);
  renderAudit();
}
function renderAudit(){
  const dft = st.draft, body = document.getElementById('dBody');
  let html = `<div class="grid2" style="margin-bottom:12px">${fld('audit_date','점검일', dft.date, {type:'date', req:true})}<div class="f"><label>점검자</label><input value="${esc(who(QC.S.user.id))}" disabled></div></div>
    ${refsFor(dft.areaId).length ? `<div class="gal-h">바람직한 모습 (기준 사진)<span>눌러서 크게 보기</span></div>
    <div class="gal">${refsFor(dft.areaId).map(p => `<button type="button" data-ref="${esc(p)}"><img src="./${esc(p)}" alt="${esc(refCap(p))}" loading="lazy"><span>${esc(refCap(p))}</span></button>`).join('')}</div>` : ''}

      <table>${SCALE.map(([v, t]) => `<tr><td>${v}</td><td>${t}</td></tr>`).join('')}<tr><td>N/A</td><td>해당 없음 (합계에서 제외)</td></tr></table>
      2점 이하 항목은 <b>개선 요청</b>으로 자동 등록됩니다 — 현재 상태 사진을 함께 남겨 주세요.</div>`;
  let lastGroup = '';
  dft.rows.forEach((r, k) => {
    const g = CATS3.includes(r.item.category) ? '3정 (정품 · 정량 · 정위치)' : '5S (정리 · 정돈 · 청소 · 청결 · 습관화)';
    if(g !== lastGroup){ html += `<div class="cat-h">${g}</div>`; lastGroup = g; }
    const low = r.score != null && r.score <= 2;
    html += `<div class="it ${low?'low':''}" data-k="${k}">
      <div class="q"><div class="c"><em>${esc(r.item.category)}</em>${esc(r.item.content)}</div>
        <div class="sc">${[1,2,3,4,5].map(v => `<button type="button" data-v="${v}" class="${r.score===v?'on':''}" aria-label="${v}점" title="${(SCALE.find(s => s[0] === v) || [])[1] || ''}">${v}</button>`).join('')}<button type="button" data-v="" class="na ${r.na?'on':''}">N/A</button></div></div>
      ${refBox(r.item)}
      <div class="ex"><input type="text" data-cmt placeholder="의견 (선택)" value="${esc(r.comment)}">
        <label class="phbtn ${r.file?'has':''}">${icon.cam}${r.file?'사진 ✓':'사진'}<input type="file" accept="image/*" capture="environment" data-ph></label>
        ${low ? `<label class="flag"><input type="checkbox" data-flag ${r.flag?'checked':''}> 개선 요청 등록 (담당 ${esc(st.areas.find(a=>a.id===dft.areaId).manager || '미지정')}, 기한 +14일)</label>` : ''}</div></div>`;
  });
  html += `<div class="f" style="margin-top:14px"><label>총평</label><textarea data-total-cmt placeholder="잘된 점, 전반적인 상태">${esc(dft.comment)}</textarea></div>`;
  body.innerHTML = html;

function refBox(item){
  const ph = item.ref_photos || [];
  if(!item.ref_note && !ph.length) return '';
  return `<div class="ref"><div class="rt"><b>바람직한 모습</b>${esc(item.ref_note || '')}</div>
    ${ph.length ? `<div class="rp">${ph.map(p => `<button type="button" data-ref="${esc(p)}" title="${esc(refCap(p))}" style="background-image:url('./${esc(p)}')" aria-label="기준 사진: ${esc(refCap(p))}"></button>`).join('')}</div>` : ''}</div>`;
}
function updateAuditFoot(){
  const rows = st.draft.rows, scored = rows.filter(r => r.score != null), tot = scored.reduce((t, r) => t + r.score, 0), max = scored.length * 5;
  const left = rows.filter(r => r.score == null && !r.na).length, pct = max ? Math.round(tot * 1000 / max) / 10 : null;
  const f = document.getElementById('dFoot'); f.classList.remove('hidden');
  f.innerHTML = `<div class="tot"><b>${pct ?? '–'}${pct!=null?'점':''}</b> ${tot}/${max} · ${pct!=null?gradeTag(pct):''} ${left ? `<span style="margin-left:6px">미채점 ${left}개</span>` : ''}</div>
    <div style="display:flex;gap:8px"><button class="btn" type="button" data-cancel>취소</button><button class="btn pri" type="button" data-save ${left?'disabled':''}>점검 저장</button></div>`;
}
document.getElementById('dBody').addEventListener('click', e => {
  if(st.drawerMode !== 'audit') return;
  const rf = e.target.closest('[data-ref]'); if(rf) return QC.lightbox('./' + rf.dataset.ref);
  const b = e.target.closest('.sc button'); if(!b) return;
  const k = +b.closest('[data-k]').dataset.k, r = st.draft.rows[k];
  if(b.dataset.v === ''){ r.na = !r.na; r.score = null; } else { r.score = +b.dataset.v; r.na = false; }
  r.flag = r.score != null && r.score <= 2; st.draft.dirty = true;
  const keep = document.getElementById('dBody').scrollTop; renderAudit(); document.getElementById('dBody').scrollTop = keep;
});
document.getElementById('dBody').addEventListener('input', e => {
  if(st.drawerMode !== 'audit') return;
  if(e.target.name === 'audit_date') st.draft.date = e.target.value;
  if(e.target.matches('[data-total-cmt]')) st.draft.comment = e.target.value;
  if(e.target.matches('[data-cmt]')) st.draft.rows[+e.target.closest('[data-k]').dataset.k].comment = e.target.value;
  st.draft.dirty = true;
});
document.getElementById('dBody').addEventListener('change', e => {
  if(st.drawerMode === 'audit'){
    const k = e.target.closest('[data-k]') && +e.target.closest('[data-k]').dataset.k;
    if(e.target.matches('[data-flag]')) st.draft.rows[k].flag = e.target.checked;
    if(e.target.matches('[data-ph]') && e.target.files[0]){ st.draft.rows[k].file = e.target.files[0]; st.draft.dirty = true;
      const keep = document.getElementById('dBody').scrollTop; renderAudit(); document.getElementById('dBody').scrollTop = keep; }
  }
});
document.getElementById('dFoot').addEventListener('click', async e => {
  if(e.target.closest('[data-cancel]')) return closeDrawer();
  const sv = e.target.closest('[data-save]'); if(!sv) return;
  sv.disabled = true; sv.textContent = '저장 중…';
  try{ await saveAudit(); }catch(x){ toast('저장 실패: ' + x.message, true); sv.disabled = false; sv.textContent = '점검 저장'; }
});
async function saveAudit(){
  const dft = st.draft, area = st.areas.find(a => a.id === dft.areaId);
  if(!dft.date) throw new Error('점검일을 입력하세요');
  const { data:audit, error } = await sb.from('qc_5s_audits').insert({ area_id: dft.areaId, audit_date: dft.date, comment: nz(dft.comment) }).select().single();
  if(error) throw error;
  try{
    const scores = [];
    for(const r of dft.rows){
      const photo = r.file ? await QC.upload(r.file, `5s/${audit.id}`) : null;
      scores.push({ audit_id: audit.id, item_id: r.item.id, category: r.item.category, content: r.item.content, ref_note: r.item.ref_note || null, score: r.na ? null : r.score, comment: nz(r.comment), photo_path: photo });
      r.photo = photo;
    }
    const s1 = await sb.from('qc_5s_audit_scores').insert(scores); if(s1.error) throw s1.error;
    const acts = dft.rows.filter(r => r.flag && r.score != null && r.score <= 2).map(r => ({
      area_id: dft.areaId, audit_id: audit.id, category: r.item.category,
      issue: r.comment ? `${r.item.content} — ${r.comment}` : r.item.content,
      before_photo: r.photo, assignee: area.manager, due_date: addDays(dft.date, 14) }));
    if(acts.length){ const s2 = await sb.from('qc_5s_actions').insert(acts); if(s2.error) throw s2.error; }
    toast(`점검을 저장했습니다${acts.length ? ` · 개선 요청 ${acts.length}건 등록` : ''}`);
  }catch(x){
    await sb.from('qc_5s_audits').delete().eq('id', audit.id);   // 관리자가 아니면 실패할 수 있음
    throw x;
  }
  closeDrawer(true); await load();
}

/* ---------- 개선 요청 ---------- */

    ${fld('status','상태', x.status, {options: STATUS})}
    ${!isNew && x.status === 'done' ? `<div class="f"><label>완료</label><input disabled value="${x.done_at ? QC.fmtDT(x.done_at) : ''} ${esc(who(x.closed_by))}"></div>` : ''}
  </div>`, async fd => {
    const rec = { area_id: fd.get('area_id'), category: nz(fd.get('category')), issue: nz(fd.get('issue')), assignee: nz(fd.get('assignee')),
      due_date: nz(fd.get('due_date')), action_desc: nz(fd.get('action_desc')), status: fd.get('status') };
    if(rec.status === 'done' && !rec.action_desc) throw new Error('완료하려면 개선 내용을 입력하세요');
    if(rec.status === 'done' && !files.after && !x.after_photo && !confirm('개선 후 사진 없이 완료할까요?')) throw new Error('개선 후 사진을 등록하세요');
    if(files.before) rec.before_photo = await QC.upload(files.before, '5s/actions');
    if(files.after) rec.after_photo = await QC.upload(files.after, '5s/actions');
    const { error } = isNew ? await sb.from('qc_5s_actions').insert(rec) : await sb.from('qc_5s_actions').update(rec).eq('id', x.id);
    if(error) throw new Error(error.message);
    toast(rec.status === 'done' ? '개선 완료로 처리했습니다' : '저장했습니다');
    if(st.drawerMode === 'view') closeDrawer(true);
    await load();
  }, QC.isAdmin() && !isNew ? { extra:{ label:'삭제', run: async () => {
    if(!confirm('이 개선 요청을 삭제할까요? 되돌릴 수 없습니다.')) return false;
    const { error } = await sb.from('qc_5s_actions').delete().eq('id', x.id); if(error) throw new Error(error.message);
    toast('삭제했습니다'); if(st.drawerMode === 'view') closeDrawer(true); await load(); } } } : {});
  ['before','after'].forEach(async k => { const p = x[k+'_photo']; if(!p) return; const u = await QC.fileUrl(p); const b = f.querySelector(`[data-box="${k}"]`); if(u && b) b.style.backgroundImage = `url("${u}")`; });
  f.querySelectorAll('[data-file]').forEach(inp => inp.onchange = () => {
    const file = inp.files[0]; if(!file) return; files[inp.dataset.file] = file;
    const b = f.querySelector(`[data-box="${inp.dataset.file}"]`); b.classList.add('has'); b.querySelector('span:not(.lb)').textContent = '';
    b.style.backgroundImage = `url("${URL.createObjectURL(file)}")`;
  });
  f.querySelector('[name=area_id]').onchange = e => { const a = st.areas.find(v => v.id === e.target.value); const as = f.querySelector('[name=assignee]'); if(isNew && a && a.manager && !as.value) as.value = a.manager; };
}

/* ---------- 체크리스트 설정 (관리자) ---------- */
function openItems(areaFilter){
  const sel = areaFilter ?? '';
  const list = st.items.filter(i => (sel === '' ? !i.area_id : i.area_id === sel)).sort((x, y) => CATS.indexOf(x.category) - CATS.indexOf(y.category) || x.sort - y.sort);
  const area = st.areas.find(a => a.id === sel);
  QC.openModal('체크리스트 설정', `
    <div class="grid2" style="margin-bottom:12px">
      ${fld('scope','대상', sel, {options: [['','전 구역 공통'], ...st.areas.map(a => [a.id, a.name + ' 전용'])]})}
      ${area ? fld('manager', area.name + ' 담당자', area.manager || '', {attr:'data-manager'}) : '<div></div>'}
    </div>
    <div class="ilist">${list.map(i => `<div class="irow ${i.active?'':'off'}"><div class="c"><em>${esc(i.category)}</em>${esc(i.content)}</div>
      <button class="btn sm ghost" type="button" data-toggle="${i.id}">${i.active?'사용 안 함':'다시 사용'}</button>
      <button class="x" type="button" data-iedit="${i.id}" title="수정">${icon.edit}</button></div>`).join('') || '<div class="empty" style="padding:20px">항목이 없습니다</div>'}</div>
    <div class="hint" style="font-size:12.5px;color:var(--ink2);margin-top:10px">구역별 점검표 = 공통 항목 + 해당 구역 전용 항목. 항목을 바꿔도 이미 저장된 점검 결과는 그대로 유지됩니다.</div>`,
    async () => itemForm(null, sel), { ok:'+ 항목 추가' });
  const mb = document.querySelector('.modal.show .mb');
  mb.querySelector('[name=scope]').onchange = e => setTimeout(() => openItems(e.target.value), 0);
  const mg = mb.querySelector('[data-manager]');
  if(mg) mg.onchange = async () => { const { error } = await sb.from('qc_5s_areas').update({ manager: nz(mg.value) }).eq('id', sel);
    if(error) toast(error.message, true); else { toast('담당자를 저장했습니다'); area.manager = nz(mg.value); render(); } };
  mb.onclick = async e => {
    const t = e.target.closest('[data-toggle]');
    if(t){ const it = st.items.find(i => i.id === t.dataset.toggle);
      const { error } = await sb.from('qc_5s_items').update({ active: !it.active }).eq('id', it.id);
      if(error) return toast(error.message, true); it.active = !it.active; openItems(sel); return; }
    const ed = e.target.closest('[data-iedit]'); if(ed) itemForm(st.items.find(i => i.id === ed.dataset.iedit), sel);
  };
}
function itemForm(it, scope){
  const isNew = !it; it = it || { area_id: scope || null, category:'정리', sort: 100 };
  setTimeout(() => QC.openModal(isNew ? '점검 항목 추가' : '점검 항목 수정', `<div class="grid2">
    ${fld('area_id','대상', it.area_id || '', {options: [['','전 구역 공통'], ...st.areas.map(a => [a.id, a.name + ' 전용'])]})}
    ${fld('category','구분', it.category, {options: CATS.map(c => [c, (CATS3.includes(c)?'3정 · ':'5S · ') + c])})}
    ${fld('content','점검 내용', it.content, {area:true, req:true, full:true, hint:'"~되어 있다"처럼 예/아니오로 판단할 수 있게 쓰면 점검자마다 점수가 덜 흔들립니다.'})}
    ${fld('ref_note','바람직한 모습 (판단 기준)', it.ref_note, {area:true, full:true, hint:'기준 사진에서 무엇이 보여야 5점인지 적어 주세요. 예) 대차 2대가 노란 구획선 안에 나란히 있다'})}
    ${fld('sort','표시 순서', it.sort, {type:'number'})}
    <div class="f full"><label>기준 사진</label><div class="rsel">${Object.keys(REF).map(p => `<label><input type="checkbox" name="ref_photos" value="${esc(p)}" ${(it.ref_photos || []).includes(p) ? 'checked' : ''}><img src="./${esc(p)}" alt="" loading="lazy"><span>${esc(REF[p][0] === 'PROD' ? '생산 · ' : '창고 · ')}${esc(refCap(p))}</span></label>`).join('')}</div></div>
  </div>`, async fd => {
    const rec = { area_id: nz(fd.get('area_id')), category: fd.get('category'), content: nz(fd.get('content')), sort: Number(fd.get('sort')) || 0,
      ref_note: nz(fd.get('ref_note')), ref_photos: fd.getAll('ref_photos') };
    const { error } = isNew ? await sb.from('qc_5s_items').insert(rec) : await sb.from('qc_5s_items').update(rec).eq('id', it.id);
    if(error) throw new Error(error.message);
    toast('항목을 저장했습니다'); await load(); setTimeout(() => openItems(rec.area_id || ''), 0);
  }), 0);
}

/* ---------- 이벤트 ---------- */
document.getElementById('dClose').innerHTML = icon.x;
document.getElementById('bNewAct').innerHTML = icon.plus + '개선 요청';
document.getElementById('dClose').onclick = () => closeDrawer();
scrim.onclick = () => closeDrawer();
document.addEventListener('keydown', e => { if(e.key === 'Escape' && st.drawerMode && !document.querySelector('.modal.show')) closeDrawer(); });
document.getElementById('bNewAct').onclick = () => openAction();
document.getElementById('bItems').onclick = () => openItems('');
document.getElementById('areas').addEventListener('click', e => { const b = e.target.closest('[data-audit]'); if(b) startAudit(b.dataset.audit); });
document.getElementById('actList').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if(b) openAction(st.acts.find(x => x.id === b.dataset.act)); });
['hist','histCards'].forEach(id => document.getElementById(id).addEventListener('click', e => { const r = e.target.closest('[data-view]'); if(r) viewAudit(r.dataset.view); }));
document.getElementById('showDone').onchange = e => { st.showDone = e.target.checked; load(); };
addEventListener('beforeunload', e => { if(st.draft && st.draft.dirty){ e.preventDefault(); e.returnValue = ''; } });

QC.init('5s', async () => {
  document.getElementById('bItems').classList.toggle('hidden', !QC.isAdmin());
  await load();
  // 5s.html#PROD → 해당 구역 점검표 바로 열기
  const code = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  const a = code && activeAreas().find(v => v.code === code);
  if(a) startAudit(a.id);
});
</script>
</body>
</html>
