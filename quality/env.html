<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온습도 관리 — BCT Quality</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/bctechsemi/bct/refs/heads/main/images/bct_favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/qc.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* zone cards */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:18px}
.zone{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px}
.zone.out{border-color:#F2C6C2;box-shadow:inset 4px 0 0 var(--red)}
.zone .zh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.zone .zn{font-size:18px;font-weight:700;letter-spacing:-.02em}
.zone .zc{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-top:2px}
.vals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.val{background:var(--pale2);border-radius:13px;padding:12px 14px}
.val .l{font-size:12.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:6px}
.val .l span{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.val .n{font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.val .n small{font-size:15px;font-weight:600;color:var(--ink2);margin-left:2px}
.val.bad{background:var(--red-bg)} .val.bad .n{color:var(--red-ink)}
.zmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.slots{display:flex;gap:6px;align-items:center}
.slot{font-family:var(--mono);font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--gry-bg);color:var(--ink2)}
.slot.done{background:var(--grn-bg);color:#1E8A5D}
.slot.bad{background:var(--red-bg);color:var(--red-ink)}
.zone .btn.pri{width:100%;padding:12px}

/* deviations */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.panel-h h2{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.dev{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line2)}
.dev:last-child{border-bottom:0}
.dev .w{font-family:var(--mono);font-size:13px;font-weight:700;white-space:nowrap}
.dev .d{font-size:13.5px}
.dev .d b{color:var(--red)}

/* trend + log */
.sect{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:18px}
.sect-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sect-h h2{margin:0;font-size:16px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrls select,.ctrls input{padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:900px){.charts{grid-template-columns:1fr}}
.chart{border:1px solid var(--line2);border-radius:12px;padding:10px 12px 6px}
.chart .ct{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:4px}
.chart .ct span{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink3)}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:10.5px;fill:var(--ink3)}
.log-wrap{overflow:auto;margin-top:14px;border:1px solid var(--line2);border-radius:12px}
table.log{width:100%;border-collapse:collapse;font-size:13px;min-width:620px}
.log th{background:var(--pale2);font-size:12px;color:var(--ink2);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.log td{padding:7px 10px;border-bottom:1px solid var(--line2);text-align:center;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.log td.dt{text-align:left;color:var(--ink2)}
.log td.sun{color:var(--red)} .log td.sat{color:var(--primary)}
.log td.c{cursor:pointer}
.log td.c:hover{background:var(--pale)}
.log td.x{color:var(--red-ink);font-weight:700;background:var(--red-bg)}
.log tr.today td{background:#FFFBEF}
.log td.sep{border-left:1px solid var(--line)}
.live{font-size:13px;padding:9px 12px;border-radius:10px;background:var(--gry-bg);color:var(--ink2)}
.live.ok{background:var(--grn-bg);color:#1E8A5D}
.live.bad{background:var(--red-bg);color:var(--red-ink);font-weight:600}
.zlist{display:flex;flex-direction:column;gap:8px}
.zrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.zrow .t{flex:1;min-width:0}
.zrow .t b{display:block}
.zrow .t span{font-family:var(--mono);font-size:12px;color:var(--ink3)}
@media print{
  @page{size:A4 portrait;margin:10mm}
  .pdoc table.list td,.pdoc table.list th{font-size:8.5pt;padding:2px 3px}
}
.pdoc .sign td{height:46px;width:70px}
</style>
</head>
<body>
<main class="wrap">
  <div class="no-print">
    <div class="ph">
      <div>
        <div class="eyebrow"><i></i>Quality Control · Environment</div>
        <h1>온습도 관리</h1>
        <p>구역별 온도·습도를 기록하고, 기준을 벗어나면 조치 내용을 남깁니다.</p>
      </div>
      <div class="actions">
        <button class="btn hidden" id="bZones" type="button">구역 설정</button>
      </div>
    </div>

    <div class="zones" id="zones"><div class="empty">불러오는 중…</div></div>
    <div class="panel hidden" id="devPanel">
      <div class="panel-h"><h2><span class="badge red" id="devCnt">0</span>조치가 필요한 이탈 기록</h2></div>
      <div id="devList"></div>
    </div>

    <section class="sect">
      <div class="sect-h">
        <h2>월간 추이 · 기록부</h2>
        <div class="ctrls">
          <select id="selZone" aria-label="구역"></select>
          <input type="month" id="selMonth" aria-label="월">
          <button class="btn sm" id="bCsv" type="button"></button>
          <button class="btn sm" id="bPrint" type="button"></button>
        </div>
      </div>
      <div class="charts">
        <div class="chart"><div class="ct">온도 (°C)<span id="tRange"></span></div><div id="cTemp"></div></div>
        <div class="chart"><div class="ct">습도 (%RH)<span id="hRange"></span></div><div id="cHum"></div></div>
      </div>
      <div class="log-wrap"><table class="log" id="log"></table></div>
    </section>
  </div>
  <div class="print-only pdoc" id="printDoc"></div>
</main>

<script src="./assets/qc.js"></script>
<script>
const { sb, esc, icon, toast, fld, nz } = QC;
const st = { zones:[], inst:[], people:{}, latest:{}, today:{}, devs:[], month:[], zoneId:null, ym:'' };
const DOW = ['일','월','화','수','목','금','토'];
const n1 = v => v == null ? '' : Number(v).toFixed(1);
const rangeTxt = (lo, hi, u) => lo == null && hi == null ? '기준 없음' : `${lo ?? '−∞'} ~ ${hi ?? '∞'} ${u}`;
const who = id => (id && st.people[id]) || '';

/* ---------- 데이터 ---------- */
async function loadBase(){
  const [z, i, p] = await Promise.all([
    sb.from('qc_env_zones').select('*').order('sort').order('name'),
    sb.from('qc_instruments').select('id,mgmt_no,name,status').neq('status','disposed').order('seq'),
    sb.from('profiles').select('id,name,email'),
  ]);
  if(z.error) return toast(z.error.message, true);
  st.zones = z.data; st.inst = i.data || [];
  st.people = Object.fromEntries((p.data||[]).map(x => [x.id, x.name || x.email]));
}
const activeZones = () => st.zones.filter(z => z.active);

async function loadStatus(){
  const today = QC.todayKST();
  const since = new Date(today + 'T00:00:00+09:00').toISOString();
  const zs = activeZones();
  const [latest, todayR, devs] = await Promise.all([
    Promise.all(zs.map(z => sb.from('qc_env_readings').select('*').eq('zone_id', z.id).order('measured_at', {ascending:false}).limit(1))),
    sb.from('qc_env_readings').select('zone_id,slot,temp_out,hum_out').gte('measured_at', since),
    sb.from('qc_env_readings').select('*').or('temp_out.eq.true,hum_out.eq.true').is('action_taken', null).order('measured_at', {ascending:false}).limit(50),
  ]);
  st.latest = {}; zs.forEach((z, k) => st.latest[z.id] = latest[k].data && latest[k].data[0]);
  st.today = {}; (todayR.data||[]).forEach(r => { (st.today[r.zone_id] ||= []).push(r); });
  st.devs = devs.data || [];
}

async function loadMonth(){
  if(!st.zoneId || !st.ym) return;
  const [y, m] = st.ym.split('-').map(Number);
  const from = new Date(`${st.ym}-01T00:00:00+09:00`).toISOString();
  const to = new Date(`${m===12?y+1:y}-${String(m===12?1:m+1).padStart(2,'0')}-01T00:00:00+09:00`).toISOString();
  const { data, error } = await sb.from('qc_env_readings').select('*').eq('zone_id', st.zoneId).gte('measured_at', from).lt('measured_at', to).order('measured_at');
  if(error) return toast(error.message, true);
  st.month = data;
}

async function refresh(all){
  if(all) await loadBase();
  await Promise.all([loadStatus(), loadMonth()]);
  renderZones(); renderDevs(); renderMonth();
}

/* ---------- 구역 카드 ---------- */
function renderZones(){
  const zs = activeZones();
  document.getElementById('zones').innerHTML = zs.length ? zs.map(z => {
    const r = st.latest[z.id], t = st.today[z.id] || [];
    const slotCls = s => { const x = t.filter(v => v.slot === s); return !x.length ? '' : x.some(v => v.temp_out || v.hum_out) ? 'bad' : 'done'; };
    const slots = z.checks_per_day <= 2 ? ['AM','PM'].slice(0, z.checks_per_day).map(s => `<span class="slot ${slotCls(s)}">${s==='AM'?'오전':'오후'}</span>`).join('')
                                        : `<span class="slot ${t.length>=z.checks_per_day?'done':''}">오늘 ${t.length}/${z.checks_per_day}</span>`;
    const stale = r && (Date.now() - new Date(r.measured_at)) > 36e5 * 24;
    return `<div class="zone ${r && (r.temp_out||r.hum_out) ? 'out':''}">
      <div class="zh"><div><div class="zn">${esc(z.name)}</div><div class="zc">${esc(z.code)}</div></div>
        ${!r ? '<span class="badge gry ko">기록 없음</span>' : (r.temp_out||r.hum_out) ? '<span class="badge red ko">기준 이탈</span>' : stale ? '<span class="badge amb ko">24시간 이상 미측정</span>' : '<span class="badge grn ko">정상</span>'}</div>
      <div class="vals">
        <div class="val ${r&&r.temp_out?'bad':''}"><div class="l">온도<span>${rangeTxt(z.temp_min,z.temp_max,'°C')}</span></div><div class="n">${r?n1(r.temp):'–'}<small>°C</small></div></div>
        <div class="val ${r&&r.hum_out?'bad':''}"><div class="l">습도<span>${rangeTxt(z.hum_min,z.hum_max,'%')}</span></div><div class="n">${r?n1(r.humidity):'–'}<small>%</small></div></div>
      </div>
      <div class="zmeta"><span>${r ? `${QC.fmtDT(r.measured_at)} · ${esc(who(r.measured_by))}` : '아직 측정 기록이 없습니다'}</span><div class="slots">${slots}</div></div>
      <button class="btn pri" type="button" data-entry="${z.id}">${icon.plus}측정 기록</button>
    </div>`;
  }).join('') : `<div class="empty">등록된 구역이 없습니다${QC.isAdmin()?' — 구역 설정에서 추가하세요':''}</div>`;
}

function renderDevs(){
  const p = document.getElementById('devPanel');
  p.classList.toggle('hidden', !st.devs.length);
  document.getElementById('devCnt').textContent = st.devs.length;
  const zn = id => (st.zones.find(z => z.id === id) || {}).name || '';
  document.getElementById('devList').innerHTML = st.devs.map(r => `<div class="dev">
    <span class="w">${QC.fmtDT(r.measured_at)}</span>
    <span class="d">${esc(zn(r.zone_id))} · 온도 ${r.temp_out?`<b>${n1(r.temp)}°C</b>`:n1(r.temp)+'°C'} · 습도 ${r.hum_out?`<b>${n1(r.humidity)}%</b>`:n1(r.humidity)+'%'} <span style="color:var(--ink3)">· ${esc(who(r.measured_by))}</span></span>
    <button class="btn sm" type="button" data-act="${r.id}">조치 입력</button></div>`).join('');
}

/* ---------- SVG 라인차트 ---------- */
function lineChart(pts, lo, hi, unit, dayCount, color){
  const W = 600, H = 190, L = 34, R = 10, T = 10, B = 24, pw = W-L-R, ph = H-T-B;
  const vals = pts.map(p => p.v).concat([lo, hi].filter(v => v != null));
  if(!vals.length) return `<svg viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle">기록 없음</text></svg>`;
  let mn = Math.min(...vals), mx = Math.max(...vals); const pad = Math.max(1, (mx-mn)*.15); mn = Math.floor(mn-pad); mx = Math.ceil(mx+pad);
  const x = d => L + (d / dayCount) * pw, y = v => T + ph - ((v-mn)/(mx-mn)) * ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${unit} 추이">`;
  if(lo != null || hi != null){ const a = y(hi ?? mx), b = y(lo ?? mn); s += `<rect x="${L}" y="${a}" width="${pw}" height="${b-a}" fill="#2FB57E" opacity=".09"/>`;
    [lo, hi].forEach(v => { if(v != null) s += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#2FB57E" stroke-dasharray="4 4" opacity=".7"/>`; }); }
  for(let k = 0; k <= 4; k++){ const v = mn + (mx-mn)*k/4, yy = y(v);
    s += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#EDF1F7"/><text x="${L-6}" y="${yy+3.5}" text-anchor="end">${Math.round(v)}</text>`; }
  for(let d = 1; d <= dayCount; d += (d === 1 ? 4 : 5)) s += `<text x="${x(d-.5)}" y="${H-6}" text-anchor="middle">${d}</text>`;
  if(pts.length > 1) s += `<polyline fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" points="${pts.map(p => `${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')}"/>`;
  pts.forEach(p => s += `<circle cx="${x(p.d).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${p.out?4:2.6}" fill="${p.out?'#D2453B':color}"><title>${p.label}</title></circle>`);
  return s + '</svg>';
}

/* ---------- 월간 ---------- */
function monthDays(){ const [y, m] = st.ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function bySlot(){
  const map = {};
  st.month.forEach(r => { const d = QC.dateKST(r.measured_at); ((map[d] ||= {AM:[], PM:[]})[r.slot]).push(r); });
  return map;
}
function renderMonth(){
  const z = st.zones.find(v => v.id === st.zoneId); if(!z) return;
  const days = monthDays();
  document.getElementById('tRange').textContent = '기준 ' + rangeTxt(z.temp_min, z.temp_max, '°C');
  document.getElementById('hRange').textContent = '기준 ' + rangeTxt(z.hum_min, z.hum_max, '%');
  const pts = k => st.month.map(r => { const d = new Date(r.measured_at); const kd = Number(QC.dateKST(d).slice(8)); const h = Number(QC.hmKST(d).slice(0,2)), mi = Number(QC.hmKST(d).slice(3));
    return { d: kd - 1 + (h*60+mi)/1440, v: Number(r[k]), out: k==='temp' ? r.temp_out : r.hum_out, label: `${QC.fmtDT(d)}  ${n1(r[k])}` }; });
  document.getElementById('cTemp').innerHTML = lineChart(pts('temp'), z.temp_min, z.temp_max, '온도', days, '#1F4E9C');
  document.getElementById('cHum').innerHTML = lineChart(pts('humidity'), z.hum_min, z.hum_max, '습도', days, '#C98A2B');

  const map = bySlot(), today = QC.todayKST();
  const cell = (rs) => { if(!rs || !rs.length) return `<td class="sep">–</td><td>–</td><td>–</td><td>–</td>`;
    const r = rs[rs.length-1], more = rs.length > 1 ? ` +${rs.length-1}` : '';
    return `<td class="sep c" data-edit="${r.id}">${QC.hmKST(r.measured_at)}${more}</td><td class="c ${r.temp_out?'x':''}" data-edit="${r.id}">${n1(r.temp)}</td><td class="c ${r.hum_out?'x':''}" data-edit="${r.id}">${n1(r.humidity)}</td><td>${esc(who(r.measured_by))}</td>`; };
  let rows = '';
  for(let d = 1; d <= days; d++){
    const ds = `${st.ym}-${String(d).padStart(2,'0')}`, dow = new Date(ds + 'T12:00:00+09:00').getUTCDay(), e = map[ds] || {};
    rows += `<tr class="${ds===today?'today':''}"><td class="dt ${dow===0?'sun':dow===6?'sat':''}">${String(d).padStart(2,'0')} (${DOW[dow]})</td>${cell(e.AM)}${cell(e.PM)}</tr>`;
  }
  document.getElementById('log').innerHTML = `<thead><tr><th rowspan="2">일자</th><th colspan="4" class="sep">오전</th><th colspan="4" class="sep">오후</th></tr>
    <tr><th class="sep">시각</th><th>°C</th><th>%RH</th><th>측정자</th><th class="sep">시각</th><th>°C</th><th>%RH</th><th>측정자</th></tr></thead><tbody>${rows}</tbody>`;
}

/* ---------- 측정 입력 / 수정 ---------- */
function instOptions(sel){
  return [['', '(지정 안 함)'], ...st.inst.map(i => [i.id, `${i.mgmt_no} ${i.name}`])];
}
function openEntry(zoneId, r){
  const isNew = !r;
  const z0 = st.zones.find(z => z.id === (r ? r.zone_id : zoneId)) || activeZones()[0];
  const f = QC.openModal(isNew ? `${z0.name} 측정 기록` : '측정 기록 수정', `<div class="grid2">
    ${fld('zone_id','구역', z0.id, {options: activeZones().map(z => [z.id, z.name])})}
    ${fld('measured_at','측정 일시', QC.toLocalInput(r ? r.measured_at : new Date()), {type:'datetime-local', req:true})}
    ${fld('temp','온도 (°C)', r ? n1(r.temp) : '', {type:'number', req:true, attr:'step="0.1" min="-20" max="60" inputmode="decimal"'})}
    ${fld('humidity','습도 (%RH)', r ? n1(r.humidity) : '', {type:'number', req:true, attr:'step="0.1" min="0" max="100" inputmode="decimal"'})}
    <div class="full"><div class="live" id="liveChk">값을 입력하면 기준 충족 여부가 표시됩니다</div></div>
    ${fld('instrument_id','측정 온습도계', r ? (r.instrument_id||'') : (z0.instrument_id||''), {options: instOptions(), full:true, hint: st.inst.length ? '' : '계측기 관리에 온습도계를 등록하면 선택할 수 있습니다'})}
    ${fld('action_taken','이탈 시 조치내용', r && r.action_taken, {area:true, full:true, hint:'기준을 벗어난 경우 적어 주세요. 지금 모르면 비워 두고 나중에 "조치 입력"에서 남길 수 있습니다.'})}
    ${fld('note','비고', r && r.note, {full:true})}
  </div>`, async fd => {
    const rec = { zone_id: fd.get('zone_id'), measured_at: QC.fromLocalInput(fd.get('measured_at')),
      temp: Number(fd.get('temp')), humidity: Number(fd.get('humidity')), instrument_id: nz(fd.get('instrument_id')),
      action_taken: nz(fd.get('action_taken')), note: nz(fd.get('note')) };
    if(new Date(rec.measured_at) > new Date(Date.now() + 5*60e3)) throw new Error('미래 시각은 기록할 수 없습니다');
    const { error } = isNew ? await sb.from('qc_env_readings').insert(rec) : await sb.from('qc_env_readings').update(rec).eq('id', r.id);
    if(error) throw new Error(error.message);
    toast(isNew ? '측정값을 기록했습니다' : '수정했습니다'); await refresh();
  }, QC.isAdmin() && !isNew ? { extra:{ label:'삭제', run: async () => {
    if(!confirm('이 측정 기록을 삭제할까요? 되돌릴 수 없습니다.')) return false;
    const { error } = await sb.from('qc_env_readings').delete().eq('id', r.id); if(error) throw new Error(error.message);
    toast('삭제했습니다'); await refresh(); } } } : {});
  const chk = () => {
    const z = st.zones.find(v => v.id === f.zone_id.value), t = parseFloat(f.temp.value), h = parseFloat(f.humidity.value), el = f.querySelector('#liveChk');
    if(isNaN(t) && isNaN(h)){ el.className = 'live'; el.textContent = `기준: 온도 ${rangeTxt(z.temp_min,z.temp_max,'°C')} · 습도 ${rangeTxt(z.hum_min,z.hum_max,'%')}`; return; }
    const tOut = !isNaN(t) && ((z.temp_min != null && t < z.temp_min) || (z.temp_max != null && t > z.temp_max));
    const hOut = !isNaN(h) && ((z.hum_min != null && h < z.hum_min) || (z.hum_max != null && h > z.hum_max));
    el.className = 'live ' + (tOut || hOut ? 'bad' : 'ok');
    el.textContent = tOut || hOut ? `기준 이탈 — ${[tOut && `온도 ${rangeTxt(z.temp_min,z.temp_max,'°C')}`, hOut && `습도 ${rangeTxt(z.hum_min,z.hum_max,'%')}`].filter(Boolean).join(', ')} 벗어남. 조치내용을 남겨 주세요.` : '기준 이내입니다';
  };
  ['input','change'].forEach(ev => f.addEventListener(ev, e => { if(['temp','humidity','zone_id'].includes(e.target.name)) chk(); }));
  chk();
}

function openAction(r){
  const z = st.zones.find(v => v.id === r.zone_id) || {};
  QC.openModal('이탈 조치 입력', `<div class="grid2">
    <div class="full live bad">${esc(z.name)} · ${QC.fmtDT(r.measured_at)} · 온도 ${n1(r.temp)}°C (${rangeTxt(r.temp_min,r.temp_max,'°C')}) · 습도 ${n1(r.humidity)}% (${rangeTxt(r.hum_min,r.hum_max,'%')})</div>
    ${fld('action_taken','조치내용', '', {area:true, req:true, full:true, hint:'예) 제습기 가동, 30분 후 재측정 52% 확인'})}
  </div>`, async fd => {
    const { error } = await sb.from('qc_env_readings').update({ action_taken: nz(fd.get('action_taken')) }).eq('id', r.id);
    if(error) throw new Error(error.message);
    toast('조치내용을 저장했습니다'); await refresh();
  });
}

/* ---------- 구역 설정 (관리자) ---------- */
function openZones(){
  QC.openModal('구역 설정', `<div class="zlist">${st.zones.map(z => `<div class="zrow">
      <div class="t"><b>${esc(z.name)} ${z.active?'':'<span class="badge gry ko">사용 안 함</span>'}</b><span>${esc(z.code)} · 온도 ${rangeTxt(z.temp_min,z.temp_max,'°C')} · 습도 ${rangeTxt(z.hum_min,z.hum_max,'%')} · 하루 ${z.checks_per_day}회</span></div>
      <button class="btn sm ghost" type="button" data-link="${esc(z.code)}" title="태블릿/QR용 바로가기 링크 복사">링크 복사</button>
      <button class="btn sm" type="button" data-zedit="${z.id}">${icon.edit}수정</button></div>`).join('')}</div>`,
    async () => zoneForm(), { ok: '+ 구역 추가' });
  const box = document.querySelector('.modal.show .mb');
  box.onclick = async e => {
    const ed = e.target.closest('[data-zedit]'); if(ed){ zoneForm(st.zones.find(z => z.id === ed.dataset.zedit)); return; }
    const ln = e.target.closest('[data-link]');
    if(ln){ const url = location.href.split('#')[0] + '#' + ln.dataset.link;
      try{ await navigator.clipboard.writeText(url); toast('링크를 복사했습니다 — QR 생성기에 붙여 넣어 구역에 부착하세요'); }catch(_){ prompt('아래 링크를 복사하세요', url); } }
  };
}
function zoneForm(z){
  const isNew = !z; z = z || { sort: st.zones.length + 1, checks_per_day: 2, active: true };
  setTimeout(() => QC.openModal(isNew ? '구역 추가' : `${z.name} 설정`, `<div class="grid2">
    ${fld('name','구역명', z.name, {req:true})}
    ${fld('code','코드 (영문, 링크용)', z.code, {req:true, attr:'pattern="[A-Za-z0-9_-]+" style="text-transform:uppercase"'})}
    ${fld('temp_min','온도 하한 (°C)', z.temp_min, {type:'number', attr:'step="0.1"'})}
    ${fld('temp_max','온도 상한 (°C)', z.temp_max, {type:'number', attr:'step="0.1"'})}
    ${fld('hum_min','습도 하한 (%)', z.hum_min, {type:'number', attr:'step="0.1"'})}
    ${fld('hum_max','습도 상한 (%)', z.hum_max, {type:'number', attr:'step="0.1"'})}
    ${fld('checks_per_day','하루 측정 횟수', z.checks_per_day, {type:'number', attr:'min="1" max="6"'})}
    ${fld('sort','표시 순서', z.sort, {type:'number'})}
    ${fld('instrument_id','기본 온습도계', z.instrument_id||'', {options: instOptions(), full:true})}
    ${fld('active','사용 여부', String(z.active), {options:[['true','사용'],['false','사용 안 함']]})}
    ${fld('note','비고', z.note)}
    <div class="full hint" style="font-size:12.5px;color:var(--ink2)">기준값을 바꿔도 이미 기록된 측정값의 판정은 측정 당시 기준으로 유지됩니다.</div>
  </div>`, async fd => {
    const num = k => nz(fd.get(k)) == null ? null : Number(fd.get(k));
    const rec = { name: nz(fd.get('name')), code: String(fd.get('code')).trim().toUpperCase(), temp_min: num('temp_min'), temp_max: num('temp_max'),
      hum_min: num('hum_min'), hum_max: num('hum_max'), checks_per_day: num('checks_per_day') || 2, sort: num('sort') || 0,
      instrument_id: nz(fd.get('instrument_id')), active: fd.get('active') === 'true', note: nz(fd.get('note')) };
    if(!/^[A-Z0-9_-]+$/.test(rec.code)) throw new Error('코드는 영문·숫자·-·_ 만 사용할 수 있습니다');
    const { error } = isNew ? await sb.from('qc_env_zones').insert(rec) : await sb.from('qc_env_zones').update(rec).eq('id', z.id);
    if(error) throw new Error(/unique|duplicate/i.test(error.message) ? '이미 있는 코드입니다' : /check/i.test(error.message) ? '하한은 상한보다 작아야 합니다' : error.message);
    toast('구역 설정을 저장했습니다'); await refresh(true); fillZoneSelect();
  }), 0);
}

/* ---------- 출력 ---------- */
function exportCsv(){
  const z = st.zones.find(v => v.id === st.zoneId);
  const rows = st.month.map(r => [QC.dateKST(r.measured_at), QC.hmKST(r.measured_at), r.slot==='AM'?'오전':'오후', n1(r.temp), n1(r.humidity),
    r.temp_out||r.hum_out ? '이탈' : '정상', rangeTxt(r.temp_min,r.temp_max,'°C'), rangeTxt(r.hum_min,r.hum_max,'%'), who(r.measured_by)]);
  QC.csv([['일자','시각','구분','온도(°C)','습도(%RH)','판정','온도기준','습도기준','측정자'], ...rows], `BCT_온습도_${z.name}_${st.ym}.csv`);
}
function printLog(){
  const z = st.zones.find(v => v.id === st.zoneId), map = bySlot(), days = monthDays();
  const inst = st.inst.find(i => i.id === z.instrument_id);
  const c = rs => { if(!rs || !rs.length) return '<td></td><td></td><td></td>'; const r = rs[rs.length-1];
    return `<td>${n1(r.temp)}${r.temp_out?' ▲':''}</td><td>${n1(r.humidity)}${r.hum_out?' ▲':''}</td><td>${esc(who(r.measured_by))}</td>`; };
  let body = '';
  for(let d = 1; d <= days; d++){ const ds = `${st.ym}-${String(d).padStart(2,'0')}`, e = map[ds] || {};
    body += `<tr><td>${d}</td>${c(e.AM)}${c(e.PM)}</tr>`; }
  document.getElementById('printDoc').innerHTML = `
    <table class="hd" style="margin-bottom:6px"><tr><td rowspan="3" class="ttl" style="font-size:16pt;letter-spacing:.2em">온습도 관리 기록부</td>
      <td class="lbl">구역</td><td>${esc(z.name)}</td><td rowspan="3" style="padding:0;width:230px"><table class="sign" style="border:0"><tr><th>작성</th><th>검토</th><th>승인</th></tr><tr><td></td><td></td><td></td></tr></table></td></tr>
      <tr><td class="lbl">년월</td><td>${st.ym.replace('-','년 ')}월</td></tr>
      <tr><td class="lbl">측정기</td><td>${inst ? esc(inst.mgmt_no + ' ' + inst.name) : '—'}</td></tr></table>
    <div style="font-size:9pt;margin:0 0 4px">관리기준: 온도 ${rangeTxt(z.temp_min,z.temp_max,'°C')} · 습도 ${rangeTxt(z.hum_min,z.hum_max,'%RH')} &nbsp;(▲ 기준 이탈)</div>
    <table class="list"><thead><tr><th rowspan="2">일</th><th colspan="3">오전</th><th colspan="3">오후</th></tr>
      <tr><th>°C</th><th>%RH</th><th>측정자</th><th>°C</th><th>%RH</th><th>측정자</th></tr></thead><tbody>${body}</tbody></table>`;
  window.print();
}

/* ---------- 이벤트 ---------- */
function fillZoneSelect(){
  const s = document.getElementById('selZone');
  s.innerHTML = activeZones().map(z => `<option value="${z.id}" ${z.id===st.zoneId?'selected':''}>${esc(z.name)}</option>`).join('');
  if(!activeZones().some(z => z.id === st.zoneId)){ st.zoneId = activeZones()[0] && activeZones()[0].id; }
}
document.getElementById('bCsv').innerHTML = icon.dl + 'CSV';
document.getElementById('bPrint').innerHTML = icon.print + '기록부 인쇄';
document.getElementById('bCsv').onclick = exportCsv;
document.getElementById('bPrint').onclick = printLog;
document.getElementById('bZones').onclick = openZones;
document.getElementById('zones').addEventListener('click', e => { const b = e.target.closest('[data-entry]'); if(b) openEntry(b.dataset.entry); });
document.getElementById('devList').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if(b) openAction(st.devs.find(r => r.id === b.dataset.act)); });
document.getElementById('log').addEventListener('click', e => { const c = e.target.closest('[data-edit]'); if(c) openEntry(null, st.month.find(r => r.id === c.dataset.edit)); });
document.getElementById('selZone').onchange = async e => { st.zoneId = e.target.value; await loadMonth(); renderMonth(); };
document.getElementById('selMonth').onchange = async e => { if(!e.target.value) return; st.ym = e.target.value; await loadMonth(); renderMonth(); };

QC.init('env', async () => {
  st.ym = QC.todayKST().slice(0,7);
  document.getElementById('selMonth').value = st.ym;
  await loadBase();
  document.getElementById('bZones').classList.toggle('hidden', !QC.isAdmin());
  fillZoneSelect();
  await refresh();
  await openFromHash();
  addEventListener('hashchange', openFromHash);
});
// env.html#PROD → 해당 구역 측정 입력창 바로 열기 (태블릿·QR용)
async function openFromHash(){
  const code = decodeURIComponent(location.hash.slice(1)).toUpperCase();
  const z = code && activeZones().find(v => v.code === code);
  if(z){ st.zoneId = z.id; fillZoneSelect(); await loadMonth(); renderMonth(); openEntry(z.id); }
}
</script>
</body>
</html>
