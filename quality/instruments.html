<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계측기 관리 — BCT Quality</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/bctechsemi/bct/refs/heads/main/images/bct_favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/qc.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<main class="wrap">
  <div class="no-print">
    <div class="ph">
      <div>
        <div class="eyebrow"><i></i>Quality Control · Instruments &amp; Equipment</div>
        <h1 id="pTitle">계측기 관리</h1>
        <p id="pDesc"></p>
      </div>
      <div class="actions">
        <button class="btn" id="bCsv" type="button"></button>
        <button class="btn" id="bPrint" type="button"></button>
        <button class="btn pri" id="bAdd" type="button"></button>
      </div>
    </div>

    <div class="seg kindseg" id="kindSeg" style="margin-bottom:14px">
      <button type="button" data-v="instrument" class="on">계측기</button><button type="button" data-v="equip">설비 · 치공구</button>
    </div>
    <div class="kpis" id="kpis"></div>

    <div class="toolbar">
      <div class="search" id="srch"><input id="q" type="search" placeholder="관리번호, 이름, 모델, S/N, 제조사 검색"></div>
      <div class="seg" id="ownerSeg">
        <button type="button" data-v="" class="on">전체</button><button type="button" data-v="BCT">BCT</button><button type="button" data-v="아센디아">아센디아</button>
      </div>
      <label class="chk"><input type="checkbox" id="showDisposed"> 폐기 장비 표시</label>
    </div>

    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr>
          <th>관리번호</th><th></th><th id="thName">측정기명 / 규격</th><th>MODEL · S/N</th><th>제조사</th><th>자산주체</th>
          <th id="thType">교정구분</th><th id="thLast">최근 교정일</th><th id="thNext">차기 교정일</th><th id="thState">교정 상태</th><th>사용상태</th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="11" class="empty">불러오는 중…</td></tr></tbody>
      </table>
    </div>
    <div class="cards" id="cards"></div>
  </div>

  <!-- 인쇄용 관리대장 -->
  <div class="print-only pdoc" id="printDoc"></div>
</main>

<!-- 상세 drawer -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dh">
    <div class="t"><div class="no" id="dNo"></div><h2 id="dName"></h2></div>
    <button class="x" type="button" id="dClose" aria-label="닫기"></button>
  </div>
  <div class="db" id="dBody"></div>
</aside>

<!-- 모달 -->
<div class="modal" id="modal"><form class="mbox" id="mForm" novalidate>
  <div class="mh"><h3 id="mTitle"></h3><button class="x" type="button" id="mClose" aria-label="닫기"></button></div>
  <div class="mb" id="mBody"></div>
  <div class="mf"><span class="ferr" id="mErr"></span><button class="btn" type="button" id="mCancel">취소</button><button class="btn pri" type="submit" id="mOk">저장</button></div>
</form></div>

<script src="./assets/qc.js"></script>
<script>
const { sb, esc, icon, toast, fmtDate } = QC;

const CAL_TYPE = { external:'외부교정', internal:'사내관리', none:'교정불필요' };
const CAL_TYPE_EQ = { internal:'정기 점검·교체', external:'외부 교정', none:'사용 전 점검만' };
const KIND = { instrument:'계측기', equipment:'설비', tool:'치공구' };
const isInst = r => (r.kind || 'instrument') === 'instrument';
/* 탭별 문구: 계측기는 "교정", 설비·치공구는 "점검" */
const T = () => st.kind === 'instrument'
  ? { title:'계측기 관리', unit:'대', what:'계측기', name:'측정기명', act:'교정', doc:'BCT-QF-01 · 계측기 관리대장 (구 기-관리-001)', desc:'교정 일정과 이력을 한 곳에서 관리합니다.' }
  : { title:'설비 · 치공구 관리', unit:'대', what:'설비·치공구', name:'설비명', act:'점검', doc:'BCT-QF-13 · 설비 대장 (BCT-QP-12)', desc:'품질에 영향을 주는 설비와 치공구의 정기 점검·교체 주기와 이력을 관리합니다.' };
const typesOf = r => isInst(r) ? CAL_TYPE : CAL_TYPE_EQ;
const STATUS   = { active:'사용', standby:'비상용', repair:'수리중', disposed:'폐기' };
const RESULT   = { pass:'합격', conditional:'조건부', fail:'불합격' };
const STATE_FILTERS = () => [
  { key:'',          label:'전체 ' + T().what,  cls:'blu' },
  { key:'overdue',   label:T().act + ' 기한 초과', cls:'red' },
  { key:'due_soon',  label:'30일 이내 도래', cls:'amb' },
  { key:'no_record', label:T().act + '기록 없음', cls:'' },
  { key:'exempt',    label:T().act + ' 주기 없음',   cls:'grn' },
];

const st = { rows:[], all:[], kind:'instrument', q:'', owner:'', state:'', showDisposed:false, openId:null, cals:[] };

/* ---------- 상태 배지 ---------- */
function calBadge(r){
  switch(r.cal_state){
    case 'overdue':   return `<span class="badge red">D+${Math.abs(r.days_left)} 초과</span>`;
    case 'due_soon':  return `<span class="badge amb">D-${r.days_left}</span>`;
    case 'ok':        return `<span class="badge grn">D-${r.days_left}</span>`;
    case 'no_record': return `<span class="badge gry ko">기록 없음</span>`;
    case 'exempt':    return `<span class="badge gry ko">${typesOf(r)[r.cal_type]}</span>`;
    case 'disposed':  return `<span class="badge gry ko">폐기</span>`;
  }
  return '';
}
const statusBadge = s => `<span class="badge ${s==='active'?'blu':s==='repair'?'amb':'gry'} ko">${STATUS[s]||s}</span>`;
const calTypeTxt = r => r.cal_cycle_months && r.cal_type !== 'none' ? `${r.cal_type === 'external' ? '외부' : (isInst(r) ? '사내' : '점검')} · ${r.cal_cycle_months}개월` : typesOf(r)[r.cal_type];

/* ---------- 데이터 ---------- */
async function load(){
  const { data, error } = await sb.from('qc_instrument_status').select('*').order('seq', { ascending:true, nullsFirst:false }).order('mgmt_no');
  if(error){ toast('불러오기 실패: ' + error.message, true); return; }
  st.all = data;
  st.rows = data.filter(r => st.kind === 'instrument' ? isInst(r) : !isInst(r));
  render();
  if(st.openId) openDrawer(st.openId, true);
}

function filtered(){
  const q = st.q.trim().toLowerCase();
  return st.rows.filter(r =>
    (st.showDisposed || r.status !== 'disposed') &&
    (!st.owner || r.owner === st.owner) &&
    (!st.state || r.cal_state === st.state) &&
    (!q || [r.mgmt_no,r.name,r.spec,r.model,r.serial_no,r.maker,r.note,r.check_basis].some(v => v && String(v).toLowerCase().includes(q)))
  );
}

/* ---------- 렌더 ---------- */
function render(){
  const t = T();
  document.getElementById('pTitle').textContent = t.title;
  document.getElementById('pDesc').innerHTML = `${t.desc} <span class="doc">${t.doc}</span>`;
  document.getElementById('thName').textContent = t.name + ' / 규격';
  document.getElementById('thType').textContent = t.act + '구분';
  document.getElementById('thLast').textContent = '최근 ' + t.act + '일';
  document.getElementById('thNext').textContent = '차기 ' + t.act + '일';
  document.getElementById('thState').textContent = t.act + ' 상태';
  document.getElementById('bAdd').innerHTML = icon.plus + t.what + ' 등록';
  const base = st.rows.filter(r => (st.showDisposed || r.status !== 'disposed') && (!st.owner || r.owner === st.owner));
  const cnt = k => k ? base.filter(r => r.cal_state === k).length : base.length;
  document.getElementById('kpis').innerHTML = STATE_FILTERS().map(f =>
    `<button type="button" class="kpi ${f.cls} ${st.state===f.key?'on':''}" data-k="${f.key}">
       <div class="k"><i></i>${f.label}</div><div class="v">${cnt(f.key)}<small>${t.unit}</small></div></button>`).join('');

  const rows = filtered();
  const thumbs = [];
  document.getElementById('tbody').innerHTML = rows.length ? rows.map(r => {
    thumbs.push(r);
    return `<tr data-id="${r.id}">
      <td class="no">${esc(r.mgmt_no)}</td>
      <td><div class="thumb" data-thumb="${r.id}">${r.photo_front?'':icon.cam}</div></td>
      <td><div class="nm">${esc(r.name)}</div>${(!isInst(r) || r.spec)?`<div class="sub">${[!isInst(r) ? KIND[r.kind] : '', r.spec ? esc(r.spec) : ''].filter(Boolean).join(' · ')}</div>`:''}</td>
      <td class="mn">${esc(r.model||'-')}<div class="sub">${esc(r.serial_no||'')}</div></td>
      <td style="white-space:nowrap">${esc(r.maker||'')}</td>
      <td style="white-space:nowrap">${esc(r.owner)}</td>
      <td style="white-space:nowrap">${calTypeTxt(r)}</td>
      <td class="dt">${fmtDate(r.last_cal_date)||'—'}</td>
      <td class="dt">${fmtDate(r.next_due)||'—'}</td>
      <td>${calBadge(r)}</td>
      <td>${statusBadge(r.status)}</td>
    </tr>`;}).join('') : `<tr><td colspan="11" class="empty">${st.rows.length ? '조건에 맞는 ' + t.what + '가 없습니다' : '등록된 ' + t.what + '가 없습니다'}</td></tr>`;

  document.getElementById('cards').innerHTML = rows.length ? rows.map(r => `
    <button type="button" class="icard" data-id="${r.id}">
      <div class="thumb" data-thumb="${r.id}">${r.photo_front?'':icon.cam}</div>
      <div class="body">
        <div class="top"><div class="nm">${esc(r.name)}</div>${calBadge(r)}</div>
        <div class="meta">${esc(r.mgmt_no)} · ${esc(r.model||'-')} · ${esc(r.maker||'')}</div>
        <div class="meta">차기 ${t.act} ${fmtDate(r.next_due)||'—'} · ${STATUS[r.status]}</div>
      </div>
    </button>`).join('') : `<div class="empty">${st.rows.length ? '조건에 맞는 ' + t.what + '가 없습니다' : '등록된 ' + t.what + '가 없습니다'}</div>`;

  thumbs.forEach(async r => {
    if(!r.photo_front) return;
    const u = await QC.fileUrl(r.photo_front);
    if(u) document.querySelectorAll(`[data-thumb="${r.id}"]`).forEach(el => el.style.backgroundImage = `url("${u}")`);
  });
}

/* ---------- 상세 drawer ---------- */
const drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim');
function closeDrawer(){
  drawer.classList.remove('show'); scrim.classList.remove('show'); drawer.setAttribute('aria-hidden','true');
  st.openId = null; history.replaceState(null,'',location.pathname);
}
async function openDrawer(id, keepScroll){
  const r = st.rows.find(x => x.id === id); if(!r) return;
  st.openId = id;
  history.replaceState(null,'','#' + encodeURIComponent(r.mgmt_no));
  document.getElementById('dNo').textContent = r.mgmt_no + (r.owner !== 'BCT' ? ' · ' + r.owner + ' 자산' : '');
  document.getElementById('dName').textContent = r.name;
  const body = document.getElementById('dBody');
  const sc = body.scrollTop;
  const { data:cals, error } = await sb.from('qc_calibrations').select('*').eq('instrument_id', id).order('cal_date', { ascending:false });
  if(error) toast(error.message, true);
  st.cals = cals || [];
  const admin = QC.isAdmin(), A = isInst(r) ? '교정' : '점검';

  body.innerHTML = `
    <div class="sec">
      <div class="photos">
        ${['front','plate'].map(k => `<div class="ph-box ${r['photo_'+k]?'':'none'}" data-ph="${k}">
          <span class="lb">${k==='front'?'전면':'명판 · S/N'}</span>${r['photo_'+k]?'':'사진 없음'}
          <label>${r['photo_'+k]?'교체':'등록'}<input type="file" accept="image/*" capture="environment" data-up="${k}"></label></div>`).join('')}
      </div>
    </div>
    <div class="sec">
      <div class="sec-h"><h3>${A} 현황</h3>${calBadge(r)}</div>
      <dl class="kv">
        <dt>${A}구분</dt><dd>${calTypeTxt(r)}</dd>
        ${isInst(r) ? '' : `<dt>점검·수명 기준</dt><dd>${esc(r.check_basis)||'—'}</dd>`}
        <dt>최근 ${A}일</dt><dd class="mono">${fmtDate(r.last_cal_date)||'—'}${r.last_agency?' · '+esc(r.last_agency):''}</dd>
        <dt>차기 ${A}일</dt><dd class="mono">${fmtDate(r.next_due)||'—'}</dd>
      </dl>
    </div>
    <div class="sec">
      <div class="sec-h"><h3>${A} 이력 (${st.cals.length})</h3>${r.cal_type!=='none' || !isInst(r)?`<button class="btn sm pri" type="button" id="bCal">${icon.plus}${isInst(r) ? '교정 기록' : '점검·교체 기록'}</button>`:''}</div>
      <div class="hist">${st.cals.length ? st.cals.map(c => `
        <div class="hrow">
          <div class="d">${fmtDate(c.cal_date)} <span style="color:var(--ink3);font-weight:400">→ 차기 ${fmtDate(c.next_due)||'—'}</span></div>
          <div class="ops"><span class="badge ${c.result==='pass'?'grn':c.result==='fail'?'red':'amb'} ko">${RESULT[c.result]}</span>
            <button class="x" type="button" data-editcal="${c.id}" title="수정">${icon.edit}</button>
            ${admin?`<button class="x" type="button" data-delcal="${c.id}" title="삭제">${icon.trash}</button>`:''}</div>
          <div class="m">${[c.agency&&esc(c.agency), c.cert_no&&('성적서 '+esc(c.cert_no)), c.cost!=null&&(Number(c.cost).toLocaleString('ko-KR')+'원')].filter(Boolean).join(' · ')||'&nbsp;'}
            ${c.cert_path?` · <a href="#" data-cert="${esc(c.cert_path)}">성적서 보기</a>`:''}${c.note?`<br>${esc(c.note)}`:''}</div>
        </div>`).join('') : `<div class="empty" style="padding:22px;border:1px dashed var(--line);border-radius:12px">아직 ${A} 기록이 없습니다</div>`}
      </div>
    </div>
    <div class="sec">
      <div class="sec-h"><h3>${isInst(r) ? '장비' : KIND[r.kind]} 정보</h3><div style="display:flex;gap:6px">
        <button class="btn sm" type="button" id="bEdit">${icon.edit}수정</button>
        ${admin?`<button class="btn sm danger" type="button" id="bDel">${icon.trash}삭제</button>`:''}</div></div>
      <dl class="kv">
        <dt>관리번호</dt><dd class="mono">${esc(r.mgmt_no)}</dd>
        <dt>${isInst(r) ? '측정기명' : '이름'}</dt><dd>${esc(r.name)}</dd>
        ${isInst(r) ? '' : `<dt>구분</dt><dd>${KIND[r.kind]}</dd>`}
        <dt>규격</dt><dd>${esc(r.spec)||'—'}</dd>
        <dt>MODEL</dt><dd class="mono">${esc(r.model)||'—'}</dd>
        <dt>S/N</dt><dd class="mono">${esc(r.serial_no)||'—'}</dd>
        <dt>제조사</dt><dd>${esc(r.maker)||'—'}</dd>
        <dt>자산주체</dt><dd>${esc(r.owner)}</dd>
        <dt>사용부서</dt><dd>${esc(r.dept)}</dd>
        <dt>보관위치</dt><dd>${esc(r.location)||'—'}</dd>
        <dt>사용상태</dt><dd>${statusBadge(r.status)}</dd>
        <dt>비고</dt><dd>${esc(r.note)||'—'}</dd>
      </dl>
    </div>`;
  body.scrollTop = keepScroll ? sc : 0;

  ['front','plate'].forEach(async k => {
    const p = r['photo_'+k]; if(!p) return;
    const u = await QC.fileUrl(p); const box = body.querySelector(`[data-ph="${k}"]`);
    if(u && box){ box.style.backgroundImage = `url("${u}")`; box.dataset.src = u; }
  });
  drawer.classList.add('show'); scrim.classList.add('show'); drawer.setAttribute('aria-hidden','false');
}

document.getElementById('dBody').addEventListener('click', async e => {
  const r = st.rows.find(x => x.id === st.openId); if(!r) return;
  const t = e.target;
  if(t.closest('label') || t.matches('input')) return;
  const box = t.closest('.ph-box[data-src]'); if(box) return QC.lightbox(box.dataset.src);
  if(t.closest('#bCal')) return calForm(r);
  if(t.closest('#bEdit')) return instForm(r);
  if(t.closest('#bDel')){
    if(!confirm(`${r.mgmt_no} ${r.name}\n\n이 장비와 ${isInst(r) ? '교정' : '점검'} 이력 전체를 삭제합니다. 되돌릴 수 없습니다.\n사용하지 않는 장비는 삭제 대신 사용상태를 '폐기'로 바꾸는 것을 권장합니다.\n\n삭제할까요?`)) return;
    const { error } = await sb.from('qc_instruments').delete().eq('id', r.id);
    if(error) return toast('삭제 실패: ' + error.message, true);
    toast('삭제했습니다'); closeDrawer(); load(); return;
  }
  const ec = t.closest('[data-editcal]'); if(ec) return calForm(r, st.cals.find(c => c.id === ec.dataset.editcal));
  const dc = t.closest('[data-delcal]');
  if(dc){
    if(!confirm('이 교정 기록을 삭제할까요? 되돌릴 수 없습니다.')) return;
    const { error } = await sb.from('qc_calibrations').delete().eq('id', dc.dataset.delcal);
    if(error) return toast('삭제 실패: ' + error.message, true);
    toast('교정 기록을 삭제했습니다'); load(); return;
  }
  const cert = t.closest('[data-cert]');
  if(cert){ e.preventDefault(); const u = await QC.fileUrl(cert.dataset.cert); if(u) window.open(u, '_blank', 'noopener'); else toast('파일을 열 수 없습니다', true); }
});
document.getElementById('dBody').addEventListener('change', async e => {
  const inp = e.target.closest('[data-up]'); if(!inp || !inp.files[0]) return;
  const r = st.rows.find(x => x.id === st.openId); const k = inp.dataset.up;
  try{
    toast('사진 업로드 중…');
    const path = await QC.upload(inp.files[0], `instruments/${r.id}`);
    const { error } = await sb.from('qc_instruments').update({ ['photo_'+k]: path }).eq('id', r.id);
    if(error) throw error;
    toast('사진을 저장했습니다'); load();
  }catch(err){ toast('업로드 실패: ' + err.message, true); }
});

/* ---------- 모달 폼 ---------- */
const modal = document.getElementById('modal'), mForm = document.getElementById('mForm');
let onSubmit = null;
function openModal(title, html, submit, okLabel='저장'){
  document.getElementById('mTitle').textContent = title;
  document.getElementById('mBody').innerHTML = html;
  document.getElementById('mErr').textContent = '';
  document.getElementById('mOk').textContent = okLabel;
  document.getElementById('mOk').disabled = false;
  onSubmit = submit; modal.classList.add('show');
  setTimeout(() => { const f = mForm.querySelector('input:not([type=file]),select'); f && f.focus(); }, 60);
}
const closeModal = () => modal.classList.remove('show');
mForm.addEventListener('submit', async e => {
  e.preventDefault();
  const ok = document.getElementById('mOk'), err = document.getElementById('mErr');
  const bad = [...mForm.querySelectorAll('[required]')].find(i => !i.value.trim());
  if(bad){ err.textContent = (bad.dataset.label || '필수 항목') + '을(를) 입력하세요'; bad.focus(); return; }
  ok.disabled = true; err.textContent = '';
  try{ await onSubmit(new FormData(mForm)); closeModal(); }
  catch(x){ err.textContent = x.message || String(x); }
  finally{ ok.disabled = false; }
});
const fld = (name, label, val, opt={}) => `<div class="f ${opt.full?'full':''}"><label>${label}${opt.req?'<em>*</em>':''}</label>
  ${opt.options ? `<select name="${name}">${Object.entries(opt.options).map(([v,t])=>`<option value="${v}" ${String(val??'')===v?'selected':''}>${t}</option>`).join('')}</select>`
  : opt.area ? `<textarea name="${name}">${esc(val)}</textarea>`
  : `<input name="${name}" type="${opt.type||'text'}" value="${esc(val)}" ${opt.req?`required data-label="${label}"`:''} ${opt.attr||''}>`}
  ${opt.hint?`<div class="hint">${opt.hint}</div>`:''}</div>`;
const nz = v => { v = (v ?? '').toString().trim(); return v === '' ? null : v; };

function instForm(r){
  const isNew = !r, inst = isNew ? st.kind === 'instrument' : isInst(r);
  r = r || (inst ? { kind:'instrument', owner:'BCT', dept:'기술부', cal_type:'external', cal_cycle_months:12, status:'active' }
                 : { kind:'equipment', owner:'BCT', dept:'생산부', cal_type:'internal', cal_cycle_months:6, status:'active' });
  const pre = { instrument:'기술-', equipment:'설비-', tool:'공구-' };
  const numOf = k => pre[k] + (Math.max(0, ...st.all.filter(x => (x.mgmt_no||'').startsWith(pre[k])).map(x => +(/(\d+)$/.exec(x.mgmt_no)||[])[1] || 0)) + 1);
  const nextNo = isNew ? numOf(r.kind) : r.mgmt_no;
  openModal(isNew ? (inst ? '계측기 등록' : '설비 · 치공구 등록') : `${r.mgmt_no} 정보 수정`, `<div class="grid2">
    ${inst ? '' : fld('kind','구분', r.kind, {options:{ equipment:'설비', tool:'치공구' }})}
    ${fld('mgmt_no','관리번호', nextNo, {req:true})}
    ${fld('status','사용상태', r.status, {options:STATUS})}
    ${fld('name', inst ? '측정기명' : '이름', r.name, {req:true, full:true})}
    ${fld('spec','규격', r.spec)}
    ${fld('maker','제조사', r.maker)}
    ${fld('model','MODEL', r.model)}
    ${fld('serial_no','S/N', r.serial_no)}
    ${fld('owner','자산주체', r.owner, {attr:'list="ownerList"'})}
    ${fld('dept','사용부서', r.dept)}
    ${fld('cal_type', inst ? '교정구분' : '관리 방법', r.cal_type, {options: inst ? CAL_TYPE : CAL_TYPE_EQ})}
    ${fld('cal_cycle_months', inst ? '교정주기 (개월)' : '점검·교체 주기 (개월)', r.cal_cycle_months, {type:'number', attr:'min="1" max="120"', hint: inst ? '외부교정일 때 차기교정일 자동 계산에 사용' : '주기를 넣으면 차기 점검일을 자동 계산하고 기한을 알려 줍니다'})}
    ${inst ? '' : fld('check_basis','점검 · 수명 기준', r.check_basis, {full:true, hint:'예) 사용 전 작동 확인 / 토크 1.2 N·m ±10% 월 1회 측정 / 비트 5,000회 사용 후 교체'})}
    ${fld('location','보관위치', r.location, {full:true})}
    ${fld('note','비고', r.note, {area:true, full:true})}
    <datalist id="ownerList"><option value="BCT"><option value="아센디아"></datalist>
  </div>`, async fd => {
    const rec = {
      mgmt_no: nz(fd.get('mgmt_no')), name: nz(fd.get('name')), spec: nz(fd.get('spec')), maker: nz(fd.get('maker')),
      model: nz(fd.get('model')), serial_no: nz(fd.get('serial_no')), owner: nz(fd.get('owner')) || 'BCT', dept: nz(fd.get('dept')) || '기술부',
      cal_type: fd.get('cal_type'), cal_cycle_months: (inst && fd.get('cal_type')==='external') ? (+fd.get('cal_cycle_months') || 12) : (fd.get('cal_type')!=='none' && nz(fd.get('cal_cycle_months')) ? +fd.get('cal_cycle_months') : null),
      kind: inst ? 'instrument' : (fd.get('kind') || 'equipment'), check_basis: inst ? null : nz(fd.get('check_basis')),
      status: fd.get('status'), location: nz(fd.get('location')), note: nz(fd.get('note')),
    };
    if(isNew) rec.seq = Math.max(0, ...st.all.map(x => x.seq || 0)) + 1;
    if(isNew && !inst && rec.mgmt_no === nextNo) rec.mgmt_no = numOf(rec.kind);
    const q = isNew ? sb.from('qc_instruments').insert(rec).select('id').single() : sb.from('qc_instruments').update(rec).eq('id', r.id).select('id').single();
    const { data, error } = await q;
    if(error) throw new Error(/duplicate|unique/i.test(error.message) ? '이미 있는 관리번호입니다' : error.message);
    toast(isNew ? (inst ? '계측기를' : KIND[rec.kind] + '를') + ' 등록했습니다' : '수정했습니다');
    st.openId = data.id; await load();
  });
}

function calForm(r, c){
  const isNew = !c, A = isInst(r) ? '교정' : '점검'; c = c || { cal_date: QC.todayKST(), result:'pass' };
  openModal(`${r.mgmt_no} ${isInst(r) ? '교정' : '점검·교체'} ${isNew?'기록 추가':'기록 수정'}`, `<div class="grid2">
    ${fld('cal_date', A + '일', c.cal_date, {type:'date', req:true})}
    ${fld('next_due','차기 ' + A + '일', isNew ? '' : c.next_due, {type:'date', hint: r.cal_cycle_months ? `비워두면 ${A}일 + ${r.cal_cycle_months}개월로 자동 계산` : ''})}
    ${fld('agency', isInst(r) ? '교정기관' : '점검자 · 업체', c.agency, {attr:'list="agencyList"'})}
    ${fld('cert_no', isInst(r) ? '성적서 번호' : '내용 (교체 부품 등)', c.cert_no)}
    ${fld('result','판정', c.result, {options:RESULT})}
    ${fld('cost','비용 (원)', c.cost, {type:'number', attr:'min="0" step="1000"'})}
    <div class="f full"><label>${isInst(r) ? '성적서 파일' : '점검 기록 · 사진'} (PDF / 사진)</label><input type="file" name="cert" accept="application/pdf,image/*">
      ${c.cert_path?'<div class="hint">이미 등록된 파일이 있습니다. 새 파일을 고르면 교체됩니다.</div>':''}</div>
    ${fld('note','비고', c.note, {area:true, full:true})}
    <datalist id="agencyList">${[...new Set(st.cals.map(x=>x.agency).filter(Boolean))].map(a=>`<option value="${esc(a)}">`).join('')}</datalist>
  </div>`, async fd => {
    const rec = {
      instrument_id: r.id, cal_date: fd.get('cal_date'), next_due: nz(fd.get('next_due')),
      agency: nz(fd.get('agency')), cert_no: nz(fd.get('cert_no')), result: fd.get('result'),
      cost: nz(fd.get('cost')) == null ? null : Math.round(+fd.get('cost')), note: nz(fd.get('note')),
    };
    const file = fd.get('cert');
    if(file && file.size){
      if(file.size > 10*1024*1024) throw new Error('파일은 10MB 이하만 올릴 수 있습니다');
      rec.cert_path = await QC.upload(file, `instruments/${r.id}/certs`);
    }
    const { error } = isNew ? await sb.from('qc_calibrations').insert(rec) : await sb.from('qc_calibrations').update(rec).eq('id', c.id);
    if(error) throw new Error(error.message);
    toast(A + ' 기록을 저장했습니다'); await load();
  });
}

/* ---------- 출력 ---------- */
function exportCsv(){
  const t = T();
  const head = ['번호','관리번호',t.name,'구분','규격','MODEL','S/N','제조사','자산주체','사용부서',t.act+'구분',t.act+'주기(개월)','최근'+t.act+'일','차기'+t.act+'일',t.act+'상태','사용상태','점검·수명 기준','비고'];
  const label = { overdue:'기한초과', due_soon:'30일이내', ok:'정상', no_record:'기록없음', exempt:'교정제외', disposed:'폐기' };
  const rows = filtered().map((r,i) => [i+1, r.mgmt_no, r.name, KIND[r.kind||'instrument'], r.spec, r.model, r.serial_no, r.maker, r.owner, r.dept, typesOf(r)[r.cal_type], r.cal_cycle_months, fmtDate(r.last_cal_date), fmtDate(r.next_due), label[r.cal_state], STATUS[r.status], r.check_basis, r.note]);
  QC.csv([head, ...rows], `BCT_${st.kind === 'instrument' ? '계측기관리대장' : '설비대장'}_${QC.todayKST()}.csv`);
}
function printLedger(){
  if(st.kind !== 'instrument') return printEquip();
  const rows = st.rows.filter(r => r.status !== 'disposed');
  const who = (QC.S.profile && QC.S.profile.name) || '';
  document.getElementById('printDoc').innerHTML = `
    <table class="hd" style="margin-bottom:8px"><tr>
      <td class="lbl">문서번호</td><td>기-관리-001</td><td rowspan="3" class="ttl">계측기 관리대장</td><td class="lbl">작성자</td><td>${esc(who)}</td></tr>
      <tr><td class="lbl">문서구분</td><td>계측기관리대장(기술)</td><td class="lbl">관리부서</td><td>생산팀</td></tr>
      <tr><td class="lbl">출력일</td><td>${QC.todayKST()}</td><td class="lbl">대상</td><td>${rows.length}대</td></tr></table>
    <table class="list"><thead><tr><th>번호</th><th>관리번호</th><th>측정기명</th><th>규격</th><th>MODEL</th><th>S/N</th><th>제조사</th><th>자산주체</th><th>사용부서</th><th>최근교정일</th><th>차기교정일</th><th>교정주기</th><th>비고</th></tr></thead>
    <tbody>${rows.map((r,i) => `<tr><td>${i+1}</td><td>${esc(r.mgmt_no)}</td><td class="l">${esc(r.name)}</td><td>${esc(r.spec)}</td><td>${esc(r.model)}</td><td>${esc(r.serial_no)}</td><td>${esc(r.maker)}</td><td>${esc(r.owner)}</td><td>${esc(r.dept)}</td>
      <td>${r.cal_type==='external'?fmtDate(r.last_cal_date):'-'}</td><td>${r.cal_type==='external'?fmtDate(r.next_due):'-'}</td><td>${r.cal_type==='external'?(r.cal_cycle_months%12===0?r.cal_cycle_months/12+'년':r.cal_cycle_months+'개월'):'-'}</td>
      <td class="l">${r.cal_type==='external'?'':CAL_TYPE[r.cal_type]}${r.status==='standby'?' 비상용':''}</td></tr>`).join('')}</tbody></table>`;
  window.print();
}

function printEquip(){
  const rows = st.rows.filter(r => r.status !== 'disposed');
  document.getElementById('printDoc').innerHTML = `
    <table class="hd" style="margin-bottom:8px"><tr><td rowspan="2" class="ttl" style="font-size:16pt;letter-spacing:.2em">설비 · 치공구 대장</td>
      <td class="lbl">양식번호</td><td>BCT-QF-13</td><td class="lbl">출력일</td><td>${QC.todayKST()} · ${rows.length}대</td></tr>
      <tr><td class="lbl">관련 절차</td><td>BCT-QP-12</td><td class="lbl">관리부서</td><td>생산부</td></tr></table>
    <table class="list"><thead><tr><th>번호</th><th>관리번호</th><th>구분</th><th>이름</th><th>MODEL</th><th>S/N</th><th>위치</th><th>관리 방법</th><th>주기</th><th>최근 점검</th><th>차기 점검</th><th>점검 · 수명 기준</th></tr></thead>
    <tbody>${rows.map((r,i) => `<tr><td>${i+1}</td><td>${esc(r.mgmt_no)}</td><td>${KIND[r.kind]}</td><td class="l">${esc(r.name)}</td><td>${esc(r.model)}</td><td>${esc(r.serial_no)}</td><td>${esc(r.location)}</td>
      <td>${CAL_TYPE_EQ[r.cal_type]}</td><td>${r.cal_cycle_months ? r.cal_cycle_months + '개월' : '-'}</td><td>${fmtDate(r.last_cal_date)||'-'}</td><td>${fmtDate(r.next_due)||'-'}</td><td class="l">${esc(r.check_basis)}</td></tr>`).join('') || '<tr><td colspan="12">등록된 설비·치공구가 없습니다</td></tr>'}</tbody></table>`;
  window.print();
}

/* ---------- 이벤트 ---------- */
document.getElementById('kindSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || b.dataset.v === st.kind) return;
  st.kind = b.dataset.v; st.state = '';
  document.querySelectorAll('#kindSeg button').forEach(x => x.classList.toggle('on', x === b));
  st.rows = st.all.filter(r => st.kind === 'instrument' ? isInst(r) : !isInst(r));
  if(st.openId) closeDrawer();
  render();
});
document.getElementById('bCsv').innerHTML = icon.dl + 'Excel(CSV)';
document.getElementById('bPrint').innerHTML = icon.print + '관리대장 인쇄';
document.getElementById('srch').insertAdjacentHTML('afterbegin', icon.search);
document.getElementById('dClose').innerHTML = icon.x;
document.getElementById('mClose').innerHTML = icon.x;
document.getElementById('bAdd').onclick = () => instForm();
document.getElementById('bCsv').onclick = exportCsv;
document.getElementById('bPrint').onclick = printLedger;
document.getElementById('dClose').onclick = closeDrawer;
scrim.onclick = closeDrawer;
document.getElementById('mClose').onclick = closeModal;
document.getElementById('mCancel').onclick = closeModal;
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ if(modal.classList.contains('show')) closeModal(); else if(st.openId) closeDrawer(); } });
document.getElementById('q').addEventListener('input', e => { st.q = e.target.value; render(); });
document.getElementById('showDisposed').addEventListener('change', e => { st.showDisposed = e.target.checked; render(); });
document.getElementById('ownerSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  st.owner = b.dataset.v; document.querySelectorAll('#ownerSeg button').forEach(x => x.classList.toggle('on', x === b)); render();
});
document.getElementById('kpis').addEventListener('click', e => { const b = e.target.closest('.kpi'); if(b){ st.state = st.state === b.dataset.k ? '' : b.dataset.k; render(); } });
const rowClick = e => { const el = e.target.closest('[data-id]'); if(el) openDrawer(el.dataset.id); };
document.getElementById('tbody').addEventListener('click', rowClick);
document.getElementById('cards').addEventListener('click', rowClick);

QC.init('instruments', async () => {
  await load();
  const h = decodeURIComponent(location.hash.slice(1));               // instruments.html#기술-3 → 바로 열기
  if(h === 'equipment') document.querySelector('#kindSeg [data-v="equip"]').click();
  const hit = h && st.all.find(r => r.mgmt_no === h);
  if(hit && !isInst(hit) && st.kind === 'instrument') document.querySelector('#kindSeg [data-v="equip"]').click();
  if(hit) openDrawer(hit.id);
});
</script>
</body>
</html>
