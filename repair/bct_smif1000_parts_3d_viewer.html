<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMIF1000 부품 3D 뷰어 — BCT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1F4E9C; --primary-deep:#153B78; --primary-pale:#EAF1FC; --primary-pale-2:#F4F8FE;
  --surface:#F6F9FD; --backdrop:#EDF1F8; --ink:#0B1220; --steel:#5B6472; --steel-soft:#8A93A3;
  --hairline:#E2E8F3; --hairline-strong:#CBD8ED; --amber:#C98A2B;
  --font-en:'Google Sans',-apple-system,BlinkMacSystemFont,sans-serif; --font-ko:'Gowun Batang',serif; --font-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box} html,body{margin:0;height:100%}
body{background:var(--backdrop);color:var(--ink);font-family:var(--font-ko);display:flex;flex-direction:column}
.top{height:58px;flex:0 0 auto;background:var(--primary-deep);color:#fff;display:flex;align-items:center;gap:14px;padding:0 20px}
.top img{height:24px}
.top h1{margin:0;font-size:16px;font-family:var(--font-en);font-weight:700}
.top p{margin:2px 0 0;font:10.5px var(--font-mono);color:#AFC3E6;letter-spacing:.04em}
.main{flex:1;min-height:0;display:grid;grid-template-columns:250px 1fr 340px}
.list{background:#fff;border-right:1px solid var(--hairline);overflow:auto;padding:10px}
.item{width:100%;text-align:left;border:1.5px solid var(--hairline);background:var(--surface);border-radius:12px;padding:9px 12px;margin-bottom:8px;cursor:pointer}
.item b{display:block;font:700 12.5px var(--font-mono);color:var(--primary-deep)}
.item i{display:block;font:normal 11px var(--font-en);color:var(--steel);margin-top:2px}
.item.active{border-color:var(--primary);background:var(--primary-pale-2)}
.stage{position:relative;min-width:0}
#cv{width:100%;height:100%;display:block}
.bar{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
.bar button{font:600 12px var(--font-en);border:1px solid var(--hairline-strong);background:#fff;color:var(--primary-deep);border-radius:999px;padding:7px 13px;cursor:pointer}
.bar button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.hint{position:absolute;right:12px;top:10px;font:11px var(--font-mono);color:var(--steel-soft)}
.info{background:#fff;border-left:1px solid var(--hairline);overflow:auto;padding:18px}
.info h2{margin:0;font:700 17px var(--font-en)} .info .sub{font:11px var(--font-mono);color:var(--steel-soft);margin:4px 0 14px;letter-spacing:.03em}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;font-size:13px;margin-bottom:14px}
.kv span:nth-child(odd){font:700 10px var(--font-mono);color:var(--steel-soft);letter-spacing:.05em;text-transform:uppercase;padding-top:3px}
.sec{font:700 10px var(--font-mono);letter-spacing:.08em;color:var(--primary);margin:16px 0 6px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:7px 6px;border-bottom:1px solid var(--hairline);vertical-align:top} td:first-child{color:var(--steel);width:42%;font-size:12px}
.note{margin-top:12px;padding:10px 12px;border:1.5px dashed var(--amber);border-radius:8px;background:var(--surface);font-size:12px;line-height:1.55}
.dl{display:inline-block;margin-top:14px;font:600 12px var(--font-en);color:var(--primary-deep);text-decoration:none;border:1px solid var(--hairline-strong);border-radius:999px;padding:7px 13px;background:var(--primary-pale)}
@media (max-width:900px){.main{grid-template-columns:1fr;grid-template-rows:auto 56vh auto}.list{display:flex;gap:8px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--hairline)}.item{flex:0 0 auto;margin:0}.info{border-left:none}}
body.snap .top,body.snap .list,body.snap .info,body.snap .bar,body.snap .hint{display:none}
body.snap{background:#fff}body.snap .main{grid-template-columns:1fr}
</style>
</head>
